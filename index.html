urvival not mean it had been destined to succeed?", "a": "It experienced extreme mortality, food crises, conflict, and dependence on resupply. Tobacco and sustained investment changed its prospects; survival emerged from contingent developments.", "refs": [{"deck": "Lecture 6.pptx", "slide": 22, "text": "Jamestown Island"}, {"deck": "Lecture 6.pptx", "slide": 23, "text": "Virginia Company chartered lands after the second  charterin  1609 stretched from South Carolina to Maine."}]}, {"id": 21, "topic": "Puritans and Salem", "q": "Distinguish the Pilgrims from Winthrop’s Puritans.", "a": "Pilgrims were Separatists seeking to leave the Church of England; Winthrop’s Puritans sought religious reform and a model godly society. Shared Protestant commitments did not erase their differences.", "refs": [{"deck": "Lecture 7.pptx", "slide": 1, "text": "A City upon a Hill: John Winthrop and the Puritan Diaspora"}]}, {"id": 22, "topic": "Puritans and Salem", "q": "Why is “religious freedom for everyone” misleading for Puritan New England?", "a": "Their communities pursued a particular religious order and disciplined dissent. Their own religious aims did not imply pluralism or equal tolerance of competing beliefs.", "refs": [{"deck": "Lecture 7.pptx", "slide": 1, "text": "A City upon a Hill: John Winthrop and the Puritan Diaspora"}]}, {"id": 23, "topic": "Puritans and Salem", "q": "How did family migration affect New England’s expansion?", "a": "Migration of families and population reproduction helped establish durable communities and increased demand for land. Connect demographic growth to expansion and conflict.", "refs": [{"deck": "Lecture 8.pptx", "slide": 1, "text": "The Godly Commonwealth Puritan Families, Wars in the Woods, and the Salem Witchcraft Trials"}]}, {"id": 24, "topic": "Puritans and Salem", "q": "How should you connect Puritan childhood to religious beliefs?", "a": "Explain original sin, discipline, bodily practices, and fears of demonic influence in historical context. Use specific class examples and the assigned Puritan Childhood reading rather than calling the practices simply strange.", "refs": [{"deck": "Lecture 8.pptx", "slide": 1, "text": "The Godly Commonwealth Puritan Families, Wars in the Woods, and the Salem Witchcraft Trials"}]}, {"id": 25, "topic": "Puritans and Salem", "q": "What is spectral evidence, and why was it consequential at Salem?", "a": "Claims that an apparition or spirit of an accused person afflicted someone were treated as evidence. Such claims made accusation and verification difficult to separate. Mather cautioned against relying purely on spectral evidence while supporting prosecutions.", "refs": [{"deck": "Lecture 8.pptx", "slide": 52, "text": "After someone concluded that a loss, illness or death had been caused by witchcraft, the accuser would enter a complaint against the alleged witch with the local magistrates. If the accusation was deemed credible, the person would be arrested and brought in for public accusation. If the accused did not confess, they were “pressed” to do so. If the magistrates at this local level were satisfied that the complaint was well-founded, the prisoner was handed over to be dealt with by a superior court. The accused would be examined before a grand jury A person could be indicted on charges of afflicting with witchcraft, or for making an unlawful covenant with the Devil.   Once indicted, the defendant went to trial, sometimes on the same day. Judgment was quick and executions could occur in as little as a week. General Procedure"}, {"deck": "Lecture 8.pptx", "slide": 58, "text": "Cotton Mather A prominent intellectual who was asked to advise on the trials. Author of  Memorable Providences Relating to Witchcrafts and Possessions  (1689). Told the judges to be careful not to rely purely on “spectral evidence,” but also urged them to carry on with prosecuting suspected witches Writes  Wonders of the Invisible World  (1693) after the trials"}]}, {"id": 26, "topic": "Puritans and Salem", "q": "Why could confession encourage the spread of accusations?", "a": "Confession could offer a route away from execution, particularly when others were named, while destroying reputation and property. The incentive structure could generate further accusations rather than reliably establish guilt.", "refs": [{"deck": "Lecture 8.pptx", "slide": 57, "text": "Confession or Denial? If you confess, you might not be put to death, especially if you identified other accusers  If you confess, your reputation would be destroyed, and you might be put back in jail If you confess, you will lose all your property"}]}, {"id": 27, "topic": "Puritans and Salem", "q": "How do Sarah Good and Sarah Osborne help analyze social vulnerability?", "a": "Good faced poverty and exclusion; Osborne challenged expectations around property, marriage, and church participation. Compare their circumstances while avoiding a single-cause explanation for all accusations.", "refs": [{"deck": "Lecture 8.pptx", "slide": 42, "text": "Daughter of a prosperous innkeeper who committed suicide when Sarah was 17. Sarah was supposed to inherit some of the money when she came of age, but she never did Married a former indentured servant named Daniel Poole Poole died in deep debt 1682. Sarah was expected to pay the debt She married William Good and his lands were seized and sold to pay the debt to creditors By the time of the trials, Sarah and her husband were homeless, destitute and she was reduced to begging for work, food, and shelter from her neighbours Sarah Good[e] (1645-1692)"}, {"deck": "Lecture 8.pptx", "slide": 43, "text": "Sarah Osbourne (1643-1692)  Married a prominent man known as Robert Prince in 1662 but he died in 1674 She hired an Irish indentured servant to help her and then married him  The farm was supposed to be bequeathed to Prince’s sons, but Osbourne upset social norms by taking over the farm and running it with her new husband The case went to court Osbourne stopped attending church and had not attended for three years"}]}, {"id": 28, "topic": "Puritans and Salem", "q": "What does Giles Corey’s death reveal about legal coercion?", "a": "He was pressed while authorities tried to force a plea. Distinguish coercing entry of a plea from an ordinary execution following a conviction.", "refs": [{"deck": "Lecture 8.pptx", "slide": 37, "text": "Over  150 people   arrested and imprisoned 26  went to trial 19  of the accused were hanged (14 women and 5 men) and one man was crushed to death as they tried to force him to enter a plea Salem Trials"}, {"deck": "Lecture 8.pptx", "slide": 62, "text": "The Pressing of Giles Corey (September 1692) He was 81 years old"}]}, {"id": 29, "topic": "Puritans and Salem", "q": "Build a multi-cause explanation for Salem.", "a": "Connect religious assumptions and evidentiary practices to war and trauma, local rivalries, and social marginalization. Treat the medical explanation as a proposed retrospective explanation, not established fact.", "refs": [{"deck": "Lecture 8.pptx", "slide": 65, "text": "Some doctors, retrospectively trying to explain the witchcraft hysteria have blamed convulsive ergot poisoning caused by eating rye bread made from grain infected by the fungus Claviceps purpurea (which is the natural substance from which LSD is derived) Can lead to painful muscle spasms and  siezures  and hallucinations Medical Explanations"}, {"deck": "Lecture 8.pptx", "slide": 66, "text": "War and Trauma"}, {"deck": "Lecture 8.pptx", "slide": 67, "text": "Two Towns Salem Village was poor, isolated and split by land disputes and rivalries. This is where the accusations started Salem Town was much wealthier and more peaceful"}, {"deck": "Lecture 8.pptx", "slide": 68, "text": "Non-Conformists Many of the accused were independent women, people who were not strict Puritans and people who were social and religious outcasts "}]}, {"id": 30, "topic": "Indigenous resistance", "q": "Why did Opechancanough organize resistance in Virginia?", "a": "Land encroachment, tobacco expansion, coercive Christianization, and violence intensified conflict. Explain Indigenous agency and strategy rather than treating the attack as inexplicable hostility.", "refs": [{"deck": "Lecture 10.pptx", "slide": 4, "text": "Powhatan Revolt, 1622 1618- Powhatan dies and Opechancanough takes command Encroachment on native land with new tobacco growth (arrives in 1617)"}, {"deck": "Lecture 10.pptx", "slide": 6, "text": "Christian School Powhatan children were taken to be “civilized” and taught “Christianity” It failed and so entire families were brought into the village Only a few dozen families agreed."}, {"deck": "Lecture 10.pptx", "slide": 8, "text": "Nematonow - known by the English as “Jack Feathers” - was the Powhatan war chief The natives believed he had a power that meant he could not be harmed by the English In 1622, he convinced an English settler named Morgan to come with him to trade and then murdered him. He started wearing Morgan’s hat and he told the English that Morgan was dead. The English shot and killed  Nematonow"}, {"deck": "Lecture 10.pptx", "slide": 9, "text": "Opechancanough demanded retaliation.  The English threatened him with force and violence and so he agreed to be peaceful"}]}, {"id": 31, "topic": "Indigenous resistance", "q": "What changed in English policy after the 1622 attack?", "a": "The English increasingly collapsed distinctions between friendly and hostile Indigenous groups, used retaliatory violence, and conducted a propaganda campaign. The Crown revoked the Virginia Company charter in 1624.", "refs": [{"deck": "Lecture 10.pptx", "slide": 13, "text": "The English stopped differentiating between Native groups and between friendly and hostile Natives They went town-to-town killing as many Natives as they could find"}, {"deck": "Lecture 10.pptx", "slide": 16, "text": "The Virginia Company’s Pamphlet War"}, {"deck": "Lecture 10.pptx", "slide": 17, "text": "1624- The King stepped in and revoked the Virginia Company Charter and took control of Virginia"}]}, {"id": 32, "topic": "Indigenous resistance", "q": "Why does the Pequot War undermine a simple Europeans-versus-Natives binary?", "a": "English forces worked with Narragansett and Mohegan allies against the Pequots. The Mystic massacre and enslavement of survivors show the violence of that coalition.", "refs": [{"deck": "Lecture 10.pptx", "slide": 24, "text": "English Puritans searching for land relied on the Narragansetts and Mohegans to destroy the Pequots "}, {"deck": "Lecture 10.pptx", "slide": 25, "text": "The Mystic Massacre and the Pequot War (1636-1638) On May 26, 1637- a New England force accompanied by Narragansett and Mohegan allies burned down a Pequot village that they had surrounded. They killed between 400 and 700 men, women and children Survivors were sold into slavery"}]}, {"id": 33, "topic": "Indigenous resistance", "q": "What linked Christianization, land, and conflict in King Philip’s War?", "a": "English expansion and efforts to control Indigenous people intensified tensions; praying towns and the death of John Sassamon belong to this context. Use Metacomet’s coalition to show resistance and its limits.", "refs": [{"deck": "Lecture 10.pptx", "slide": 27, "text": "King Phillip’s War or  Metacomet’s  Rebellion (1675-1676)"}, {"deck": "Lecture 10.pptx", "slide": 29, "text": "In 1671, the English tried to disarm the Natives in New England"}, {"deck": "Lecture 10.pptx", "slide": 30, "text": "Praying Towns"}, {"deck": "Lecture 10.pptx", "slide": 31, "text": "King Philip’s War The war began when John Sassamon, a Harvard graduate who lived in a “Praying Town” reported that Metacomet or “King Phillip” was organizing an attack on New England towns Sassamon was found dead under a frozen pond  Three of his  Wompanoag  tribe members were arrested and hung  Wompanoag  tribe members attacked a New England town and wiped it out War was underway On March 12, 1676, the Indigenous launched an assault on Plymouth Colony in an effort to wipe out Plymouth Colony- It Failed"}, {"deck": "Lecture 10.pptx", "slide": 32, "text": "King Phillip’s War A battle in southern New England began that eventually stretched North into Maine 1.5% of all English colonists killed Over half of New England towns were assaulted"}]}, {"id": 34, "topic": "Indigenous resistance", "q": "Explain the Pueblo Revolt using several interacting causes.", "a": "Forced labor and tribute, land seizure, suppression of religion, drought, and punishment of religious leaders contributed. Popé helped coordinate resistance across communities in 1680.", "refs": [{"deck": "Lecture 10.pptx", "slide": 37, "text": "Background to the Pueblo Revolt of 1680 There were approximately 40,000 to 60,000 Pueblo natives when the Spanish invaded the region in 1598 and created the first permanent settlement with 129 soldiers and 10 Franciscan monks and a large number of settlers and livestock These Spanish conquistadors were brutal in their punishments of rebellion, enslaving people and cutting off parts of hands and feet. Spanish demanded tribute (taxes) and forced labor Spanish suppressed Pueblo religion."}, {"deck": "Lecture 10.pptx", "slide": 38, "text": "Popé's Rebellion of 1680 The most fertile lands were taken by Spanish colonists, and the Pueblo people were still forced to provide tribute Franciscan monks moved into Pueblo villages, demanding that they convert In the 1670s a drought swept through the region"}, {"deck": "Lecture 10.pptx", "slide": 39, "text": "Popé's Rebellion of 1680 In 1675, the Spanish governor captured 47 Pueblo medicine men and accused them of “sorcery” and 4 were sentenced to death (one committed suicide). The rest of the men were severely whipped and sent to prison or sold as slaves. Because of the drought conditions, the Apache were regularly invading and attacking the Spanish towns, killing both the Pueblo and the Spanish The Spanish forces left to fight the Apache and the Pueblo natives moved in and rescued their people, including the medicine man  Ohkay   Owingeh  or  Popé"}, {"deck": "Lecture 10.pptx", "slide": 40, "text": "Popé's Rebellion of 1680 Popé gathered support for a revolt among 46 surrounding towns. The Apache and Navajo joined the revolt, bringing nearly 2,500 natives against 170 Spanish soldiers, concentrated mostly in Santa Fe Popé promised that the ancient gods would return and bring wealth, health and prosperity when the Spanish were slaughtered"}]}, {"id": 35, "topic": "Indigenous resistance", "q": "Was the Pueblo Revolt simply a permanent Spanish defeat?", "a": "It expelled Spanish rule and produced a period of independence, but Spaniards reconquered parts of the region in 1692. Some communities remained outside their control; distinguish immediate success from later outcomes.", "refs": [{"deck": "Lecture 10.pptx", "slide": 41, "text": "Popé's Rebellion of 1680 Popé traveled from town to town and destroyed all Christian artifacts. Planting of wheat and barley was forbidden. Christian marriages were cast aside, and the couples were forced to remarry.  400 colonists were killed The Spanish were surrounded and the water supply was cut off but they were allowed to flee unharmed 2,000 Spanish remaining colonists fled"}, {"deck": "Lecture 10.pptx", "slide": 43, "text": "Spanish tried to reconquer the region in 1681 but managed to get little."}, {"deck": "Lecture 10.pptx", "slide": 44, "text": "The drought returned and Popé was deposed by his own people"}, {"deck": "Lecture 10.pptx", "slide": 45, "text": "Popé's Rebellion of  1680 The Spanish, afraid of French encroachments reconquered some of the area in 1692 after 12 years of Pueblo independence. He emphasized negotiation and he offered protection from other Native groups. Some of the people were never reconquered by the Spanish, including the Hopi In 1693, the Pueblo revolted again and there were harsh reprisals  In 169, the Pueblo revolted again and there were harsh reprisals "}]}, {"id": 36, "topic": "Bondage and slavery", "q": "Why is 1619 not a sufficient starting point for slavery across all territory that became the US?", "a": "It is a Virginia landmark, not the beginning of all slavery in the wider Americas or Spanish-controlled territories. The geographic and legal definitions in the question matter.", "refs": [{"deck": "Lecture 11.pptx", "slide": 6, "text": "Puerto Rico  The first African slaves arrived in Puerto Rico in 1513"}, {"deck": "Lecture 11.pptx", "slide": 8, "text": "Esteban de Dorantes The evidence suggests he was from Morocco and likely Muslim Born circa 1500 Likely multilingual  Sometimes known as  Estevanico"}, {"deck": "Lecture 11.pptx", "slide": 10, "text": "St. Augustine, Florida The oldest continually occupied European settlement in what became the United States Settled in 1565"}, {"deck": "Lecture 11.pptx", "slide": 11, "text": "1619 The first slaves arrived in Virginia in 1619. They were described as “twenty and odd negroes sold out of a  dutch  ship” to settlers in Virginia. "}, {"deck": "Lecture 11.pptx", "slide": 12, "text": "Came from Luanda, a Portuguese port in Angola About 50,000 people were sold out of Angola between 1618 to 1620 350 captives were sent on the  San Juan Batista  to Veracruz in Mexico They were intercepted by  The White Lion  and  The Treasurer.  The ship was looted and some of the African captives were taken to Virginia"}]}, {"id": 37, "topic": "Bondage and slavery", "q": "Why is Anthony Johnson useful for explaining change over time?", "a": "He acquired land, used the courts, and held enslaved people, while later racial exclusion affected the disposition of his land. His life complicates the assumption that status and legal rights were identical throughout colonial history.", "refs": [{"deck": "Lecture 11.pptx", "slide": 16, "text": "The Life of Anthony Johnson, Part 1 Imported into Virginia in 1621 and  sold  to an Englishman named Bennett as “Antonio a Negro” Grew tobacco on the Bennett family plantation and was one of the few in the colony who survived Opechancanough’s 1622 raid. Was respected for his “Hard labour and known service”"}, {"deck": "Lecture 11.pptx", "slide": 17, "text": "The Life of Anthony Johnson, Part 2 The Bennett’s began to allow Johnson to farm on his own. He married a woman named Mary and baptized his children. Johnson was allowed to work on his own almost exclusively, occasionally helping the Bennett’s. He moved with them to the Eastern Shore of Virginia, "}, {"deck": "Lecture 11.pptx", "slide": 18, "text": "The Life of Anthony Johnson, Part 3 In 1651, Johnson had saved enough to sponsor the entry of five servants into the colony- earning a 250 acre  headright Johnson’s son John earned a patent for 550 acres of land His son Richard owned a 100 acre estate Johnson’s plantation burned to the ground in 1653 and he petitioned a court for relief He was granted an abatement of his land taxes."}, {"deck": "Lecture 11.pptx", "slide": 19, "text": "The Life of Anthony Johnson, Part 4 Johnson purchased slaves and pursued them when they ran away Referred to as an “old Negro” in 1654 Johnson died in 1670. His wife survived him by a decade. In 1677 one of Anthony Johnson’s grandsons purchased a tract of land and called it “Angola.”"}, {"deck": "Lecture 11.pptx", "slide": 20, "text": "Anthony Johnson and the Courts in 1670 “By virtue of a  writt  granted to me from [names listed here, which are illegible] John Stringer  Escheator  for the  countys  of  Northhampton  and Accomack to enquire what lands  Anthonio  Johnson late of Accomack County either in his life  tyme . . . a jury of free. . . in the said Accomack County to enquire. . . doth declare that the said Anthony Johnson lately deceased in his life  tyme  was seized of fifty acres of land now in the possession of Rich. Johnson in the County of Accomack aforesaid and further that the said Anthony  Johnson was a negro and by consequence an alien  and for that cause the said land doth escheat to this . . . .” They ruled that his lands belonged to the English Crown"}]}, {"id": 38, "topic": "Bondage and slavery", "q": "What did Virginia’s 1662 rule change or establish about inherited status?", "a": "A child’s free or enslaved condition followed the mother. Explain how this helped reproduce hereditary bondage across generations.", "refs": [{"deck": "Lecture 11.pptx", "slide": 25, "text": "Partus  Sequitur  Ventrem -  “The Offspring follows the womb” 1662 -Possibility of life servitude for Blacks and hereditary slavery: “Whereas some doubts have arisen whether children got by any Englishmen upon a Negro shall be slave or Free, Be it therefore enacted and declared by this present Grand assembly, that all children born in this country shall be held bond or free only according to the condition of the mother.\""}]}, {"id": 39, "topic": "Bondage and slavery", "q": "How did Barbados connect to slavery elsewhere in British America?", "a": "Its 1661 slave code became a model for codes in other British colonies. The institution developed through an Atlantic network rather than in isolated mainland colonies.", "refs": [{"deck": "Lecture 11.pptx", "slide": 23, "text": "The Emergence of Slave Codes in the British Americas The Barbados slave code of 1661 marked the beginning of the legal codification of slavery in the British Atlantic. The Barbados Assembly re-enacted the slave code, with minor modifications, in 1676, 1682, and 1688.  The Barbados slave code also served as the basis for the slave codes adopted in several other British colonies, including Jamaica (1664), South Carolina (1696), and Antigua (1702) and Virginia (1705)."}]}, {"id": 40, "topic": "Bondage and slavery", "q": "Why does the Massachusetts Body of Liberties not establish that Massachusetts prohibited slavery?", "a": "Its protections included exceptions permitting certain forms of bondage and captivity. Read the exceptions alongside the language of liberty.", "refs": [{"deck": "Lecture 11.pptx", "slide": 29, "text": "MASSACHUSETTS BODY OF LIBERTIES, 1641 No mans life shall be taken away, no mans honor or good name shall be stained, no mans person shall be arrested, restrained, banished, dismembered, nor any ways punished, no man shall be deprived of his wife or children, no mans goods or estate shall be taken away from him, nor any way damaged under color of law or Countenance of Authority, unless it be by virtue or equity of some express law of the Country warranting the same, established by a general Court and sufficiently published, or in case of the defect of a law in any particular case by the word of God. "}, {"deck": "Lecture 11.pptx", "slide": 30, "text": "MASSACHUSETTS BODY OF LIBERTIES, 1641 Every person within this Jurisdiction, whether Inhabitant or  foreiner  shall enjoy the same justice and law, that is  generall  for the plantation, which we constitute and execute one towards another without partiality or delay. "}, {"deck": "Lecture 11.pptx", "slide": 31, "text": "MASSACHUSETTS BODY OF LIBERTIES, 1641 If any man smite out the eye or tooth of his man-servant, or maid servant, or otherwise maim or much disfigure him, unless it be by mere casualty, he shall let them go free from his service. And shall have such further recompense as the Court shall allow him. "}, {"deck": "Lecture 11.pptx", "slide": 32, "text": "MASSACHUSETTS BODY OF LIBERTIES, 1641 Servants that have served diligently and faithfully to the benefit of their masters seven years, shall not be sent away empty. And if any have been unfaithful, negligent or unprofitable in their service, notwithstanding the good usage of their masters, they shall not be dismissed till they have made satisfaction according to the Judgement of Authority. "}, {"deck": "Lecture 11.pptx", "slide": 33, "text": "MASSACHUSETTS BODY OF LIBERTIES, 1641 There shall never be any bond slavery, villeinage or captivity amongst us unless it be lawful Captives taken in just wars, and such strangers as willingly sell themselves or are sold to us . And these shall have all the liberties and Christian usages which the law of god established in Israel concerning such persons does morally require. This exempts none from servitude who shall be Judged thereto by Authority. "}]}, {"id": 41, "topic": "Bondage and slavery", "q": "Distinguish indentured servitude from hereditary slavery.", "a": "Compare duration, inheritance of status, legal protections, and avenues of redress. Both were coercive or restrictive forms of labor, but they were not interchangeable legal institutions.", "refs": [{"deck": "Lecture 11.pptx", "slide": 22, "text": "One Definition? Slavery “exists when a person is traded or captured and subsequently owes  lifelong obligations to another or when the condition is assumed to be lifelong and hereditary from birth.”"}, {"deck": "Lecture 11.pptx", "slide": 31, "text": "MASSACHUSETTS BODY OF LIBERTIES, 1641 If any man smite out the eye or tooth of his man-servant, or maid servant, or otherwise maim or much disfigure him, unless it be by mere casualty, he shall let them go free from his service. And shall have such further recompense as the Court shall allow him. "}, {"deck": "Lecture 11.pptx", "slide": 32, "text": "MASSACHUSETTS BODY OF LIBERTIES, 1641 Servants that have served diligently and faithfully to the benefit of their masters seven years, shall not be sent away empty. And if any have been unfaithful, negligent or unprofitable in their service, notwithstanding the good usage of their masters, they shall not be dismissed till they have made satisfaction according to the Judgement of Authority. "}, {"deck": "Lecture 11.pptx", "slide": 52, "text": "An  Unfree  World Apprecticeships Indenture Servitude Convict  Labor Vagrancy Laws"}, {"deck": "Lecture 11.pptx", "slide": 59, "text": "Servitude versus Slavery and the Law Not permanent Not inheritable Not protected by bounds of “subjecthood”"}]}, {"id": 42, "topic": "Bondage and slavery", "q": "Why might formal legal protections fail to protect an enslaved person?", "a": "Restrictions on testimony and unequal access to courts made enforcement difficult. A rule on paper is not proof of protection in practice.", "refs": [{"deck": "Lecture 11.pptx", "slide": 47, "text": "Standard US Slave Codes No slave could testify in court, except in a case involving another slave. It was illegal for a slave holder to work slaves in the field on Sundays, except as punishment  or  unless they were paid. Any slave who went away from his/her plantation had to have a pass. The slave had to show this pass to any white who wanted to see it. A slave was freed only by a will drawn up by the master or by buying their freedom from the master. Slaves could not make any kind of contract, including marriage."}, {"deck": "Lecture 11.pptx", "slide": 49, "text": "Standard US Slave Codes It was illegal to cruelly mistreat or kill a slave unless the slave resisted. A child who had one slave parent and one free parent was free ONLY if the free parent was the child’s mother. Any African Americans who cannot prove they are free are considered slaves."}, {"deck": "Lecture 11.pptx", "slide": 50, "text": "Legal Protections Laws were put in place to protect slaves throughout the Americas but slave testimony against a white man was inadmissible in court and no judge, jury or magistrate would convict a slave"}]}, {"id": 43, "topic": "Bondage and slavery", "q": "What is wrong with saying “slavery ended in 1808”?", "a": "The relevant slide concerns abolition of the slave trade, not abolition of slavery itself. Keep the institution and the trade distinct; verify precise national legal dates in assigned materials.", "refs": [{"deck": "Lecture 11.pptx", "slide": 39, "text": "1525: first slave voyage direct from Africa to the Americas 1780s: Abolitionist protest against the slave trade begins 1788: 1792: 103,000 slaves delivered to the Americas (a new high)  1808: British and US abolition of slave-trade takes effect 1829: 105,000 slaves delivered to the Americas (a new high) 1867: last transatlantic slave voyage sails The Transatlantic Slave Trade 1525 to 1867"}]}, {"id": 44, "topic": "Gentility and empire", "q": "Why study Byrd’s private diary alongside elite public ideals?", "a": "A private record can reveal behavior, hierarchy, power, and contradictions that polished public images conceal. Ask about audience and self-presentation rather than assuming either source is transparent.", "refs": [{"deck": "Lecture 12.pptx", "slide": 8, "text": "William Byrd II (1674-1744) Owned hundreds of enslaved people at the end of his life"}, {"deck": "Lecture 12.pptx", "slide": 10, "text": "The Life of William Byrd II, Part I Born in Virginia in 1674 Sent to London for safekeeping during Bacon’s Rebellion in 1678 Son of an Indian Trader and a Virginia planter on the frontier of Virginia Sent to London to be educated in 1681 Rejected for a position on the Board of Trade in 1696 Returned to Virginia on the death of his father  in 1705 to oversee the plantation"}, {"deck": "Lecture 12.pptx", "slide": 11, "text": "The Life of William Byrd, Part II Took his father’s place on the Virginia Council of State in 1709 Sought the governorship of Virginia and Maryland but could not attain them Wrote and published anonymously  A Discourse Concerning the Plague  in 1719 Was commissioned to survey the dividing line between North Carolina and Virginia in  the 1720s and wrote The  Secret History of the Dividing Line , often considered a classic of Early American literature In 1729, planned to import German-Swiss settlers for \"Land of Eden\" (settlers die when ship founders in  Lynnhaven  Bay)"}, {"deck": "Lecture 12.pptx", "slide": 12, "text": "William and Lucy Lucy and Byrd fought constantly about control over the servants, cards, the library, purchases.  When Lucy died of smallpox in 1716, Byrd suffered greatly. He blamed himself for her death, telling friends and family that he felt God was punishing him for his pride in his wife’s beauty and likeability."}]}, {"id": 45, "topic": "Gentility and empire", "q": "How could colonial elites assert English identity?", "a": "Through manners, consumption, education, portraits, and codes of civility. Gentility expressed claims to rank and belonging within the empire, not simply individual politeness.", "refs": [{"deck": "Lecture 12.pptx", "slide": 1, "text": "Planters, Patriarchs and Politicians Gentility, Civility, Refinement and the Worlds of William Byrd, George Washington, and Benjamin Franklin."}, {"deck": "Lecture 12.pptx", "slide": 8, "text": "William Byrd II (1674-1744) Owned hundreds of enslaved people at the end of his life"}, {"deck": "Lecture 12.pptx", "slide": 10, "text": "The Life of William Byrd II, Part I Born in Virginia in 1674 Sent to London for safekeeping during Bacon’s Rebellion in 1678 Son of an Indian Trader and a Virginia planter on the frontier of Virginia Sent to London to be educated in 1681 Rejected for a position on the Board of Trade in 1696 Returned to Virginia on the death of his father  in 1705 to oversee the plantation"}]}, {"id": 46, "topic": "Gentility and empire", "q": "Why do Caribbean sugar colonies matter to mainland American history?", "a": "Their wealth and exports shaped British priorities, war, trade, and slavery. Mainland tobacco exports were only a fraction of the value of British sugar-island exports.", "refs": [{"deck": "Lecture 12.pptx", "slide": 4, "text": "Tobacco exports from the mainland colonies were ¼ the value of sugar  exports from the British sugar islands in 1774."}]}, {"id": 47, "topic": "Gentility and empire", "q": "How does the British ideal of liberty coexist uneasily with slavery?", "a": "The empire described itself as Protestant, commercial, maritime, and free while profiting from enslaved labor. Analyze who was included in rights and who was excluded.", "refs": [{"deck": "Lecture 13.pptx", "slide": 17, "text": "By 1750, the British Empire began to be self-defining as Protestant, Commercial, Maritime and Free The Rights of Free-Born Englishmen were continually stressed, and it was said that the air of England was too free for a slave to breathe The rise of the Brits"}]}, {"id": 48, "topic": "Gentility and empire", "q": "Why were the Anglo-French wars Atlantic and global conflicts?", "a": "They involved commerce, navies, colonies, alliances, and theaters beyond North America. Link mainland events to European power struggles and Caribbean economic interests.", "refs": [{"deck": "Lecture 13.pptx", "slide": 16, "text": "Throughout the 18 th  century, the British and French were at nearly constant war with each other. They fought six major wars and most of these wars played out on both sides of the Atlantic By the end of the 18 th  century, in large part as a result of these wars, the Atlantic Ocean and the Americas were dominated by the Royal Navy, British commerce and London finance If the 20 th  century was the American century, the 18 th  century was the British century Anglo-French Rivalries and the British Rise to Prominence"}, {"deck": "Lecture 13.pptx", "slide": 23, "text": "Charles II of Spain died. A relative of Louis XIV, Phillippe,  duc   d'Anjou , inherited the throne, making France and Spain allies. Spain and France might one day be ruled under one monarch… England, the Netherlands, Portugal, Prussia and Austria supported an Austrian heir to the Spanish throne instead and went to war in a coalition. According to Louis XIV, “The principal object of the present war is the commerce of the Indies.” [North and South America] War of Spanish Succession  (1701-1713)"}, {"deck": "Lecture 13.pptx", "slide": 24, "text": "During the war, battle waged throughout the Atlantic and Indian Oceans At least 400,000 were killed St. Kitts, Nevis, Acadia and Newfoundland switched hands. Acadia (French Territory) became Nova Scotia A planned invasion of New France from New England failed The Iroquois were recognized by the French as British Subjects Britain recognized Phillip as King of Spain In return Britain gained the  Asiento The War of Spanish Succession (1701-1713)n"}, {"deck": "Lecture 13.pptx", "slide": 45, "text": "Largest war of the eighteenth-century Happened on a global scale Between 900,000 and 1.4 million were killed Prussia, Britain and Portugal fought against France, Austria, Sweden, Spain, Saxony and Russia (Russia switched sides temporarily in the later years of the war Battles occurred throughout Europe and on the coast of India and in eastern North America, the Northeastern shore of South America, the west coast of Africa and the Caribbean The French were very successful in the early years of the war, winning most of the battles but the tide turned in 1758 The Seven Years’ War (1754-1763)"}]}, {"id": 49, "topic": "Gentility and empire", "q": "Why did returning Louisbourg anger New Englanders?", "a": "Colonial soldiers helped capture it, but an imperial peace settlement returned it to France. Their local military goals and the empire’s wider diplomatic priorities diverged.", "refs": [{"deck": "Lecture 13.pptx", "slide": 33, "text": "Most of the the war was fought by privateers in the West Indies who burned each other’s plantations and fields and captured slaves British captured  Louisbourg  in Nova Scotia 1745. New England soldiers played a key role. Louisbourg  was returned to the French in 1748 after the war in exchange for French conquests in the Netherlands New Englanders were outraged! The War of Jenkins’ Ear in North Americas ( 1739-1748)"}]}, {"id": 50, "topic": "Gentility and empire", "q": "How did Washington’s early military career connect to imperial rivalry?", "a": "Jumonville Glen, Fort Necessity, and Braddock’s expedition placed him within conflict over western territories. His later revolutionary role should not erase his earlier service to the British Empire.", "refs": [{"deck": "Lecture 13.pptx", "slide": 37, "text": "Young George Washington and the French and Indian War"}, {"deck": "Lecture 13.pptx", "slide": 41, "text": "Battle of Jumonville Glen May 28 th , 1754"}, {"deck": "Lecture 13.pptx", "slide": 42, "text": "Battle of Fort Necessity July 3 rd , 1754"}, {"deck": "Lecture 13.pptx", "slide": 47, "text": "Braddock’s March 1755 The British effort to capture Fort  Duquense  (modern-day Pittsburgh)"}, {"deck": "Lecture 13.pptx", "slide": 52, "text": "Washington at Battle of  Monogahela July 9, 1755"}, {"deck": "Lecture 13.pptx", "slide": 57, "text": "Washington resigned his commission in 1758 after finally capturing Fort  Duquense . He was frustrated by his experiences"}]}, {"id": 51, "topic": "Gentility and empire", "q": "What does France’s choice of Caribbean islands over Canada reveal?", "a": "Commercial value, especially sugar, shaped imperial decisions. Avoid assuming that the territory that later became nationally important had the greatest value to eighteenth-century decision makers.", "refs": [{"deck": "Lecture 13.pptx", "slide": 64, "text": "The British offered France a choice of either Canada or the Caribbean islands of Guadeloupe and Martinique, which had been occupied by the British.  France chose to give u[ Canada. Spain traded Florida to Britain to regain Cuba and Manilla Treaty of Paris Negotiations"}, {"deck": "Lecture 13.pptx", "slide": 67, "text": "According to Voltaire, the French had lost nothing but “a few acres of snow” in Canada"}]}, {"id": 52, "topic": "Gentility and empire", "q": "Explain the Acadian expulsion as an imperial and human event.", "a": "British concerns about allegiance and control produced forced removal of French-speaking residents. Explain displacement and mortality alongside the imperial strategy; connect the migration to Louisiana.", "refs": [{"deck": "Lecture 13.pptx", "slide": 59, "text": "Acadian Expulsion (July 28, 1755)"}, {"deck": "Lecture 13.pptx", "slide": 60, "text": "Britain gained control of French Canada and Acadia, colonies containing approximately 80,000 French-speaking Roman Catholic residents.  The Acadians refused to swear an oath of allegiance. They insisted on remaining neutral and the British grew nervous.  The British forced 7,000 Acadians to leave. Others fled of their own accord.  Thousands of Acadians died in the process from starvation, shipwreck and disease.  The majority of the Acadians went to French Louisiana. Louisiana’s “Cajun” population has its roots in this forced migration.  The Seven Years’ War and Acadian Expulsions"}]}], "slides": [{"deck": "Lecture 1.pptx", "slide": 1, "text": "The United States, 1492-1865 History 315K"}, {"deck": "Lecture 1.pptx", "slide": 3, "text": "Getting to Know One Another  Stand up. "}, {"deck": "Lecture 1.pptx", "slide": 4, "text": "Getting to Know One Another Turn to a partner beside you or in front or behind…. Sit down."}, {"deck": "Lecture 1.pptx", "slide": 5, "text": "Getting to Know One Another Find out the following about your partner and remember because I may call on you. 1. Where are they from? 2. What are they most excited about at UT Austin this year? 3. What are they planning to major in? 4. What are three random things about them?"}, {"deck": "Lecture 1.pptx", "slide": 6, "text": "Professor Professor Dr. Justin Roberts justin.roberts@austin.utexas.edu Office Location: Garrison 3.118 Office Hours: Tuesdays and Thursdays, 10:30am to 12pm"}, {"deck": "Lecture 1.pptx", "slide": 7, "text": "TA’s, Part 1 Guastavo Fuchs:  gfuchs@utexas.edu Office Hours: Friday, 4pm to 5pm or by appointment Office Location: Zoom    Ian Szabo:  is23322@my.utexas.edu Office Hours: Thursdays, 2pm to 3pm Office Location: Gilman Hall Basement   "}, {"deck": "Lecture 1.pptx", "slide": 8, "text": "TA’s Part 2 Paula Pinzón:  pcp625@my.utexas.edu Office Hours: Tuesdays, 4pm-5pm,  Office Location: RLP, Floor 3, Desk #18   Andres (Gerardo) Juarez:  gaj725@my.utexas.edu Office Hours: Tuesdays, 11am-Noon Office Location: HRH 3.102A, Desk #14 "}, {"deck": "Lecture 1.pptx", "slide": 9, "text": "With your partner, draw an outline map of the United States of America. You can exclude Alaska and Hawaii for now.  Place, trace or outline the following locations or routes on your map.  Battle of Gettysburg   Louis and Clark Expedition (Outward Journey) Battle of the Alamo Roanoke Colony Oregon Trail Battle of Yorktown Chesapeake Bay  Cahokia Mounds Louisiana Purchase (1803)"}, {"deck": "Lecture 1.pptx", "slide": 27, "text": "Required Books (all other Readings on Canvas)"}, {"deck": "Lecture 1.pptx", "slide": 28, "text": "Attendance My best advice is to come to class. Lectures are not being recorded. Lecture slides will be posted but they will not be comprehensive. There will be  three  pop quizzes."}, {"deck": "Lecture 1.pptx", "slide": 29, "text": "Map Quizzes The Map exam bank for studying is available on Canvas as “US History Map Quiz” The map quiz will be on September 24. ***You do not need to draw Alaska or Hawaii because they were added after 1865***"}, {"deck": "Lecture 1.pptx", "slide": 30, "text": "Map Quiz Partners"}, {"deck": "Lecture 1.pptx", "slide": 31, "text": "Primary Source Papers There will be two short essays of between 1,000 and 1,500 words.  You may not use AI to generate these essays.  Essay prompts will be posted on Canvas three weeks in advance of each essay.  Essays are due October 9 and November 20."}, {"deck": "Lecture 1.pptx", "slide": 32, "text": "Chronology Quiz The chronology quiz bank is available on Canvas. You will memorize the sequence of events rather than dates.  The Chronology quiz is on November 5."}, {"deck": "Lecture 1.pptx", "slide": 33, "text": "Chronology Quiz Practice Put these 4 events in order starting with the earliest event. California Gold Rush begins Salem Witch Trials begin Battle of Gettysburg The Boston Tea Party"}, {"deck": "Lecture 1.pptx", "slide": 34, "text": "Exams There will be a midterm exam on October 15 There will be a final exam between December 10-12 or on December 14. "}, {"deck": "Lecture 1.pptx", "slide": 35, "text": "Due Dates September 24: Map Quiz (with partner) October 9: Primary Source Essay on Salem Witch Hunt October 15: Midterm Exam November 5: Chronology Quiz November 20: Primary Source Essay on Manifest Destiny December 10-12 or 14: Final Exam [Exact Date TBD] Three Pop Quizzes: ???  "}, {"deck": "Lecture 10-1.pptx", "slide": 1, "text": "Facing East and West The Powhattan Uprisings, the Pequot War, King Phillip’s War and the Pueblo Revolt"}, {"deck": "Lecture 10-1.pptx", "slide": 2, "text": "English push the Natives for food and relief from 1607-1609.  Frustrated by the English presence, Powhatan launches a siege of the Jamestown fort English soldiers deliberately used terror tactics that they had used in Ireland, and they burned villages and settlements and killed women and children The capture of Pocahontas and her marriage to John Rolfe helped to end the war First Anglo-Powhatan War, 1609-1614"}, {"deck": "Lecture 10-1.pptx", "slide": 4, "text": "1618- Powhatan dies and Opechancanough takes command Encroachment on native land with new tobacco growth (arrives in 1617) Powhatan Revolt, 1622"}, {"deck": "Lecture 10-1.pptx", "slide": 5, "text": "He Who Has a White Soul."}, {"deck": "Lecture 10-1.pptx", "slide": 6, "text": "Powhatan children were taken to be “civilized” and taught “Christianity” It failed and so entire families were brought into the village Only a few dozen families agreed. Christian School"}, {"deck": "Lecture 10-1.pptx", "slide": 7, "text": "Death  From 1619 through 1622, 3570 colonists arrived in Virginia. In 1622, there were only 1,240 left. There were scattered across the plantations"}, {"deck": "Lecture 10-1.pptx", "slide": 8, "text": "Nematonow - known by the English as “Jack Feathers” - was the Powhatan war chief The natives believed he had a power that meant he could not be harmed by the English In 1622, he convinced an English settler named Morgan to come with him to trade and then murdered him. He started wearing Morgan’s hat and he told the English that Morgan was dead. The English shot and killed  Nematonow"}, {"deck": "Lecture 10-1.pptx", "slide": 9, "text": "Opechancanough demanded retaliation.  The English threatened him with force and violence and so he agreed to be peaceful"}, {"deck": "Lecture 10-1.pptx", "slide": 10, "text": "The Powhatans returned to the English settlement, walking through the streets unharmed. They traded, talked and sat down to eat breakfast in some places. Then they suddenly attacked. They killed many of the people at the Christian schools. Some of the outlying plantations were saved by a last-minute warning by a converted Native  Powhatan Revolt: March 2, 1622"}, {"deck": "Lecture 10-1.pptx", "slide": 11, "text": "Powhatan Revolt, 1622 347 English settlers died- about 1/3 of the population The government in London heard about the attack in June and they gathered weapons, many old and rusty, from the Tower of London to send"}, {"deck": "Lecture 10-1.pptx", "slide": 13, "text": "The English stopped differentiating between Native groups and between friendly and hostile Natives They went town-to-town killing as many Natives as they could find"}, {"deck": "Lecture 10-1.pptx", "slide": 14, "text": "The English offered to meet with the Natives. They drank a a toast to peace. They agreed to end the fighting. Peace (?) of 1623"}, {"deck": "Lecture 10-1.pptx", "slide": 15, "text": "The wine they gave the Powhatans was poisoned. The Natives started dropping dead.  The English took advantage of the confusion and started shooting any living Natives"}, {"deck": "Lecture 10-1.pptx", "slide": 16, "text": "The Virginia Company’s Pamphlet War"}, {"deck": "Lecture 10-1.pptx", "slide": 17, "text": "1624- The King stepped in and revoked the Virginia Company Charter and took control of Virginia"}, {"deck": "Lecture 10-1.pptx", "slide": 18, "text": "Opechancanough launched another attack and killed 400 colonists Powhatan Revolt: April 18, 1644"}, {"deck": "Lecture 10-1.pptx", "slide": 19, "text": "The Pequots"}, {"deck": "Lecture 10-1.pptx", "slide": 22, "text": "Death of John Oldham John Stone was killed in 1634 by a group aligned with the Pequot John Oldham, who had been banished by Plymouth Plantation, became an ”Indian Trader.”  Was murdered by Narragansetts aboard his boat on July 20, 1636. Five of his crew were killed and two nephews were taken captive."}, {"deck": "Lecture 10-1.pptx", "slide": 23, "text": "Narragansetts convinced the colonists that the Pequots did it."}, {"deck": "Lecture 10-1.pptx", "slide": 24, "text": "English Puritans searching for land relied on the Narragansetts and Mohegans to destroy the Pequots "}, {"deck": "Lecture 10-1.pptx", "slide": 25, "text": "The Mystic Massacre and the Pequot War (1636-1638) On May 26, 1637- a New England force accompanied by Narragansett and Mohegan allies burned down a Pequot village that they had surrounded. They killed between 400 and 700 men, women and children Survivors were sold into slavery"}, {"deck": "Lecture 10-1.pptx", "slide": 27, "text": "King Phillip’s War or  Metacomet’s  Rebellion (1675-1676)"}, {"deck": "Lecture 10-1.pptx", "slide": 28, "text": "Metacomet or “King Phillip”"}, {"deck": "Lecture 10-1.pptx", "slide": 29, "text": "In 1671, the English tried to disarm the Natives in New England"}, {"deck": "Lecture 10-1.pptx", "slide": 30, "text": "Praying Towns"}, {"deck": "Lecture 10-1.pptx", "slide": 31, "text": "The war began when John Sassamon, a Harvard graduate who lived in a “Praying Town” reported that Metacomet or “King Phillip” was organizing an attack on New England towns Sassamon was found dead under a frozen pond  Three of his  Wompanoag  tribe members were arrested and hung  Wompanoag  tribe members attacked a New England town and wiped it out War was underway On March 12, 1676, the Indigenous launched an assault on Plymouth Colony in an effort to wipe out Plymouth Colony- It Failed King Philip’s War"}, {"deck": "Lecture 10-1.pptx", "slide": 32, "text": "A battle in southern New England began that eventually stretched North into Maine 1.5% of all English colonists killed Over half of New England towns were assaulted King Phillip’s War"}, {"deck": "Lecture 10-1.pptx", "slide": 33, "text": "European Population Growth in Colonial British America"}, {"deck": "Lecture 10-1.pptx", "slide": 34, "text": "Pueblo Revolt of 1680"}, {"deck": "Lecture 10-1.pptx", "slide": 35, "text": "Juan de Oñate"}, {"deck": "Lecture 10-1.pptx", "slide": 37, "text": "There were approximately 40,000 to 60,000 Pueblo natives when the Spanish invaded the region in 1598 and created the first permanent settlement with 129 soldiers and 10 Franciscan monks and a large number of settlers and livestock These Spanish conquistadors were brutal in their punishments of rebellion, enslaving people and cutting off parts of hands and feet. Spanish demanded tribute (taxes) and forced labor Spanish suppressed Pueblo religion. Background to the Pueblo Revolt of 1680"}, {"deck": "Lecture 10-1.pptx", "slide": 38, "text": "The most fertile lands were taken by Spanish colonists, and the Pueblo people were still forced to provide tribute Franciscan monks moved into Pueblo villages, demanding that they convert In the 1670s a drought swept through the region Popé's Rebellion of 1680"}, {"deck": "Lecture 10-1.pptx", "slide": 39, "text": "In 1675, the Spanish governor captured 47 Pueblo medicine men and accused them of “sorcery” and 4 were sentenced to death (one committed suicide). The rest of the men were severely whipped and sent to prison or sold as slaves. Because of the drought conditions, the Apache were regularly invading and attacking the Spanish towns, killing both the Pueblo and the Spanish The Spanish forces left to fight the Apache and the Pueblo natives moved in and rescued their people, including the medicine man  Ohkay   Owingeh  or  Popé Popé's Rebellion of 1680"}, {"deck": "Lecture 10-1.pptx", "slide": 40, "text": "Popé's Rebellion of 1680 Popé gathered support for a revolt among 46 surrounding towns. The Apache and Navajo joined the revolt, bringing nearly 2,500 natives against 170 Spanish soldiers, concentrated mostly in Santa Fe Popé promised that the ancient gods would return and bring wealth, health and prosperity when the Spanish were slaughtered"}, {"deck": "Lecture 10-1.pptx", "slide": 41, "text": "Popé traveled from town to town and destroyed all Christian artifacts. Planting of wheat and barley was forbidden. Christian marriages were cast aside, and the couples were forced to remarry.  400 colonists were killed The Spanish were surrounded and the water supply was cut off but they were allowed to flee unharmed 2,000 Spanish remaining colonists fled Popé's Rebellion of 1680"}, {"deck": "Lecture 10-1.pptx", "slide": 42, "text": "21 of 33 Franciscan friars were beaten and killed The churches were torn down"}, {"deck": "Lecture 10-1.pptx", "slide": 43, "text": "Spanish tried to reconquer the region in 1681 but managed to get little."}, {"deck": "Lecture 10-1.pptx", "slide": 44, "text": "The drought returned and Popé was deposed by his own people"}, {"deck": "Lecture 10-1.pptx", "slide": 45, "text": "The Spanish, afraid of French encroachments reconquered some of the area in 1692 after 12 years of Pueblo independence. He emphasized negotiation and he offered protection from other Native groups. Some of the people were never reconquered by the Spanish, including the Hopi In 1693, the Pueblo revolted again and there were harsh reprisals  In 169, the Pueblo revolted again and there were harsh reprisals  Popé's Rebellion of  1680"}, {"deck": "Lecture 10-1.pptx", "slide": 46, "text": "Horse Culture"}, {"deck": "Lecture 10-1.pptx", "slide": 47, "text": "Comanches"}, {"deck": "Lecture 10-1.pptx", "slide": 48, "text": "Thought Experiment From the perspectives of the Natives, what potential benefits did the Europeans offer? From the perspectives of the Natives, what potential threats did the Europeans bring? What about Europeans would the Natives have found most shocking?"}, {"deck": "Lecture 10-1.pptx", "slide": 49, "text": "Conclusion How would you characterize the history of the earliest encounters European and Native based on what you have seen in the lectures and readings thus far?"}, {"deck": "Lecture 10-1.pptx", "slide": 50, "text": "Identify, contextualize and state the significance of the following people or places…. Christopher Columbus John Smith Pocahontas John Winthrop Martin Frobisher Roanoke Colony Recap ID’s "}, {"deck": "Lecture 10-1.pptx", "slide": 51, "text": "Was the expedition of Pánfilo de Narváez a success or a failure? Why? What were the factors that contributed to that success or failure? What does the expedition reveal about the Spanish colonization of the Americas? Why did the Roanoke colony fail? What happened to the settlers? Contrast and compare the settlements of Roanoke (North Carolina), Jamestown (Virginia) and Meta Incognita (Arctic). Why did two fail while one succeeded? Recap Essay Questions"}, {"deck": "Lecture 10-1.pptx", "slide": 53, "text": "The Life of Anthony Johnson, Part 1 Imported into Virginia in 1621 and  sold  to an Englishman named Bennett as “Antonio a Negro” Grew tobacco on the Bennett family plantation and was one of the few in the colony who survived Opechancanough’s 1622 raid. Was respected for his “Hard labour and known service”"}, {"deck": "Lecture 10-1.pptx", "slide": 54, "text": "The Life of Anthony Johnson, Part 2 The Bennett’s began to allow Johnson to farm on his own. He married a woman named Mary and baptized his children. Johnson was allowed to work on his own almost exclusively, occasionally helping the Bennett’s. He moved with them to the Eastern Shore of Virginia, "}, {"deck": "Lecture 10-1.pptx", "slide": 55, "text": "The Life of Anthony Johnson, Part 3 In 1651, Johnson had saved enough to sponsor the entry of five servants into the colony- earning a 250 acre  headright Johnson’s son John earned a patent for 550 acres of land His son Richard owned a 100 acre estate Johnson’s plantation burned to the ground in 1653 and he petitioned a court for relief He was granted an abatement of his land taxes."}, {"deck": "Lecture 10-1.pptx", "slide": 56, "text": "The Life of Anthony Johnson, Part 4 Johnson purchased slaves and pursued them when they ran away Referred to as an “old Negro” in 1654 Johnson died in 1670. His wife survived him by a decade. In 1677 one of Anthony Johnson’s grandsons purchased a tract of land and called it “Angola.”"}, {"deck": "Lecture 10-1.pptx", "slide": 57, "text": "Anthony Johnson and the Courts in 1670 “By virtue of a  writt  granted to me from [names listed here, which are illegible] John Stringer  Escheator  for the  countys  of  Northhampton  and Accomack to enquire what lands  Anthonio  Johnson late of Accomack County either in his life  tyme . . . a jury of free. . . in the said Accomack County to enquire. . . doth declare that the said Anthony Johnson lately deceased in his life  tyme  was seized of fifty acres of land now in the possession of Rich. Johnson in the County of Accomack aforesaid and further that the said Anthony  Johnson was a negro and by consequence an alien  and for that cause the said land doth escheat to this . . . .” They ruled that his lands belonged to the English Crown"}, {"deck": "Lecture 10.pptx", "slide": 1, "text": "Facing East and West The Powhattan Uprisings, the Pequot War, King Phillip’s War and the Pueblo Revolt"}, {"deck": "Lecture 10.pptx", "slide": 2, "text": "First Anglo-Powhatan War, 1609-1614 English push the Natives for food and relief from 1607-1609.  Frustrated by the English presence, Powhatan launches a siege of the Jamestown fort English soldiers deliberately used terror tactics that they had used in Ireland, and they burned villages and settlements and killed women and children The capture of Pocahontas and her marriage to John Rolfe helped to end the war"}, {"deck": "Lecture 10.pptx", "slide": 4, "text": "Powhatan Revolt, 1622 1618- Powhatan dies and Opechancanough takes command Encroachment on native land with new tobacco growth (arrives in 1617)"}, {"deck": "Lecture 10.pptx", "slide": 5, "text": "He Who Has a White Soul."}, {"deck": "Lecture 10.pptx", "slide": 6, "text": "Christian School Powhatan children were taken to be “civilized” and taught “Christianity” It failed and so entire families were brought into the village Only a few dozen families agreed."}, {"deck": "Lecture 10.pptx", "slide": 7, "text": "Death  From 1619 through 1622, 3570 colonists arrived in Virginia. In 1622, there were only 1,240 left. There were scattered across the plantations"}, {"deck": "Lecture 10.pptx", "slide": 8, "text": "Nematonow - known by the English as “Jack Feathers” - was the Powhatan war chief The natives believed he had a power that meant he could not be harmed by the English In 1622, he convinced an English settler named Morgan to come with him to trade and then murdered him. He started wearing Morgan’s hat and he told the English that Morgan was dead. The English shot and killed  Nematonow"}, {"deck": "Lecture 10.pptx", "slide": 9, "text": "Opechancanough demanded retaliation.  The English threatened him with force and violence and so he agreed to be peaceful"}, {"deck": "Lecture 10.pptx", "slide": 10, "text": "Powhatan Revolt: March 2, 1622 The Powhatans returned to the English settlement, walking through the streets unharmed. They traded, talked and sat down to eat breakfast in some places. Then they suddenly attacked. They killed many of the people at the Christian schools. Some of the outlying plantations were saved by a last-minute warning by a converted Native "}, {"deck": "Lecture 10.pptx", "slide": 11, "text": "Powhatan Revolt, 1622 347 English settlers died- about 1/3 of the population The government in London heard about the attack in June and they gathered weapons, many old and rusty, from the Tower of London to send"}, {"deck": "Lecture 10.pptx", "slide": 13, "text": "The English stopped differentiating between Native groups and between friendly and hostile Natives They went town-to-town killing as many Natives as they could find"}, {"deck": "Lecture 10.pptx", "slide": 14, "text": "Peace (?) of 1623 The English offered to meet with the Natives. They drank a a toast to peace. They agreed to end the fighting."}, {"deck": "Lecture 10.pptx", "slide": 15, "text": "The wine they gave the Powhatans was poisoned. The Natives started dropping dead.  The English took advantage of the confusion and started shooting any living Natives"}, {"deck": "Lecture 10.pptx", "slide": 16, "text": "The Virginia Company’s Pamphlet War"}, {"deck": "Lecture 10.pptx", "slide": 17, "text": "1624- The King stepped in and revoked the Virginia Company Charter and took control of Virginia"}, {"deck": "Lecture 10.pptx", "slide": 18, "text": "Powhatan Revolt: April 18, 1644 Opechancanough launched another attack and killed 400 colonists"}, {"deck": "Lecture 10.pptx", "slide": 19, "text": "The Pequots"}, {"deck": "Lecture 10.pptx", "slide": 22, "text": "Death of John Oldham John Stone was killed in 1634 by a group aligned with the Pequot John Oldham, who had been banished by Plymouth Plantation, became an ”Indian Trader.”  Was murdered by Narragansetts aboard his boat on July 20, 1636. Five of his crew were killed and two nephews were taken captive."}, {"deck": "Lecture 10.pptx", "slide": 23, "text": "Narragansetts convinced the colonists that the Pequots did it."}, {"deck": "Lecture 10.pptx", "slide": 24, "text": "English Puritans searching for land relied on the Narragansetts and Mohegans to destroy the Pequots "}, {"deck": "Lecture 10.pptx", "slide": 25, "text": "The Mystic Massacre and the Pequot War (1636-1638) On May 26, 1637- a New England force accompanied by Narragansett and Mohegan allies burned down a Pequot village that they had surrounded. They killed between 400 and 700 men, women and children Survivors were sold into slavery"}, {"deck": "Lecture 10.pptx", "slide": 27, "text": "King Phillip’s War or  Metacomet’s  Rebellion (1675-1676)"}, {"deck": "Lecture 10.pptx", "slide": 28, "text": "Metacomet or “King Phillip”"}, {"deck": "Lecture 10.pptx", "slide": 29, "text": "In 1671, the English tried to disarm the Natives in New England"}, {"deck": "Lecture 10.pptx", "slide": 30, "text": "Praying Towns"}, {"deck": "Lecture 10.pptx", "slide": 31, "text": "King Philip’s War The war began when John Sassamon, a Harvard graduate who lived in a “Praying Town” reported that Metacomet or “King Phillip” was organizing an attack on New England towns Sassamon was found dead under a frozen pond  Three of his  Wompanoag  tribe members were arrested and hung  Wompanoag  tribe members attacked a New England town and wiped it out War was underway On March 12, 1676, the Indigenous launched an assault on Plymouth Colony in an effort to wipe out Plymouth Colony- It Failed"}, {"deck": "Lecture 10.pptx", "slide": 32, "text": "King Phillip’s War A battle in southern New England began that eventually stretched North into Maine 1.5% of all English colonists killed Over half of New England towns were assaulted"}, {"deck": "Lecture 10.pptx", "slide": 33, "text": "European Population Growth in Colonial British America"}, {"deck": "Lecture 10.pptx", "slide": 34, "text": "Pueblo Revolt of 1680"}, {"deck": "Lecture 10.pptx", "slide": 35, "text": "Juan de Oñate"}, {"deck": "Lecture 10.pptx", "slide": 37, "text": "Background to the Pueblo Revolt of 1680 There were approximately 40,000 to 60,000 Pueblo natives when the Spanish invaded the region in 1598 and created the first permanent settlement with 129 soldiers and 10 Franciscan monks and a large number of settlers and livestock These Spanish conquistadors were brutal in their punishments of rebellion, enslaving people and cutting off parts of hands and feet. Spanish demanded tribute (taxes) and forced labor Spanish suppressed Pueblo religion."}, {"deck": "Lecture 10.pptx", "slide": 38, "text": "Popé's Rebellion of 1680 The most fertile lands were taken by Spanish colonists, and the Pueblo people were still forced to provide tribute Franciscan monks moved into Pueblo villages, demanding that they convert In the 1670s a drought swept through the region"}, {"deck": "Lecture 10.pptx", "slide": 39, "text": "Popé's Rebellion of 1680 In 1675, the Spanish governor captured 47 Pueblo medicine men and accused them of “sorcery” and 4 were sentenced to death (one committed suicide). The rest of the men were severely whipped and sent to prison or sold as slaves. Because of the drought conditions, the Apache were regularly invading and attacking the Spanish towns, killing both the Pueblo and the Spanish The Spanish forces left to fight the Apache and the Pueblo natives moved in and rescued their people, including the medicine man  Ohkay   Owingeh  or  Popé"}, {"deck": "Lecture 10.pptx", "slide": 40, "text": "Popé's Rebellion of 1680 Popé gathered support for a revolt among 46 surrounding towns. The Apache and Navajo joined the revolt, bringing nearly 2,500 natives against 170 Spanish soldiers, concentrated mostly in Santa Fe Popé promised that the ancient gods would return and bring wealth, health and prosperity when the Spanish were slaughtered"}, {"deck": "Lecture 10.pptx", "slide": 41, "text": "Popé's Rebellion of 1680 Popé traveled from town to town and destroyed all Christian artifacts. Planting of wheat and barley was forbidden. Christian marriages were cast aside, and the couples were forced to remarry.  400 colonists were killed The Spanish were surrounded and the water supply was cut off but they were allowed to flee unharmed 2,000 Spanish remaining colonists fled"}, {"deck": "Lecture 10.pptx", "slide": 42, "text": "21 of 33 Franciscan friars were beaten and killed The churches were torn down"}, {"deck": "Lecture 10.pptx", "slide": 43, "text": "Spanish tried to reconquer the region in 1681 but managed to get little."}, {"deck": "Lecture 10.pptx", "slide": 44, "text": "The drought returned and Popé was deposed by his own people"}, {"deck": "Lecture 10.pptx", "slide": 45, "text": "Popé's Rebellion of  1680 The Spanish, afraid of French encroachments reconquered some of the area in 1692 after 12 years of Pueblo independence. He emphasized negotiation and he offered protection from other Native groups. Some of the people were never reconquered by the Spanish, including the Hopi In 1693, the Pueblo revolted again and there were harsh reprisals  In 169, the Pueblo revolted again and there were harsh reprisals "}, {"deck": "Lecture 10.pptx", "slide": 46, "text": "Horse Culture"}, {"deck": "Lecture 10.pptx", "slide": 47, "text": "Comanches"}, {"deck": "Lecture 10.pptx", "slide": 48, "text": "Thought Experiment From the perspectives of the Natives, what potential benefits did the Europeans offer? From the perspectives of the Natives, what potential threats did the Europeans bring? What about Europeans would the Natives have found most shocking?"}, {"deck": "Lecture 10.pptx", "slide": 49, "text": "Conclusion How would you characterize the history of the earliest encounters between European and Native based on what you have seen in the lectures and readings thus far?"}, {"deck": "Lecture 10.pptx", "slide": 50, "text": "Recap ID’s  Identify, contextualize and state the significance of the following people or places…. Christopher Columbus John Smith Pocahontas John Winthrop Martin Frobisher Roanoke Colony"}, {"deck": "Lecture 11.pptx", "slide": 1, "text": "An Unfree World: Bondage, Forced Migration, and the Rise of Slavery in the Early Americas"}, {"deck": "Lecture 11.pptx", "slide": 3, "text": "United States in 1650"}, {"deck": "Lecture 11.pptx", "slide": 4, "text": "United States in 1800"}, {"deck": "Lecture 11.pptx", "slide": 5, "text": "Puerto Rico Acquired by the US in 1898"}, {"deck": "Lecture 11.pptx", "slide": 6, "text": "Puerto Rico  The first African slaves arrived in Puerto Rico in 1513"}, {"deck": "Lecture 11.pptx", "slide": 7, "text": "Narváez Expedition (1528-1535)"}, {"deck": "Lecture 11.pptx", "slide": 8, "text": "Esteban de Dorantes The evidence suggests he was from Morocco and likely Muslim Born circa 1500 Likely multilingual  Sometimes known as  Estevanico"}, {"deck": "Lecture 11.pptx", "slide": 9, "text": "Fray Marcos de Niza Expedition To find the lost cities of Cibola, the seven cities of gold Esteban became the leader of the expedition! Esteban was killed in New Mexico in an attack by the Natives in 1539 "}, {"deck": "Lecture 11.pptx", "slide": 10, "text": "St. Augustine, Florida The oldest continually occupied European settlement in what became the United States Settled in 1565"}, {"deck": "Lecture 11.pptx", "slide": 11, "text": "1619 The first slaves arrived in Virginia in 1619. They were described as “twenty and odd negroes sold out of a  dutch  ship” to settlers in Virginia. "}, {"deck": "Lecture 11.pptx", "slide": 12, "text": "Came from Luanda, a Portuguese port in Angola About 50,000 people were sold out of Angola between 1618 to 1620 350 captives were sent on the  San Juan Batista  to Veracruz in Mexico They were intercepted by  The White Lion  and  The Treasurer.  The ship was looted and some of the African captives were taken to Virginia"}, {"deck": "Lecture 11.pptx", "slide": 13, "text": "Who were the Twenty and odd?  Anthony and Isabella lived in Hampton, Virginia and worked for a merchant.  Angelo worked as a domestic in another nearby town"}, {"deck": "Lecture 11.pptx", "slide": 15, "text": "The Case of Anthony Johnson"}, {"deck": "Lecture 11.pptx", "slide": 16, "text": "The Life of Anthony Johnson, Part 1 Imported into Virginia in 1621 and  sold  to an Englishman named Bennett as “Antonio a Negro” Grew tobacco on the Bennett family plantation and was one of the few in the colony who survived Opechancanough’s 1622 raid. Was respected for his “Hard labour and known service”"}, {"deck": "Lecture 11.pptx", "slide": 17, "text": "The Life of Anthony Johnson, Part 2 The Bennett’s began to allow Johnson to farm on his own. He married a woman named Mary and baptized his children. Johnson was allowed to work on his own almost exclusively, occasionally helping the Bennett’s. He moved with them to the Eastern Shore of Virginia, "}, {"deck": "Lecture 11.pptx", "slide": 18, "text": "The Life of Anthony Johnson, Part 3 In 1651, Johnson had saved enough to sponsor the entry of five servants into the colony- earning a 250 acre  headright Johnson’s son John earned a patent for 550 acres of land His son Richard owned a 100 acre estate Johnson’s plantation burned to the ground in 1653 and he petitioned a court for relief He was granted an abatement of his land taxes."}, {"deck": "Lecture 11.pptx", "slide": 19, "text": "The Life of Anthony Johnson, Part 4 Johnson purchased slaves and pursued them when they ran away Referred to as an “old Negro” in 1654 Johnson died in 1670. His wife survived him by a decade. In 1677 one of Anthony Johnson’s grandsons purchased a tract of land and called it “Angola.”"}, {"deck": "Lecture 11.pptx", "slide": 20, "text": "Anthony Johnson and the Courts in 1670 “By virtue of a  writt  granted to me from [names listed here, which are illegible] John Stringer  Escheator  for the  countys  of  Northhampton  and Accomack to enquire what lands  Anthonio  Johnson late of Accomack County either in his life  tyme . . . a jury of free. . . in the said Accomack County to enquire. . . doth declare that the said Anthony Johnson lately deceased in his life  tyme  was seized of fifty acres of land now in the possession of Rich. Johnson in the County of Accomack aforesaid and further that the said Anthony  Johnson was a negro and by consequence an alien  and for that cause the said land doth escheat to this . . . .” They ruled that his lands belonged to the English Crown"}, {"deck": "Lecture 11.pptx", "slide": 21, "text": "Was Anthony Johnson a slave and what did that mean? "}, {"deck": "Lecture 11.pptx", "slide": 22, "text": "One Definition? Slavery “exists when a person is traded or captured and subsequently owes  lifelong obligations to another or when the condition is assumed to be lifelong and hereditary from birth.”"}, {"deck": "Lecture 11.pptx", "slide": 23, "text": "The Emergence of Slave Codes in the British Americas The Barbados slave code of 1661 marked the beginning of the legal codification of slavery in the British Atlantic. The Barbados Assembly re-enacted the slave code, with minor modifications, in 1676, 1682, and 1688.  The Barbados slave code also served as the basis for the slave codes adopted in several other British colonies, including Jamaica (1664), South Carolina (1696), and Antigua (1702) and Virginia (1705)."}, {"deck": "Lecture 11.pptx", "slide": 24, "text": "Virginian Slave Codes 1642 -- Black women counted as  tithables  (taxable property). 1650 “Act XI. All persons except Negroes are to be provided with arms and ammunitions or be fined at the pleasure of the governor and council.”"}, {"deck": "Lecture 11.pptx", "slide": 25, "text": "Partus  Sequitur  Ventrem -  “The Offspring follows the womb” 1662 -Possibility of life servitude for Blacks and hereditary slavery: “Whereas some doubts have arisen whether children got by any Englishmen upon a Negro shall be slave or Free, Be it therefore enacted and declared by this present Grand assembly, that all children born in this country shall be held bond or free only according to the condition of the mother.\""}, {"deck": "Lecture 11.pptx", "slide": 26, "text": "Virginian Slave Codes 1680 -- Prescription of thirty lashes on the bare back \"if any  negroe  or other slave shall presume to lift up his hand against any Christian.\" 1682: “Act I. It is enacted that all servants [...] which shall be imported into this country either by sea or by land, whether Negroes, Moors [Muslim North Africans], mulattoes or Indians who and whose parentage and native countries are not Christian at the time of their first purchase by some Christian [...] and all Indians, which shall be sold by our  neighboring  Indians, or any other trafficking with us for slaves, are hereby adjudged, deemed and taken to be slaves to all intents and purposes any law, usage, or custom to the contrary notwithstanding."}, {"deck": "Lecture 11.pptx", "slide": 27, "text": "Virginian Slave Codes 1680's -- Severe punishment for slaves who leave their master's property or for hiding or resisting capture. 1691 -- Banishment for any white person married to a Black Person and approved a systematic plan to capture \"outlying slaves.\""}, {"deck": "Lecture 11.pptx", "slide": 28, "text": "The Comprehensive Virginian Slave Code of 1705 1705 – “All  negroe , mulatto, and Indian slaves shall be held, taken, and adjudged to be real estate.” 1705 -- Dismemberment of unruly or rebellious slaves was made legal."}, {"deck": "Lecture 11.pptx", "slide": 29, "text": "MASSACHUSETTS BODY OF LIBERTIES, 1641 No mans life shall be taken away, no mans honor or good name shall be stained, no mans person shall be arrested, restrained, banished, dismembered, nor any ways punished, no man shall be deprived of his wife or children, no mans goods or estate shall be taken away from him, nor any way damaged under color of law or Countenance of Authority, unless it be by virtue or equity of some express law of the Country warranting the same, established by a general Court and sufficiently published, or in case of the defect of a law in any particular case by the word of God. "}, {"deck": "Lecture 11.pptx", "slide": 30, "text": "MASSACHUSETTS BODY OF LIBERTIES, 1641 Every person within this Jurisdiction, whether Inhabitant or  foreiner  shall enjoy the same justice and law, that is  generall  for the plantation, which we constitute and execute one towards another without partiality or delay. "}, {"deck": "Lecture 11.pptx", "slide": 31, "text": "MASSACHUSETTS BODY OF LIBERTIES, 1641 If any man smite out the eye or tooth of his man-servant, or maid servant, or otherwise maim or much disfigure him, unless it be by mere casualty, he shall let them go free from his service. And shall have such further recompense as the Court shall allow him. "}, {"deck": "Lecture 11.pptx", "slide": 32, "text": "MASSACHUSETTS BODY OF LIBERTIES, 1641 Servants that have served diligently and faithfully to the benefit of their masters seven years, shall not be sent away empty. And if any have been unfaithful, negligent or unprofitable in their service, notwithstanding the good usage of their masters, they shall not be dismissed till they have made satisfaction according to the Judgement of Authority. "}, {"deck": "Lecture 11.pptx", "slide": 33, "text": "MASSACHUSETTS BODY OF LIBERTIES, 1641 There shall never be any bond slavery, villeinage or captivity amongst us unless it be lawful Captives taken in just wars, and such strangers as willingly sell themselves or are sold to us . And these shall have all the liberties and Christian usages which the law of god established in Israel concerning such persons does morally require. This exempts none from servitude who shall be Judged thereto by Authority. "}, {"deck": "Lecture 11.pptx", "slide": 34, "text": "Other EARLY British American Slave Codes The slave Codes in South Carolina emerged in the 1680s and they were finalized in 1696 (the same year the first slave ship from Africa arrived) The South Carolina code of 1696 incorporated “gelding” as a punishment for rebellious slaves"}, {"deck": "Lecture 11.pptx", "slide": 35, "text": "South Carolina had a majority population of Black people by 1708. It was the first and only place in the United States to have a majority slave population"}, {"deck": "Lecture 11.pptx", "slide": 39, "text": "1525: first slave voyage direct from Africa to the Americas 1780s: Abolitionist protest against the slave trade begins 1788: 1792: 103,000 slaves delivered to the Americas (a new high)  1808: British and US abolition of slave-trade takes effect 1829: 105,000 slaves delivered to the Americas (a new high) 1867: last transatlantic slave voyage sails The Transatlantic Slave Trade 1525 to 1867"}, {"deck": "Lecture 11.pptx", "slide": 44, "text": "The average length of the middle passage over the entire slave trade was 67 days, a little more than two months."}, {"deck": "Lecture 11.pptx", "slide": 46, "text": "Jamaican Murder Laws The  second  willful murder of a non-rebellious slave would be counted as a felony.  All “rebellious” or “runaway” slaves could be killed on any occasion"}, {"deck": "Lecture 11.pptx", "slide": 47, "text": "Standard US Slave Codes No slave could testify in court, except in a case involving another slave. It was illegal for a slave holder to work slaves in the field on Sundays, except as punishment  or  unless they were paid. Any slave who went away from his/her plantation had to have a pass. The slave had to show this pass to any white who wanted to see it. A slave was freed only by a will drawn up by the master or by buying their freedom from the master. Slaves could not make any kind of contract, including marriage."}, {"deck": "Lecture 11.pptx", "slide": 48, "text": "Standard US Slave Codes Slaves were not allowed to have weapons. It was illegal for more than a few slaves to gather together away from home unless a white person was present. No slave was allowed to preach, except to slaves on his/her own plantation while in the presence of whites. Any slave caught stealing could be whipped. It was illegal to teach slaves to read/write. It was illegal to give them books."}, {"deck": "Lecture 11.pptx", "slide": 49, "text": "Standard US Slave Codes It was illegal to cruelly mistreat or kill a slave unless the slave resisted. A child who had one slave parent and one free parent was free ONLY if the free parent was the child’s mother. Any African Americans who cannot prove they are free are considered slaves."}, {"deck": "Lecture 11.pptx", "slide": 50, "text": "Legal Protections Laws were put in place to protect slaves throughout the Americas but slave testimony against a white man was inadmissible in court and no judge, jury or magistrate would convict a slave"}, {"deck": "Lecture 11.pptx", "slide": 51, "text": "Were indentured servants treated like slaves?"}, {"deck": "Lecture 11.pptx", "slide": 52, "text": "An  Unfree  World Apprecticeships Indenture Servitude Convict  Labor Vagrancy Laws"}, {"deck": "Lecture 11.pptx", "slide": 56, "text": "Runaway Wife Ad, 1809"}, {"deck": "Lecture 11.pptx", "slide": 59, "text": "Servitude versus Slavery and the Law Not permanent Not inheritable Not protected by bounds of “subjecthood”"}, {"deck": "Lecture 11.pptx", "slide": 60, "text": "Enslaved Domestic Women and the White Family in Virginia, 1860"}, {"deck": "Lecture 11.pptx", "slide": 63, "text": "Bélizaire  and the Frey Children (Louisiana, 1837)"}, {"deck": "Lecture 12.pptx", "slide": 1, "text": "Planters, Patriarchs and Politicians Gentility, Civility, Refinement and the Worlds of William Byrd, George Washington, and Benjamin Franklin."}, {"deck": "Lecture 12.pptx", "slide": 4, "text": "Tobacco exports from the mainland colonies were ¼ the value of sugar  exports from the British sugar islands in 1774."}, {"deck": "Lecture 12.pptx", "slide": 6, "text": "“The Best Poor Man’s Country in the World” 1774 Jamaica:  Top ten percent controlled 64.5 % of the wealth American South:   37.9 % of wealth American Middle Colonies:  30.4 % wealth England & Wales:  45.1% of wealth United States in 2026:  Top ten percent control 68% of  welath"}, {"deck": "Lecture 12.pptx", "slide": 8, "text": "William Byrd II (1674-1744) Owned hundreds of enslaved people at the end of his life"}, {"deck": "Lecture 12.pptx", "slide": 9, "text": "William Byrd II (1674-1744)"}, {"deck": "Lecture 12.pptx", "slide": 10, "text": "The Life of William Byrd II, Part I Born in Virginia in 1674 Sent to London for safekeeping during Bacon’s Rebellion in 1678 Son of an Indian Trader and a Virginia planter on the fro
