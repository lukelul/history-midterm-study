ntier of Virginia Sent to London to be educated in 1681 Rejected for a position on the Board of Trade in 1696 Returned to Virginia on the death of his father  in 1705 to oversee the plantation"}, {"deck": "Lecture 12.pptx", "slide": 11, "text": "The Life of William Byrd, Part II Took his father’s place on the Virginia Council of State in 1709 Sought the governorship of Virginia and Maryland but could not attain them Wrote and published anonymously  A Discourse Concerning the Plague  in 1719 Was commissioned to survey the dividing line between North Carolina and Virginia in  the 1720s and wrote The  Secret History of the Dividing Line , often considered a classic of Early American literature In 1729, planned to import German-Swiss settlers for \"Land of Eden\" (settlers die when ship founders in  Lynnhaven  Bay)"}, {"deck": "Lecture 12.pptx", "slide": 12, "text": "William and Lucy Lucy and Byrd fought constantly about control over the servants, cards, the library, purchases.  When Lucy died of smallpox in 1716, Byrd suffered greatly. He blamed himself for her death, telling friends and family that he felt God was punishing him for his pride in his wife’s beauty and likeability."}, {"deck": "Lecture 12.pptx", "slide": 13, "text": "Lucy Parke Byrd, 1685-1716"}, {"deck": "Lecture 12.pptx", "slide": 14, "text": "William Byrd II’s Second Marriage Byrd remarried in 1723, a very submissive woman named Maria Taylor (1698-1771). She never fought or argued with him and their relationship was much less passionate in every way. Four of their children survived childhood. She outlived her husband by 37 years. She did not inherit his estate, but he allowed her an annual pension of £200 if she remained at Westover and never remarried. "}, {"deck": "Lecture 12.pptx", "slide": 15, "text": " Books from the library of William Byrd  James Harrington's  Commonwealth of  Oceana   John Locke's  An Essay Concerning Human Understanding John Locke's  Some Thoughts Concerning Education Francis Bacon's  The Advancement of Learning John Boyle's  Sceptical  Chymist John Milton's  Paradise Lost François Rabelais'  Five Books of the Lives, Heroic Deeds and Sayings of  Gargantua  and  Pantagruel Sir Thomas Browne's  Religio  Medici Abraham  Cowley's   The Third Part of the Works of Mr. Abraham  Cowley  Being his Six Books of Plants"}, {"deck": "Lecture 12.pptx", "slide": 16, "text": "Westover"}, {"deck": "Lecture 12.pptx", "slide": 17, "text": "Westover"}, {"deck": "Lecture 12.pptx", "slide": 18, "text": "Byrd’s Secret Diary"}, {"deck": "Lecture 12.pptx", "slide": 19, "text": "The Secret Diary of William Byrd of Westover, April 7th, 1709  I rose before 6 o’clock and read two chapters in Hebrew and 250 verses in Homer’s  Odyssey  and made and end of it. I said my prayers devoutly. I ate milk for breakfast. I danced my dance. The men began to work this day to dig for brick. I settled my accounts and read Italian.  I reproached my wife with ordering the old beef to be kept and the fresh beef used first, contrary to good management, on which she was pleased to be very angry and this put me out of  humor .  I ate nothing but boiled beef for dinner. I went away presently after dinner to look after my people. When I returned I read more Italian and then my wife came and begged my pardon and we were friends again. I read in Dr. Lister again very late. I said my prayers. I had good health, good thoughts, and bad  humor , unlike a philosopher. "}, {"deck": "Lecture 12.pptx", "slide": 20, "text": "The Secret Diary of William Byrd of Westover, May 23 rd , 1709 I rose at 5 o’clock and read a chapter in Hebrew and some Greek in Josephus. I said my prayers and ate milk for breakfast. My horse died this morning. John Woodson came in the rain about paying me some money and left his papers at home; so he returned as wise as he came. My man Jack continued lame in his foot. I ate nothing for dinner but mutton boiled with turnips. In the afternoon we played at billiards. I read news till the evening and then I took a walk about the plantation.  Moll was whipped for a hundred faults.  I said my prayers and had good health, good thoughts, and good  humor , thanks be to God Almighty "}, {"deck": "Lecture 12.pptx", "slide": 21, "text": "The Secret Diary f William Byrd of Westover, Dec. 3 rd , 1709  I rose at 5 o'clock and read two chapters in Hebrew and some Greek in Cassius. I said my prayers and ate milk for breakfast. I danced my dance.  Eugene pissed abed again for which I made him drink a pint of piss.  I settled some accounts and read some news. About 12 o'clock I went to court where I found little good company."}, {"deck": "Lecture 12.pptx", "slide": 22, "text": "The Secret Diary of William Byrd of Westover, August 27, 1709 I rose at 5 o’clock and read two chapters in Hebrew and some Greek in Josephus. I said my prayers and ate milk for breakfast. I danced my dance.  I had like to have whipped my maid  Anaka  for her laziness but I forgave her.  I read a little geometry. I denied my man G-r-l to go to a horse race because there was nothing but swearing and drinking there. I ate roast mutton for dinner. In the afternoon I played at piquet with my own wife and made her out of  humor  by cheating her. I read some Greek in Homer. Then I walked about the plantation. I lent John H- ch  £7 in his distress. I said my prayers and had good health, good thoughts, and good  humor , thanks be to God Almighty. "}, {"deck": "Lecture 12.pptx", "slide": 23, "text": "The Secret Diary of William Byrd, July 2 nd , 1710 I rose at 6 o'clock and read two chapters in Hebrew  and some Greek in Thucydides. I said my prayers and ate  milk and [m-l-y] for breakfast. It was very hot. I read a  sermon in Dr.  Tillotson  which affected me very much. I  ate boiled mutton for dinner. In the afternoon Mr. Doyley  and Ben Harrison came over and stayed almost all the  afternoon. They told me that Colonel Harrison was better.  In the evening I took a walk about the plantation. My bum was well recovered but I had a little gripes in my belly.  The negro woman ran away again with the [bit] in her mouth and my people could not find her.  I said my prayers and  had good health, good thoughts, and good humor, thanks  be to God Almighty. Captain Harvey and Captain  Burbydge  came over in their boat this night. "}, {"deck": "Lecture 12.pptx", "slide": 24, "text": "The Secret Diary of William Byrd of Westover, July 15th 1710 About 7 o’clock the negro Betty that ran away was brought home. My wife against my will caused little Jenny to be burned with a hot iron, for which I  quarreled  with her.  It was so hot today that I did not intend to go to the launching of Colonel Hill’s ship but about 9 o’clock the Colonel was so kind as to come and call us. My wife would not go at first but with much entreaty she at last consented. About 12 o’clock we went and found abundance of company at the ship and about one she was launched and went off very well notwithstanding several had believe the contrary. When this was over we went to Mr. Platt’s to dinner and I ate boiled beef. We stayed till about 5 o’clock and then returned home, where all was well. I found an express from above with a letter from Joe Wilkinson desiring to be discharged from my service when his year was out. I neglected to say my prayers and had good health, good thoughts, and good  humor , thank God Almighty. "}, {"deck": "Lecture 12.pptx", "slide": 25, "text": "August 12, 1710 I rose at 5 o’clock and read a chapter in Hebrew and some Greek in Lucian. I said my prayers and ate boiled milk for breakfast. I danced my dance.  I had a quarrel with my wife about her servants who did little work . I wrote a long and smart letter to Mr. Perry, wherein I found several faults with his management of the tobacco I sent him and with mistakes he had committed in my affairs. My sloop brought some tobacco from Appomattox. Mr. Bland came over and dined with us on his way to Williamsburg. I ate roast shoat for dinner. In the afternoon Mr. Bland went away and I wrote more letters. I put some tobacco into the sloop for Captain Harvey. It rained and hindered our walk; however we walked a little in the garden. I neglected to say my prayers but had good health, good thoughts, and good humor, thank God Almighty. "}, {"deck": "Lecture 12.pptx", "slide": 26, "text": "The Secret Diary of William Byrd of Westover, January 31 st , 1711 I rose at 5 o’clock and read two chapters in Hebrew and some Greek in Lucian. I said my prayers and ate boiled milk for breakfast.  My wife  quarreled  with me about not sending for Mrs. Dunn when it rained to [lend her John]. She threatened to kill herself but had more discretion. I danced my dance and then read some English about [love].  It rained again all the morning. I ate some roast shoat for dinner. In the afternoon Nurse was taken sick of a [purging]. I took a walk to see the  boatwright  at work. My wife came into good  humor  again and we resolved to live for the future in love and peace. At night I ate some battered eggs with her and drank some cider. I said my prayers and had good health, good thoughts, and good  humor , thank God Almighty. The wind was still northeast as it was when the moon was at full and since that a good deal of rain has fallen. The boy whose thigh was swollen got worse. "}, {"deck": "Lecture 12.pptx", "slide": 27, "text": "The Secret Diary of William Byrd of Westover, February 5, 1711 I rose about 8 o’clock and found my cold still worse. I said my prayers and ate milk and potatoes for breakfast.  My wife and I  quarreled  about her pulling her brows. She threatened she would not go to Williamsburg if she might not pull them; I refused, however, and got the better of her, and maintained my authority.  About 10 o’clock we went over the river and got to Colonel Duke’s about 11. There I ate some toast and canary. Then we proceeded to Queen’s Creek, where we found all well, thank God. We ate roast goose for supper. The women prepared to go to the Governor’s the next day and my brother and I talked of old stories. My cold grew exceedingly bad so that I thought I should be sick. My sister gave me some sage tea and leaves of [s-m-n-k] which made me mad all night so that I could not sleep but was much disordered by it. I neglected to say my prayers in form but had good thoughts, good  humor , and indifferent health, thank God Almighty. "}, {"deck": "Lecture 12.pptx", "slide": 28, "text": "The Secret Diary of William Byrd of Westover, February 27th, 1711 I danced my dance and then went to the brick house to see my people pile the planks and found them all idle for which I threatened them soundly but did not whip them. The weather was cold and the wind at northeast. I wrote a letter to England. Then I read some English till 12 o’clock when Mr. Dunn and his wife came. I ate boiled beef for dinner. In the afternoon Mr. Dunn and I played at billiards. Then we took a long walk about the plantation and looked over all my business.  In the evening my wife and little Jenny had a great quarrel in which my wife got the worst but at last by the help of the family Jenny was overcome and soundly whipped . At night I ate some bread and cheese. I said my prayers but had good health, good thoughts, and good  humor , thank God Almighty. "}, {"deck": "Lecture 12.pptx", "slide": 29, "text": "March 3 rd , 1712 I rose about 7 o’clock and read a chapter in Hebrew and some Greek in Lucian. I said my prayers and ate some boiled milk for breakfast. My daughter was better this morning, thank God.  I beat Billy Wilkins for telling a lie . I settled some accounts and read some Latin and then read some news till dinner and then ate some roast beef for dinner. In the afternoon I read more news and then more Latin. I danced my dance and in the evening took a walk about the plantation and my wife with me. In the evening Tom returned from Williamsburg with letters from several persons containing some public [s-s] concerning the Duke of Marlborough being removed from all his places of honor and profit and that it was talked that he was also put into the Tower. I read nothing but said my prayers and had good health, good thoughts and good humor, thank God Almighty. "}, {"deck": "Lecture 12.pptx", "slide": 30, "text": "The Secret Diary of William Byrd of Westover, August 28 th , 1712 I rose about 5 o’clock and read a chapter in Hebrew and some Greek in  Herodian . I said my prayers and ate nothing for breakfast, to settle my stomach after feasting abroad. I danced my dance. The weather was cloudy and warm. My wife was indisposed for want of sleep, having been disturbed by mosquitoes, which we have more of this year than ever I knew. I read some law till dinner and then I ate some hogs’  haslet . In the afternoon I went to the granary to see the people work and then returned and read some Latin till the evening and then I took a walk about the plantation and saw my people making cider. My wife was indisposed very much at night which made me go to bed soon. I said my prayers and had good health, good thoughts, and good  humor , thank God Almighty.  In the night my wife was disturbed with mosquitoes and could not sleep herself nor would she let me sleep. "}, {"deck": "Lecture 12.pptx", "slide": 32, "text": "Washington on Mount Rushmore, North Dakota"}, {"deck": "Lecture 12.pptx", "slide": 33, "text": "Washington Monument"}, {"deck": "Lecture 12.pptx", "slide": 34, "text": "Washington and the Cherry Tree Myth"}, {"deck": "Lecture 12.pptx", "slide": 35, "text": "George Washington (1732-1799)"}, {"deck": "Lecture 12.pptx", "slide": 36, "text": "A Virginia man of middling origin.  Joined the colonial militias as a British soldier and served in the 7 year war after serving a role in the start of the war Became wealthy from land speculation in the west (sometimes illegal) and from slavery Became one of the wealthiest planters in Virginia- His home of Mount Vernon expanded from 2,000 to 10,000 acres The Life of Washington"}, {"deck": "Lecture 12.pptx", "slide": 37, "text": "Among the top 25 largest slaveholders in Virginia. He died owning more than 300 slaves Married the wealthy widow Martha Dandridge Cutis- Never had children Became commander of the American Army and the First President Manumitted all his slaves Died at 67 years old- likely from medical malpractice The Life of George Washington"}, {"deck": "Lecture 12.pptx", "slide": 38, "text": "Martha Dandridge Custis "}, {"deck": "Lecture 12.pptx", "slide": 39, "text": "Mount Vernon"}, {"deck": "Lecture 12.pptx", "slide": 40, "text": "George Washington as Continental Commander"}, {"deck": "Lecture 12.pptx", "slide": 41, "text": "Contemporary Descriptions of George Washington In 1763, Washington directed a London tailor to make him clothing …   \"take measure of a gentleman who wares well-made  cloaths  of the following size: to wit, 6 feet high and proportionably made—if anything rather slender than thick, for a person of that  highth , with pretty long arms and thighs. You will take care to make the breeches longer than those you sent me last …”"}, {"deck": "Lecture 12.pptx", "slide": 42, "text": "Battle of Long Island (Brooklyn), August 1776"}, {"deck": "Lecture 12.pptx", "slide": 44, "text": "Crossing the Delaware for the Battle of Trenton December 25, 1776"}, {"deck": "Lecture 12.pptx", "slide": 45, "text": "Washington at Valley Forge, 1777-1778"}, {"deck": "Lecture 12.pptx", "slide": 46, "text": "Washington’s Inauguration in New York, 1789"}, {"deck": "Lecture 12.pptx", "slide": 47, "text": "Washington Suppresses the Whiskey Rebellion"}, {"deck": "Lecture 12.pptx", "slide": 48, "text": "Washington argued that the greatest danger to America was the division into political parties and factional politics. Washington’s Farewell Address"}, {"deck": "Lecture 12.pptx", "slide": 49, "text": "The Human Dimensions of Washington Washington was land and credit rich and cash poor so he had to borrow money to travel to New York for his inauguration after he was elected President. The evidence suggests that Washington may have fallen in love with Sally Fairfax, a woman married to one of his friends. Washington had a dog named ”Sweet Lips” and one called “Madam Moose” and one called “Drunkard”"}, {"deck": "Lecture 12.pptx", "slide": 50, "text": "Sally Fairfax and Martha Washington “’Tis true, I profess myself a Votary to Love — I acknowledge that a Lady is in the Case — and further I confess, that this Lady is known to you”."}, {"deck": "Lecture 12.pptx", "slide": 51, "text": "Not a wig!"}, {"deck": "Lecture 12.pptx", "slide": 52, "text": "George’s Teeth The owner of the nation's most famous false teeth attributed his dental problems to his habit as a youth of cracking walnuts with his teeth.  His famous dentures were not made of wood--they were composed of cows' teeth, human teeth (one of his own), and ivory from walrus and hippopotamus tusks."}, {"deck": "Lecture 12.pptx", "slide": 54, "text": "In a letter to his dentist the President wrote that the false teeth were \"both uneasy in the mouth, and bulge my lips out in such a manner as to make them appear considerably swelled.\""}, {"deck": "Lecture 12.pptx", "slide": 55, "text": "“…Self taught or Book learned in the Arts, our Hero was much indebted to his Talents for “his immense elevation above his Fellows.” Talents? you will Say, what Talents? I answer. 1). An handsome Face. That this is a Talent, I can prove by the authority of a thousand Instances in all ages…2). A tall Stature, like the Hebrew Sovereign chosen because he was taller by the Head…” John Adams on George Washington’s Ten Talents"}, {"deck": "Lecture 12.pptx", "slide": 56, "text": "“3) An elegant Form.  4). graceful Attitudes and Movement… 5). a large imposing Fortune consisting of a great landed Estate left him by his Father and Brother, besides a large Jointure with his Lady…here is nothing, except bloody Battles and Splendid Victories, to which Mankind bow down with more reverence than to great fortune.” John Adams on George Washington’s Ten Talents"}, {"deck": "Lecture 12.pptx", "slide": 57, "text": "”6.) Washington was a Virginian. This is equivalent to five Talents. Virginian Geese are all Swans.” 7) Washington was  preceeded  by  favourable  Anecdotes… 8.) He possessed the Gift of Silence… 9.) He had great Self Command. It cost him a great Exertion Sometimes, and a constant Constraint… 10) Whenever he lost his temper as he did Sometimes, either Love or fear in those about him induced them to conceal his Weakness from the World.” John Adams on George Washington’s Ten Talents"}, {"deck": "Lecture 12.pptx", "slide": 58, "text": "With a partner read over the document and answer the following questions… You can get a paper copy from the front of the room or use the file uploaded to Week 7. Which of these rules do we still try to adhere to today? Which  of these rules seem most alien in the modern context? What do Washington’s rules tell us about the ideals of genteel and civilized behavior in the eighteenth century, and what has changed in our more modern understanding of proper behavior?  What were the core principles or values in Washington’s list? Washington’s Rules of Civility"}, {"deck": "Lecture 13.pptx", "slide": 1, "text": "Exam Prep"}, {"deck": "Lecture 13.pptx", "slide": 2, "text": "Exam Structure (Covering everything until the end of Tuesday) You will have four types of questions. You will select questions from more than one option on both the ID”s and the Essays. Short Answer…. Essay…There will be two options. One will be a standard analytical essay and the other will be an imaginative history essay. Multiple Choice…. ID’s…. You will answer one of three options"}, {"deck": "Lecture 13.pptx", "slide": 3, "text": "Recap Essay Questions Was the expedition of Pánfilo de Narváez a success or a failure? Why? What were the factors that contributed to that success or failure? What does the expedition of Pánfilo de Narváez reveal about the Spanish colonization of the Americas? Why did the Roanoke colony fail? What do you think happened to the settlers and why? Contrast and compare the settlements of Roanoke (North Carolina), Jamestown (Virginia) and Meta Incognita (Arctic). Why did two fail while one succeeded? What was the experience of childhood like in Puritan New England in the seventeenth century?"}, {"deck": "Lecture 13.pptx", "slide": 4, "text": "ID’s  Identify, contextualize, and state the significance of the following people, places, processes or events. Salem Witch Hunts Roanoke Colony Puritan Diaspora Little Ice Age William Byrd Jamestown Colony"}, {"deck": "Lecture 13.pptx", "slide": 5, "text": "Effective Footnoting You must use Chicago Manual of Style Footnotes. Use the “Notes and Bibliography” System https://www.chicagomanualofstyle.org/tools_citationguide.html"}, {"deck": "Lecture 13.pptx", "slide": 6, "text": "Effective Footnoting Laurent Dubois and John D. Garrigus, “Introduction,” in  Slave Revolution in the Caribbean, 1789-1804 , ed. by Dubois and Garrigus (Boston: Bedford/St. Martin’s, 2016), 12. Raimond Julien, “Observations on the Origin and Progression of the White Colonists’ Prejudice against Men of Color 1791,” in  Slave Revolution in the Caribbean, 1789-1804 , ed. Laurent Dubois and John D. Garrigus (Boston: Bedford/St. Martin’s, 2016), 68. If a document has no author, you can simply list the title"}, {"deck": "Lecture 13.pptx", "slide": 7, "text": "Effective Footnoting 1. Bernal Diaz del Castillo, “The True History of the Conquest of New Spain, trans. Alfred P Maudlsay,” in  Victors and Vanquished: Spanish and Nahua Views of the Fall of the Mexica Empire , ed. Stuart B. Schwartz and Tatiana Seijas (Boston: Bedford/St. Martin’s, 2018), 85. 2. Diaz, “Conquest of New Spain,” 155."}, {"deck": "Lecture 13.pptx", "slide": 8, "text": "Effective Footnoting Richard Godbeer, ed.  The Salem Witch Hunt: A Brief History With Documents  (Boston: Bedford/St. Martins, 2018), 128."}, {"deck": "Lecture 13.pptx", "slide": 9, "text": "Battle of the Titans: North America and the Eighteenth-Century Anglo-Franco Wars"}, {"deck": "Lecture 13.pptx", "slide": 10, "text": "Great Britain: 8,500,000 France 21,500,000 Spain: 8,770,000 Portugal: 2,000,000 The Netherlands (the Dutch): 1,900,00 National Populations of Europe in 1700"}, {"deck": "Lecture 13.pptx", "slide": 11, "text": "Great Britain: 21,226,000 France: 32,246,000 Spain: 12,200,000 Portugal: 2,300,000 The Netherlands (the Dutch): 2, 355, 000 National Populations of Europe in 1800"}, {"deck": "Lecture 13.pptx", "slide": 12, "text": "France was Europe’s preeminent land power Spain had declined in power throughout the 17 th  century, leaving a vacuum to be filled- By 1650, they were clearly a second-class power in Europe Englishmen on average were richer than Frenchmen in 1700, but England was not yet a major power in Europe The English and French navies were vying for control of the Atlantic France and Spain were in the midst of an economic crisis Balance of Power in 1700"}, {"deck": "Lecture 13.pptx", "slide": 13, "text": "Spanish Americas"}, {"deck": "Lecture 13.pptx", "slide": 14, "text": "Spanish Main and the Indies"}, {"deck": "Lecture 13.pptx", "slide": 15, "text": "Catholic France and Protestant Britain"}, {"deck": "Lecture 13.pptx", "slide": 16, "text": "Throughout the 18 th  century, the British and French were at nearly constant war with each other. They fought six major wars and most of these wars played out on both sides of the Atlantic By the end of the 18 th  century, in large part as a result of these wars, the Atlantic Ocean and the Americas were dominated by the Royal Navy, British commerce and London finance If the 20 th  century was the American century, the 18 th  century was the British century Anglo-French Rivalries and the British Rise to Prominence"}, {"deck": "Lecture 13.pptx", "slide": 17, "text": "By 1750, the British Empire began to be self-defining as Protestant, Commercial, Maritime and Free The Rights of Free-Born Englishmen were continually stressed, and it was said that the air of England was too free for a slave to breathe The rise of the Brits"}, {"deck": "Lecture 13.pptx", "slide": 20, "text": "The Anglo-French Wars Begin: Nine-Year War (1689-1697)"}, {"deck": "Lecture 13.pptx", "slide": 21, "text": "Naval Arms Race Begins The French were defeated in a decisive naval battle by the English in 1692 and they stopped making improvements in ship technology or focusing on ship building.  The French switched to relying on privateers, cheaper but less effective for controlling the seas"}, {"deck": "Lecture 13.pptx", "slide": 22, "text": "“King Williams’ War” in North America There was extensive fighting in North America between the French and the English in New England and New York. The French moved an invasion force for  attacking New England into Quebec, but it was too late in the winter for an invasion During the war, the Iroquois allied with the British and attacked French settlements near Montreal, massacring over 300 settlers.  Led to constant raids among the French, English and Natives along the frontier between New England and New France Massachusetts captured Port Royal in Acadia (Nova Scotia) with 700 men raised in the colony but left quickly when a French warship arrived The Salem Witch Hunts take place in 1692!"}, {"deck": "Lecture 13.pptx", "slide": 23, "text": "Charles II of Spain died. A relative of Louis XIV, Phillippe,  duc   d'Anjou , inherited the throne, making France and Spain allies. Spain and France might one day be ruled under one monarch… England, the Netherlands, Portugal, Prussia and Austria supported an Austrian heir to the Spanish throne instead and went to war in a coalition. According to Louis XIV, “The principal object of the present war is the commerce of the Indies.” [North and South America] War of Spanish Succession  (1701-1713)"}, {"deck": "Lecture 13.pptx", "slide": 24, "text": "During the war, battle waged throughout the Atlantic and Indian Oceans At least 400,000 were killed St. Kitts, Nevis, Acadia and Newfoundland switched hands. Acadia (French Territory) became Nova Scotia A planned invasion of New France from New England failed The Iroquois were recognized by the French as British Subjects Britain recognized Phillip as King of Spain In return Britain gained the  Asiento The War of Spanish Succession (1701-1713)n"}, {"deck": "Lecture 13.pptx", "slide": 25, "text": "“Queen Anne’s War” in North America In America, the War of Spanish Succession was sometimes known as Queen Anne’s War. It was an Anglo-American war against French and Spanish colonial possessions on the mainland.  British South Carolina sent forces against Spanish Florida. More raids erupted along the border between New France and New England New Englanders attempted another invasion of New France, but failed when a ship with 700 soldiers ran aground in the St. Lawrence"}, {"deck": "Lecture 13.pptx", "slide": 26, "text": "400,000 killed over the War of Spanish Succession"}, {"deck": "Lecture 13.pptx", "slide": 27, "text": "The Golden Age of Piracy, 1713-1726"}, {"deck": "Lecture 13.pptx", "slide": 28, "text": "France rebuilds its navy.  Builds fortress of  Louisbourg  in Nova Scotia Expands their colony in Louisiana  Increases sugar production in the Caribbean Britain spent even more on its navy. By 1739, it had twice as many warships as France. The Long Anglo-Franco Peace, 1720-1739"}, {"deck": "Lecture 13.pptx", "slide": 30, "text": "“The  Rebecca , Capt. Jenkins, was taken in her passage from Jamaica, by a Spanish  Guarde  Costa, who put her people to the torture; part of which was, that they  hang'd  up the Capt. three times, once with the Cabin-boy at his feet; they then cut off one of his Ears, took away his candles and instruments, and  detain'd  him a whole day. Being then dismissed, the Captain bore away for the Havana, which the Spaniards perceiving stood after her, and declared, that if she did not immediately go for the Gulf, they would set the Ship on fire; to which they were forced to submit, and after many Hardships and Perils arrived in the River Thames, June 11. The Captain has since been at Court and laid his case before his Majesty.” What Happened to Jenkins’ Ear?"}, {"deck": "Lecture 13.pptx", "slide": 32, "text": "War of Jenkins’ Ear- Britain declares war on Spain in 1739. France went to aid Spain. Britain uses its naval power to blockade French territories throughout the Americas The War of Austrian Succession (1739-1748)"}, {"deck": "Lecture 13.pptx", "slide": 33, "text": "Most of the the war was fought by privateers in the West Indies who burned each other’s plantations and fields and captured slaves British captured  Louisbourg  in Nova Scotia 1745. New England soldiers played a key role. Louisbourg  was returned to the French in 1748 after the war in exchange for French conquests in the Netherlands New Englanders were outraged! The War of Jenkins’ Ear in North Americas ( 1739-1748)"}, {"deck": "Lecture 13.pptx", "slide": 34, "text": "Map of the Americas after the War of Jenkins’ Ear"}, {"deck": "Lecture 13.pptx", "slide": 35, "text": "Treaty of Lancaster, 1744 Iroquois sold the  Shenandoah  Valley to the British after claiming the territory by right of conquest. The French also claimed the  Shenandoah  valley and were determined to prevent British colonists from moving across the Appalachian mountains into the interior. Sparking the Seven-Year War known in the Americas as The French and Indian War"}, {"deck": "Lecture 13.pptx", "slide": 36, "text": "North America in 1754"}, {"deck": "Lecture 13.pptx", "slide": 37, "text": "Young George Washington and the French and Indian War"}, {"deck": "Lecture 13.pptx", "slide": 41, "text": "Battle of Jumonville Glen May 28 th , 1754"}, {"deck": "Lecture 13.pptx", "slide": 42, "text": "Battle of Fort Necessity July 3 rd , 1754"}, {"deck": "Lecture 13.pptx", "slide": 45, "text": "Largest war of the eighteenth-century Happened on a global scale Between 900,000 and 1.4 million were killed Prussia, Britain and Portugal fought against France, Austria, Sweden, Spain, Saxony and Russia (Russia switched sides temporarily in the later years of the war Battles occurred throughout Europe and on the coast of India and in eastern North America, the Northeastern shore of South America, the west coast of Africa and the Caribbean The French were very successful in the early years of the war, winning most of the battles but the tide turned in 1758 The Seven Years’ War (1754-1763)"}, {"deck": "Lecture 13.pptx", "slide": 46, "text": "“It is plain that you white people are the cause of the war. Why do not you and the French fight in the old country, and on the sea? Why do you come to fight on our land? This makes every body believe, you want to take the land from us by force, and settle it.” \t~chief of a tribe in the Ohio Valley The Seven Years’ War and the Iroquois"}, {"deck": "Lecture 13.pptx", "slide": 47, "text": "Braddock’s March 1755 The British effort to capture Fort  Duquense  (modern-day Pittsburgh)"}, {"deck": "Lecture 13.pptx", "slide": 51, "text": "Braddock’s Road"}, {"deck": "Lecture 13.pptx", "slide": 52, "text": "Washington at Battle of  Monogahela July 9, 1755"}, {"deck": "Lecture 13.pptx", "slide": 53, "text": "Washington had two horses shot out from under him and four bullet holes in his coat.  Washington organized the retreat, preventing a total massacre"}, {"deck": "Lecture 13.pptx", "slide": 54, "text": "Daniel Boone"}, {"deck": "Lecture 13.pptx", "slide": 55, "text": "After terrible losses in the early years of the war Secretary of State William Pitt became determined to spend everything it took to route the French in the Americas and expand the British empire.  The British spent enormous sums of money from 1757 to 1760 and regained much of the Ohio Valley as well as Acadia and Quebec"}, {"deck": "Lecture 13.pptx", "slide": 56, "text": "For the first time, the British treated the colonists as full partners rather than subordinates Turing to the Colonial Militia"}, {"deck": "Lecture 13.pptx", "slide": 57, "text": "Washington resigned his commission in 1758 after finally capturing Fort  Duquense . He was frustrated by his experiences"}, {"deck": "Lecture 13.pptx", "slide": 58, "text": "Seven Years War’ in North America"}, {"deck": "Lecture 13.pptx", "slide": 59, "text": "Acadian Expulsion (July 28, 1755)"}, {"deck": "Lecture 13.pptx", "slide": 60, "text": "Britain gained control of French Canada and Acadia, colonies containing approximately 80,000 French-speaking Roman Catholic residents.  The Acadians refused to swear an oath of allegiance. They insisted on remaining neutral and the British grew nervous.  The British forced 7,000 Acadians to leave. Others fled of their own accord.  Thousands of Acadians died in the process from starvation, shipwreck and disease.  The majority of the Acadians went to French Louisiana. Louisiana’s “Cajun” population has its roots in this forced migration.  The Seven Years’ War and Acadian Expulsions"}, {"deck": "Lecture 13.pptx", "slide": 61, "text": "Battle of the Plains of Abraham"}, {"deck": "Lecture 13.pptx", "slide": 62, "text": "In 1759, Montcalm (French Commander) heavily fortified Quebec City and awaited the British The British struggled to land troops ashore and attack Quebec several times, but they were unsuccessful Finally landed troops  upriver and marched towards the city. Rather than retreat to the fortified city,  Montcalm  marched out and met them in battle on the Plains of Abraham, in traditional European style warfare. The French were defeated and as Montcalm retreated. He was mortally wounded when a British musket ball found its way into his belly. Quebec fell and New France was forced to surrender in 1760. The war was over in 1763 The Fall of Quebec"}, {"deck": "Lecture 13.pptx", "slide": 63, "text": "Montcalm  asked how long he might survive, and was told that he had not many hours remaining. \"So much the better,\" he said; \"I am happy that I shall not live to see the surrender of Quebec. Officers from the garrison came to his bedside to ask his orders and instructions \"I will give no more orders...I have much business that must be attended to, of greater moment than your ruined garrison and this wretched country. My time is very short; therefore, pray leave me.” He died at midnight, and was buried at his own desire in a cavity of the earth formed by the bursting of a bombshell. Montcalm’s  Death"}, {"deck": "Lecture 13.pptx", "slide": 64, "text": "The British offered France a choice of either Canada or the Caribbean islands of Guadeloupe and Martinique, which had been occupied by the British.  France chose to give u[ Canada. Spain traded Florida to Britain to regain Cuba and Manilla Treaty of Paris Negotiations"}, {"deck": "Lecture 13.pptx", "slide": 65, "text": "Britain agreed to demolish its fortifications in British Honduras (Belize), but received permission from Spain to keep a logwood-cutting colony there. Britain confirmed in the treaty the rights of its new subjects in Quebec to practice the Roman Catholic faith  Treaty of Paris Negotiations"}, {"deck": "Lecture 13.pptx", "slide": 67, "text": "According to Voltaire, the French had lost nothing but “a few acres of snow” in Canada"}, {"deck": "Lecture 13.pptx", "slide": 68, "text": "1763 Proclamation Line"}, {"deck": "Lecture 2.pptx", "slide": 2, "text": "Before 1492: Indigenous Empires and The Beginning of European Expansion"}, {"deck": "Lecture 2.pptx", "slide": 3, "text": "Who discovered the Americas and when?"}, {"deck": "Lecture 2.pptx", "slide": 4, "text": "Indigenous American Population Sizes in 1492 Estimates of the Population of the Americas in 1492 have ranged from 8 million to 112 million. 45 to 55 million is the standard estimate. Population of Western Europe in 1500 was roughly 55 million. Sub-Saharan Africa had a population of roughly 38 million. At least a thousand different indigenous languages in the Americas. 59 language families Roughly 40% in the Aztec Empire, 25% in the Inca Empire and 10% in the Mayan Empire Less than 10% of the indigenous population of the Americas resided in North America "}, {"deck": "Lecture 2.pptx", "slide": 5, "text": "Indigenous Population Estimates and Comparisons in 1492 North America: 3,800,000 Mexico: 17,200,000 Central America: 5,625,000 Hispaniola:1,000,000 The Caribbean: 3,000,000 The Andes: 15,700,000 South America: 8,620,000 Total: 53, 904, 000"}, {"deck": "Lecture 2.pptx", "slide": 6, "text": "Global Agriculture and Husbandry 5 leading cereal crops: wheat, corn, rice, barley, sorghum Most widespread domesticated livestock species: cows, sheep, goats, pigs and horses Grain allows for a surplus of calories, and it tends to lead to social stratification"}, {"deck": "Lecture 2.pptx", "slide": 7, "text": "American Husbandry and Cereal Crops Mesoamerica: Turkey and Dog and Corn Central Andes: Llama, Alpaca and Guinea Pig and Corn"}, {"deck": "Lecture 2.pptx", "slide": 9, "text": "Incas"}, {"deck": "Lecture 2.pptx", "slide": 12, "text": "Classical Mayan Civilization began to collapse from overpopulation, declining resources and warfare around 900 CE"}, {"deck": "Lecture 2.pptx", "slide": 15, "text": "100,000 people in Tenochtitlan in 1492 100,000 to 150,000 in Paris in 1492"}, {"deck": "Lecture 2.pptx", "slide": 16, "text": "Cahokia and the Mississippians"}, {"deck": "Lecture 2.pptx", "slide": 19, "text": "Cahokia and the Mississippians  Cahokia was at its height between 1000 and 1400 CE with a population of 20,000 to 40,000 There were other major Indigenous city centers in Georgia, Alabama and Indiana between 1150 and 1400 CE Intensive corn agriculture- mixed with squash and beans Complex hierarchies Environmental stress led to the collapse of these centers"}, {"deck": "Lecture 2.pptx", "slide": 20, "text": "Medieval Warm Period A period of time from about 900 until about 1350 when the average temperature was three to five degrees Celsius warmer than today"}, {"deck": "Lecture 2.pptx", "slide": 22, "text": "The population of London in 1100 CE was 15,000 to 18,000"}, {"deck": "Lecture 2.pptx", "slide": 23, "text": "Norse Expansion"}, {"deck": "Lecture 2.pptx", "slide": 24, "text": "A period of time from about 900 until about 1350 when the average temperature was three to five degrees Celsius warmer than today Meant that the northern seas were more navigable Vinland: Land of grapes or land of meadows Markland : Forest Land Helluland : Land of Flat Stones The Medieval Warm Period"}, {"deck": "Lecture 2.pptx", "slide": 25, "text": "Norse Expansion The Norse invaded and settled large areas of the British Isles, France and Spain They came as Pagans but many converted to Christianity in the 10 th  and 11 th  centuries Our days of the week still bear their mark"}, {"deck": "Lecture 2.pptx", "slide": 26, "text": "Norse slave raids and looting begin in England in 793 Norse settlers travelled to Iceland about 871 Early 10 th  century a Norseman found Greenland Erik the Red made two voyages to Greenland Erik’s second Voyage in 985 included 25 ships but only 14 arrived Established two settlements: The eastern settlement had 4,000 people and the western had 1,000 Time line of Norse Expansion"}, {"deck": "Lecture 2.pptx", "slide": 27, "text": "Timeline of Norse Expansion Bjarni   Herjolfsson  overshot Iceland and reached Newfoundland in the early 11th century In the 11th century, Erik the Red’s son Leif Eriksson or “Leif the Lucky” sailed to the coast of Labrador and wintered there- possibly 1001 The Norse established  L’anse  Aux Meadows in northern Newfoundland but it’s not clear how long the settlement lasted The last settlement in Greenland dies out in 1408? A voyage in 1540 found the dead body of a Norseman on the beach, his knife worn down to a stub. "}, {"deck": "Lecture 2.pptx", "slide": 28, "text": "Helleland , Markland, Vinland"}, {"deck": "Lecture 2.pptx", "slide": 32, "text": "Leif Eriksson Discovers North America in 1001"}, {"deck": "Lecture 2.pptx", "slide": 38, "text": "L'Anse-aux-Meadows, Newfoundland"}, {"deck": "Lecture 2.pptx", "slide": 40, "text": "Point  Rosee ?"}, {"deck": "Lecture 2.pptx", "slide": 42, "text": "Danish  Skálholt  map, 1570 "}, {"deck": "Lecture 2.pptx", "slide": 43, "text": "Medieval Norse Geography"}, {"deck": "Lecture 2.pptx", "slide": 45, "text": "Maine Penny"}, {"deck": "Lecture 2.pptx", "slide": 46, "text": "Karlsefni  and his people sailed to the mouth of the river, and called the land Hop. There they found fields of wild wheat wherever there were low grounds; and the vine in all places were there was rough rising ground. Every rivulet there was full of fish. They made holes where the land and water joined and where the tide went highest; and when it ebbed they found halibut in the holes. There was great plenty of wild animals of every form in the wood. They were there half a month, amusing themselves, and not becoming aware of anything. Their cattle they had with them. And early one morning, as they looked around, they beheld nine canoes made of hides, and snout-like staves were being brandished from the boats, and they made a noise like flails, and twisted round in the direction of the sun's motion. Vikings and  Skraelings : The Saga of Erik the Red"}, {"deck": "Lecture 2.pptx", "slide": 47, "text": "Then  Karlsefni  said, \"What will this betoken?\"  Snorri  answered him, \"It may be that it is a token of peace; let us take a white shield and go to meet them.\" And so they did. Then did they in the canoes row forwards, and showed surprise at them, and came to land. They were short men, ill-looking, with their hair in disorderly fashion on their heads; they were large-eyed and had broad cheeks. And they stayed there awhile in astonishment. Afterwards they rowed away to the south, off the headland. The Saga of Erik the Red"}, {"deck": "Lecture 2.pptx", "slide": 48, "text": "Now it came to pass that a bull, which belonged to  Karlsefni's  people, rushed out of the wood and bellowed loudly at the same time. The  Skrælingar , frightened thereat, rushed away to their canoes, and rowed south along the coast. There was then nothing seen of them for three weeks together. When that time was gone by, there was seen approaching from the south a great crowd of  Skrælingar  boats, coming down upon them like a stream, the staves this time being all brandished in the direction opposite to the sun's motion, and the  Skrælingar  were all howling loudly. Then took they and bare red shields to meet them. They encountered one another and fought, and there was a great shower of missiles. The  Skrælingar  had also war-slings, or catapults. The Saga of Erik the Red"}, {"deck": "Lecture 2.pptx", "slide": 49, "text": "Then  Karlsefni  and  Snorri  see that the  Skrælingar  are bringing up poles, with a very large ball attached to each, to be compared in size to a sheep's stomach, dark in colour; and these flew over  Karlsefni's  company towards the land, and when they came down they struck the ground with a hideous noise. This produced great terror in  Karlsefni  and his company, so that their only impulse was to retreat up the country along the river, because it seemed as if crowds of  Skrælingar  were driving at them from all sides. And they stopped not until they came to certain crags. There they offered them stern resistance. The Saga of Erik the Red"}, {"deck": "Lecture 2.pptx", "slide": 50, "text": "Freydis  came out and saw how they were retreating. She called out, \"Why run you away from such worthless creatures, stout men that ye are, when, as seems to me likely, you might slaughter them like so many cattle? Let me but have a weapon, I think I could fight better than any of you.\" They gave no heed to what she said.  Freydis  endeavoured to accompany them, still she soon lagged behind, because she was not well; she went after them into the wood, and the  Skrælingar  directed their pursuit after her. She came upon a dead man;  Thorbrand ,  Snorri's  son, with a flat stone fixed in his head; his sword lay beside him, so she took it up and prepared to defend herself therewith. The Saga of Erik the Red: The Story of Freydís Eiríksdóttir"}, {"deck": "Lecture 2.pptx", "slide": 51, "text": "Then came the  Skrælingar  upon her. She let down her  sark  and struck her breast with the naked sword. At this they were frightened, rushed off to their boats, and fled away.  Karlsefni  and the rest came up to her and praised her zeal. Two of  Karlsefni's  men fell, and four of the  Skrælingar , notwithstanding they had overpowered them by superior numbers. After that, they proceeded to their booths and began to reflect about the crowd of men which attacked them upon the land; it appeared to them now that the one troop will have been that which came in the boats, and the other troop will have been a delusion of sight. The  Skrælingar  also found a dead man, and his axe lay beside him. One of them struck a stone with it, and broke the axe. It seemed to them good for nothing, as it did not withstand the stone, and they threw it down. The Saga of Erik the Red"}, {"deck": "Lecture 2.pptx", "slide": 52, "text": "Basque and Bristol fishermen- 15 th  century Irish monks St. Brendan- 6 th  century Prince Madoc- 1171 Portuguese navigators North Atlantic whalers Chinese on the West Coast in 1421 Columbus in Newfoundland Other Early Expeditions?"}, {"deck": "Lecture 2.pptx", "slide": 54, "text": "1453: Ottoman Empire captures Constantinople (modern day Istanbul)- barring access to the silk road and overland trade with the far east"}, {"deck": "Lecture 2.pptx", "slide": 57, "text": "13 th  Century Spain"}, {"deck": "Lecture 2.pptx", "slide": 58, "text": "Catalan Atlas, 1375"}, {"deck": "Lecture 2.pptx", "slide": 59, "text": "1415: Portuguese conquer Ceuta"}, {"deck": "Lecture 2.pptx", "slide": 60, "text": "Prince Henry the Navigator (1394-1460)"}, {"deck": "Lecture 2.pptx", "slide": 61, "text": "Portuguese Caravel"}, {"deck": "Lecture 2.pptx", "slide": 62, "text": "Fra  Mauro Map of 1453"}, {"deck": "Lecture 2.pptx", "slide": 63, "text": "Cape Bojador The cape was first crossed in 1434"}, {"deck": "Lecture 2.pptx", "slide": 64, "text": "1469 Portuguese settle a “factory” in Elmina"}, {"deck": "Lecture 2.pptx", "slide": 65, "text": "Madeira Islands Rediscovered in 1420 Portuguese began cultivating sugar there in 1455 Madeira means “woods”- the island was filled with trees on first arrival"}, {"deck": "Lecture 2.pptx", "slide": 66, "text": "Azores Rediscovered in 1427"}, {"deck": "Lecture 2.pptx", "slide": 67, "text": "Cape Verde Islands Rediscovered in 1455-1456"}, {"deck": "Lecture 2.pptx", "slide": 68, "text": "Canary Islands Portuguese claimed to have discovered them in 1346."}, {"deck": "Lecture 2.pptx", "slide": 69, "text": "1488 Bartolomew  Dias sails around the Cape of Good Hope"}, {"deck": "Lecture 2.pptx", "slide": 70, "text": "1498 Vasco de Gama is the first Portuguese sailor to sail from Portugal to India Proving that the Indian Ocean was not land locked"}, {"deck": "Lecture 2.pptx", "slide": 73, "text": "“by signs they made it known” Setting the Stage: Communicating in the New World"}, {"deck": "Lecture 2.pptx", "slide": 74, "text": "From signs, “we understood that they asked us if we had come from heaven.” “they said, according to the signs which they made,...the people of the place gather gold on the shore at night with candles, and afterwards...with a mallet they make bars of” Columbus “Talks” to the “Indians”"}, {"deck": "Lecture 2.pptx", "slide": 75, "text": "“Due to the lack of language...we were unable to find out by signs or gestures how much religious faith these people possess” but “We think that they have neither religion nor laws, that they do not know of a First Cause or Author” Verrazano “Talks” to the Natives"}, {"deck": "Lecture 3.pptx", "slide": 1, "text": "Maps, Mythologies and Monsters: Columbus, the Columbian Exchange and First Encounters between Natives and Europeans"}, {"deck": "Lecture 3.pptx", "slide": 2, "text": "Readings: You should finish each week’s readings before the Thursday class of that week.  Pop quizzes will cover everything up to the end of the previous week. A pop quiz in Week 6 will cover everything through the end of Week 5. Exams are different. They will cover everything up to the date of the exam, including the readings for that current week."}, {"deck": "Lecture 3.pptx", "slide": 3, "text": "Notes Sample notes are being compiled by the TA’s and posted online. "}, {"deck": "Lecture 3.pptx", "slide": 4, "text": "Map Quiz If you do not have a partner for the map quiz, you must speak to one of the TA’s. "}, {"deck": "Lecture 3.pptx", "slide": 5, "text": "Knowledge Creation What is a rumour? What is a fact?"}, {"deck": "Lecture 3.pptx", "slide": 6, "text": "How do rumours work? Why are they pervasive? Can you think of rumours or urban myths you have heard that you later found out were nonsense? Think about what those rumours are based on…"}, {"deck": "Lecture 3.pptx", "slide": 7, "text": "India? Central Asia Ethiopia? Earthly Paradise? Fountain of Youth? Prester  John"}, {"deck": "Lecture 3.pptx", "slide": 8, "text": "The Legend Gains Strength Prester  John’s Letter (circa 1165)? Pope Alexander III sent a reply in 1177"}, {"deck": "Lecture 3.pptx", "slide": 10, "text": "In 1306, 30 Ethiopian ambassadors toured Europe and  Prester  John was identified as the patriarch of their church Ambassadors from Zara  Yaqob  from the region the Europeans knew as Ethiopia attended the Council of Florence in 1441.  They left very confused… \"They were black men and dry and very awkward in their bearing (...) really, to see them they appeared to be very weak\" Prester  John?"}, {"deck": "Lecture 3.pptx", "slide": 11, "text": "1487- a Portuguese overland mission sets out to help map the route to India and gather information but also to find  Prester  John  Prester  John is referred to in Shakespeare’s  Much Ado About Nothing It wasn’t until the mid-seventeenth century that Europeans stopped looking for Prester John"}, {"deck": "Lecture 3.pptx", "slide": 12, "text": "Prester  John in Marvel Comics Prester  John was preserved from the 12th century until modern times in the Chair of Survival by the alchemists of Avalon He was the possessor of the ”Evil Eye”"}, {"deck": "Lecture 3.pptx", "slide": 13, "text": "The Voyage of Marco Polo (1254-1324) Polo left Venice to travel through the Mongolian empire, including China, in 1271. He returned 24 years later. Many people questioned whether he was telling the truth."}, {"deck": "Lecture 3.pptx", "slide": 14, "text": "The Book of the Marvels of the World (1295-1298)"}, {"deck": "Lecture 3.pptx", "slide": 15, "text": "Martin  Behaim  Globe, 1492"}, {"deck": "Lecture 3.pptx", "slide": 16, "text": "Fra  Mauro Map of 1453"}, {"deck": "Lecture 3.pptx", "slide": 17, "text": "Mythical Islands John Mandeville after travelling in 1488 claimed there were 5,000 islands east of Asia Marco Polo claimed 12,700 islands in the Indie Sea and 7,459 in the China Sea Arab geographers claimed 5,000 islands off the coast of Asia"}, {"deck": "Lecture 3.pptx", "slide": 18, "text": "North Atlantic Map, circa 1450s"}, {"deck": "Lecture 3.pptx", "slide": 20, "text": "Jasconius and St. Brendan the Navigator (488-577) According to Irish legend, a monk told St. Brendan that he had just returned from a visit to “the land of promise and of the saints”―a land 40-days' voyage from Ireland."}, {"deck": "Lecture 3.pptx", "slide": 22, "text": "Detail from a Spanish Map of the Americas"}, {"deck": "Lecture 3.pptx", "slide": 23, "text": "Irish Legends St. Brendan supposedly travelled in 489 AD into the North Atlantic on a spiritual mission in his 70s with 7 other monks. Their journey was written down by a chronicler nearly 500 years later.  They used a wood-frame boat covered with ox-hides and they sailed around for seven years before finding ”the Land of Promise of the Saints” and returning with fruits and precious stones. On his voyage, they landed on an island as big as a monster The Norse Sagas claim that there were Irish saints in Iceland when they arrived. In the 1970s, a man named Tim Severin built a replica boat and sailed it from Ireland to Newfoundland!"}, {"deck": "Lecture 3.pptx", "slide": 24, "text": "El Dorado An early Spanish conquistador claimed in 1531 to have been rescued from a shipwreck in the New World where he had been conveyed inland and entertained by the king of \"El Dorado“  Rumour circulated in many stories of a native chief who covered himself in gold dust before bathing. This was often referred to as the kingdom of El Dorado"}, {"deck": "Lecture 3.pptx", "slide": 25, "text": "El Dorado Expeditions 1540- Gonzalo Pizzaro, governor of Quito in northern Ecuador- took 340 soldiers and 4000 natives on an expedition inland to seek out the origins of rumours about a city of gold and cinnamon in the interior Gonzallo  Pizzaro was the younger half-brother of  Franscisco  Pizzaro who conquered the Incas.  Gonzallo  had also been responsible for claiming the Inca ruler  Manko’s  wife as his own. He had a reputation for being handsome and cruel. "}, {"deck": "Lecture 3.pptx", "slide": 26, "text": "El Dorado Expeditions Continue 1541- Philipp von Hutten, a Dutchman, set out from Venezuela- Found nothing and most of his men died 1569- Gonzalo Jiménez de Quesada proclaimed himself Governor of El Dorado and set out from Bogota, Columbia- Horrible failure 1596- Sir Walter Raleigh convinced that El Dorado was in Guiana on the Orinoco River, set out in an expedition.  The city was often marked on English maps in Guiana until as late as Alexander con Humboldt’s expedition in 1799-1804"}, {"deck": "Lecture 3.pptx", "slide": 27, "text": "Lake  Parime : El Dorado? 1625"}, {"deck": "Lecture 3.pptx", "slide": 28, "text": "Sir Arthur Conan Doyle imagined that dinosaurs still lived in the Guianas"}, {"deck": "Lecture 3.pptx", "slide": 29, "text": "Brasil"}, {"deck": "Lecture 3.pptx", "slide": 30, "text": "Brasil"}, {"deck": "Lecture 3.pptx", "slide": 32, "text": "Columbus’ Notes Columbus acquired copies of John Mandeville’s visit to Asia and of Marco Polo’s visits to Asia"}, {"deck": "Lecture 3.pptx", "slide": 33, "text": "Millenarianism and the Late Medieval Mind Columbus was a millenarian- He calculated precisely how many days were left in the world.  He called himself ”Christ-Bearer.” "}, {"deck": "Lecture 3.pptx", "slide": 34, "text": "1484 In 1484, Columbus’ first proposal for westward expansion was rejected. Why? Portugal had not yet reached the Indies Spain had not yet finished the Reconquista (next class  )    "}, {"deck": "Lecture 3.pptx", "slide": 38, "text": "Columbus’ First Voyage to the Americas was 5 times longer than he expected (70 days) His men almost mutinied No Europeans had ever been at sea and out of sight of land for more than a week He was convinced that the Indies were closer He thought the distance was 2,000 to 3,000 miles and the actual distance was 12,000 miles"}, {"deck": "Lecture 3.pptx", "slide": 39, "text": "The Portuguese Caravel 75 feet by 21 feet A narrow draft of 6 feet Could travel up to 100 miles a day Columbus had two of these in his fleet along with a Carrack, a larger cargo ship. He sailed on his first voyage with about 90 men spread across three ships for 70 days."}, {"deck": "Lecture 3.pptx", "slide": 41, "text": "First Voyage, 1492-1493 Three boats with less than 100 people Arrives in San Salvador in the Bahamas Encounters the  Tainos Finds Gold Leaves 39 settlers behind on Hispaniola"}, {"deck": "Lecture 3.pptx", "slide": 42, "text": "They traded with us and gave us everything they had, with good  will..they  took great delight in pleasing  us..They  are very gentle and without knowledge of what is evil; nor do they murder or  steal..Your  highness may believe that in all the world there can be no better people ..They love their neighbours as themselves, and they have the sweetest talk in the world, and are gentle and always laughing. October 12, 1492"}, {"deck": "Lecture 3.pptx", "slide": 43, "text": "“I saw neither sheep nor goats nor any other beast, but I have been here a short time, half a day; yet if there were any I couldn’t have failed to see them...” “There were dogs that never barked...” “All the trees were as different from ours as day from night, and so the fruits, the herbage, the rocks, and all things...” Columbus on the New World"}, {"deck": "Lecture 3.pptx", "slide": 44, "text": "Second Voyage, 1493-1496 Much larger- 1200 settlers and 17 ships Filled with colonists and royal officials Finds all 39 settlers from the first voyage slaughtered Intended to establish a settlement in Hispaniola- Builds La Isabela in a swamp with no fresh water Builds a second city in the interior to mine gold in La Vega Columbus grows very wealthy"}, {"deck": "Lecture 3.pptx", "slide": 45, "text": "Columbus threatened to cut out sailor’s tongues if they said that they weren’t in Asia."}, {"deck": "Lecture 3.pptx", "slide": 47, "text": "Third Voyage, 1498-1500 Sails further south and encounters South America Sets himself up as governor of Hispaniola and establishes a new capital Brutal rule Sent home in irons"}, {"deck": "Lecture 3.pptx", "slide": 48, "text": "Columbus as Governor of Hispaniola"}, {"deck": "Lecture 3.pptx", "slide": 51, "text": "Columbus’ Earth after the Third Voyage Columbus speculated that the earth had a bulge, having the form of a pear. He also believed the earth had a prominence or raised point that was the garden of Eden, closest to Heaven Said the Garden of Eden was on the  Orinoco River"}, {"deck": "Lecture 3.pptx", "slide": 53, "text": "The Fourth Voyage: 1502-1504 After returning to Spain in chains, Columbus convinced the crown to allow him to make one more voyage. Will be done on a shoe-string budget- 4 Caravels Columbus is no longer allowed to benefit solely from the New World"}, {"deck": "Lecture 3.pptx", "slide": 54, "text": "Fourth Voyage Riddled with arthritis and gout, he rode through a Hurricane, was refused safe harbor in Hispaniola,  discovered the route to the Pacific and ignored it Tried to establish the first ever failed settlement on the mainland"}, {"deck": "Lecture 3.pptx", "slide": 55, "text": "Fourth Voyage Shipwrecked on Jamaica but he survived through sheer genius, luck and predictions of a lunar eclipse "}, {"deck": "Lecture 3.pptx", "slide": 56, "text": "Columbus died penniless in 1506, in constant pain, a failure on every front, unknown, discounted by the Spanish Crown, invisible to history until 1792. He died believing he was in Asia. "}, {"deck": "Lecture 3.pptx", "slide": 57, "text": "Treaty of  Tordesillas , 1494"}, {"deck": "Lecture 3.pptx", "slide": 58, "text": "Vasco de Gama, 1498 600 percent return on investment in a little more than two years 1/3 of the crew dead"}, {"deck": "Lecture 3.pptx", "slide": 59, "text": "Reports of Columbus’ Voyages “As the  Admirall  departed from the  Iland  of the  Canibales , and went  foreward  on his  viage , he passed by many  Ilandes : among the  whiche  was one called  Matinina , in  whyche  dwell only women, after the  maner  of them, called  Amazones , as he learned of the men of the  Ilandes  which he brought with him into  Spayne  at his  fyrste   viage , and  saued  them from the  fearsenes  of the  Canibales .” Richard Eden, 1553"}, {"deck": "Lecture 3.pptx", "slide": 60, "text": "Amerigo Vespucci Took between 2 and 4 voyages to the Americas, starting in the late 1490s [1497?]. Sailed as a pilot or merchant or [?] in 1499-1500 to explore the large landmass that Columbus had identified.  Sailed in 1501-1502 to explore the large landmass discovered by Cabral. "}, {"deck": "Lecture 3.pptx", "slide": 61, "text": "Amerigo Vespucci Voyages"}, {"deck": "Lecture 3.pptx", "slide": 62, "text": "Waldseemüller map of 1507"}, {"deck": "Lecture 3.pptx", "slide": 63, "text": "From the New World... Europeans brought back many new foods from the Americas which became a staple in European diets such as corn, potatoes, pumpkins, squash, pineapples, cacao beans (for chocolate) and sweet potatoes They also brought tobacco and animals such as turkeys"}, {"deck": "Lecture 3.pptx", "slide": 64, "text": "To the New World... To the Americas, Europeans brought gunpowder, horses, wheat, livestock (such as cattle , sheep and pigs) From Africa to the Americas, Europeans brought the onion, citrus fruits, bananas, coffee, beans, olives, grapes, rice and sugar cane Unwittingly they brought other items from Europe such as dandelions, rats and diseases"}, {"deck": "Lecture 3.pptx", "slide": 65, "text": "Epidemiological Exchanges Measles, Typhoid, Influenza and Smallpox were brought to the Americas With no Immunity these epidemics were DEVASTATING! One of the largest Epidemics in North American History Occurred in 1519 Estimates of depopulation in the Americas due to disease run as high as 80 to 90% Possibly syphilis was brought to the Old World- Hotly Debated"}, {"deck": "Lecture 3.pptx", "slide": 66, "text": "The Columbus Debate How should we characterize Christopher Columbus? Is a hero? A villain? A genius? A fool? Does he demonstrate admirable characteristics? What are they? How should we remember him and his journeys?  What lessons should we draw from his story?"}, {"deck": "Lecture 4.pptx", "slide": 1, "text": "Conquests and Reconquests: The Iberian Peninsula, the Reconquista and the Spanish Invasion of the Americas"}, {"deck": "Lecture 4.pptx", "slide": 2, "text": "Conquistadores"}, {"deck": "Lecture 4.pptx", "slide": 3, "text": "The Iberian Peninsula: Birthplace of the Conquistadores"}, {"deck": "Lecture 4.pptx", "slide": 4, "text": "Reconquest of the Iberian Peninsula"}, {"deck": "Lecture 4.pptx", "slide": 5, "text": "Conquistadores Conquistadores were generally of low social status: impoverished noblemen Many of them came from Andalusia and Extremadura (provinces of Spain), and they had begun their careers as sailors and usually as soldiers of fortune in armies fighting the Muslims. They were raised on mythological stories of fabulous monsters and wealthy kingdoms in far off lands and the increasingly popular genre of chivalric romances They sought to elevate their status and gain honour and respect in the New World"}, {"deck": "Lecture 4.pptx", "slide": 6, "text": "Andalusia and Extremadura"}, {"deck": "Lecture 4.pptx", "slide": 7, "text": "Chivalric Romances Chief works in this genre include  Palmerin  de  Oliva   and  Amadis  de  Gaula a hero, ignorant at first of his noble origins, succeeds in re-establishing his prerogatives thanks to his valour and his ultra-heroic deeds—killing barbarian hordes, Muslims and fabulous beasts as part of his quest Hero often travelled to far off and unknown lands- these lands were commonly a heretofore undiscovered island In  Amadis  de  Gaula   the hero travels to the island of California to battle monsters and gain his honour and glory"}, {"deck": "Lecture 4.pptx", "slide": 8, "text": "Map of North America, 1745"}, {"deck": "Lecture 4.pptx", "slide": 9, "text": "Conquistadors in the Canary islands"}, {"deck": "Lecture 4.pptx", "slide": 10, "text": "The Canary Islands and the Azores and Madeira were rediscovered in the early to mid 14 th  century"}, {"deck": "Lecture 4.pptx", "slide": 11, "text": "1402-1496 Conquistadors from Castille conquered the Canary Islands and begin to eradicate the native Guanche (about 100,000 lived there) In 1448 the island was sold to the Portuguese, but both the Castilians and the natives revolted In 1459 the Portuguese were expelled from the island after having shipped many of the native Guanche to the Madeira islands as slaves to grow sugar The Spanish continued to fight the survivors until 1496"}, {"deck": "Lecture 4.pptx", "slide": 14, "text": "Early North American Voyages Begin 1497: 5 years after Christopher Columbus sailed, John Cabot (Giovanni Caboto) went to the New World Commissioned by King Henry VII of England Believed he was on the Northeast coast of the Asian mainland 1498: Cabot sails again: We don’t know for sure what happened…"}, {"deck": "Lecture 4.pptx", "slide": 15, "text": "Juan Ponce de León (1474-1521)"}, {"deck": "Lecture 4.pptx", "slide": 16, "text": "Ponce de León Had served in the Reconquista  Traveled with Columbus on his second voyage First governor of Puerto Rico in 1508- Grew very wealthy Was replaced by Columbus’ son Diego in 1511 Ponce de León discovered Florida in 1513. First conquistador to set foot on what would become the United States"}, {"deck": "Lecture 4.pptx", "slide": 17, "text": "Ponce de León’s Route"}, {"deck": "Lecture 4.pptx", "slide": 18, "text": "Reinstated as governor of Puerto Rico in 1514 Returns to Florida to try to settle the region in 1521- first attempted settlement in what became the United States! Natives fiercely resisted the Spanish settlement. It failed. Ponce de Leon died from wounds suffered in the contest. "}, {"deck": "Lecture 4.pptx", "slide": 19, "text": "Hernán Cortés (1485-1547)  Born to lesser nobility, little more than a commoner Studied Law and Latin at the University of Salamanca Never trained as a soldier"}, {"deck": "Lecture 4.pptx", "slide": 20, "text": "Hernán Cortés (1485-1547) Went to Santo Domingo, the new capital of Hispaniola, in 1504 Gained the governor’s favour 1518- granted a charter by the governor of Hispaniola to invade Mexico 1519- the governor revoked the Charter but Cortés went anyway in open mutiny Arrived in Mexico with 500 men, 13 horses and a few small cannons in 1519 Burns his ships when he arrives"}, {"deck": "Lecture 4.pptx", "slide": 21, "text": "Doña Marina or Malintze"}, {"deck": "Lecture 4.pptx", "slide": 22, "text": "Invasion of Mexico"}, {"deck": "Lecture 4.pptx", "slide": 23, "text": "Hernán Cortés (1485-1547) While battling the Aztecs he was forced to counter an expedition with almost twice as many men sent by the governor of Hispaniola to stop him- convinces many of those men to join him"}, {"deck": "Lecture 4.pptx", "slide": 24, "text": "Conquered the Aztecs and their emperor Moctezuma with the help of thousands of native enemies of the Aztecs in 1521 Renamed Tenochtitlan Mexico City and governed Mexico from 1521 to 1524 “I and my companions suffer from a disease of the heart which can be cured only with gold.” ~ Hernán Cortés"}, {"deck": "Lecture 4.pptx", "slide": 25, "text": "Hernán Cortés (1485-1547) 1528- Returned to Spain and was granted titles 1530- He returned to Mexico and was accused of murdering his wife but was found innocent 1536- Explores northwest Mexico and discovers the Gulf of California Returned to Spain in 1541 and was no longer received as a hero- People accused him of abusing power and wasting money Lost most of his money funding expeditions Died on his way back to Mexico"}, {"deck": "Lecture 4.pptx", "slide": 26, "text": "Francisco  Pizzaro  (1471-1541)"}, {"deck": "Lecture 4.pptx", "slide": 27, "text": "Francisco Pizzaro (1471-1541) Second Cousin to Hernán Cortés Sailed with 2500 colonists to become governor of Hispaniola in 1502 Crossed the Isthmus of Panama in 1513 with Balboa and saw the Pacific Ocean Mayor of Panama City from 1519 to 1523 1524- Tried to conquer Peru and failed due to bad weather, starvation and skirmishes with hostile natives-made it to Columbia"}, {"deck": "Lecture 4.pptx", "slide": 28, "text": "Francisco Pizzaro  1526- Tried again to conquer Peru and made it further inland but found natives in Ecuador to be too hostile and defiant 1532- made a third attempt and established a settlement in Peru, San Miguel de Piura where they were invited by the Incas to meet He had 102 men and 62 horses with him. There were 3 to 5 million in the Incan empire. His younger brother  Gonzallo  Pizzaro was with him."}, {"deck": "Lecture 4.pptx", "slide": 29, "text": "Pizzaro’s  Gambit"}, {"deck": "Lecture 4.pptx", "slide": 32, "text": "Incan Traditions Atahualpa watched the Spanish in his midst and decided that they were not Gods He said he would kill all but three: 1. The horse breaker 2. The blacksmith  3. The barber"}, {"deck": "Lecture 4.pptx", "slide": 33, "text": "Battle of Cajamarca"}, {"deck": "Lecture 4.pptx", "slide": 34, "text": "Francisco Pizzaro and Atahualpa (1471-1541) 1532- attacked the Incan army and captured their leader, Atahualpa.  Atahualpa offers a room full of gold Atahualpa is tried for treason and executed"}, {"deck": "Lecture 4.pptx", "slide": 35, "text": "Francisco Pizzaro (1471-1541) Pizarro Put a puppet King in place- Manko (Atahualpa’s half brother) 1534- Invaded Cuzco and destroyed most of the remaining Incan army Established Lima on the coast of Peru in 1535- key to the Spanish silver trade Assassinated in 1541 by the supporters of another conquistador Diego Almagro II. Diego was the son of one of the conquistadors who had traveled with Francisco Pizzaro"}, {"deck": "Lecture 4.pptx", "slide": 36, "text": "Incan Civil War: Key to Victory? The Incas had been embroiled in a Civil War.  The first major smallpox epidemic in the Incan empire claimed the life of the powerful Inca Emperor, Huayna Capac, and his heir apparent before Pizarro arrived Two of the emperor's sons laid claim to the throne:  Huáscar  was selected by the court elite to rule from Cuzco, the traditional Inca capital, and Atahualpa had control of his father's professional army and the newly conquered regions of Ecuador and Columbia"}, {"deck": "Lecture 4.pptx", "slide": 37, "text": "Incan Civil War Early in 1532, Atahualpa's army defeated Huáscar's army and captured and executed its leader.  The conquistadores arrived at that moment and executed Atahualpa and placed the half-brother of Huáscar back on the throne as a puppet government. Pizzaro took his wife captive."}, {"deck": "Lecture 4.pptx", "slide": 38, "text": "Ceremonies of Possession"}, {"deck": "Lecture 4.pptx", "slide": 39, "text": " REQUERIMIENTO What strikes you about this document?  Why was it being used?  How do the Spanish justify their right to conquer the land? What do you imagine was the response of the Indigenous people who heard this? "}, {"deck": "Lecture 4.pptx", "slide": 40, "text": "Pánfilo  de  Narváez  (1478-1528)"}, {"deck": "Lecture 4.pptx", "slide": 41, "text": "Pánfilo  de  Narváez  (1478-1528) Helped to conquer Jamaica in 1509 and Cuba in 1512 Sent by the governor of Hispaniola to Mexico in 1520 with 1,100 men to defeat the rebellious  Hernán  Cortés and failed.  1527- Named Governor of Florida and sailed there in 1527 with 600 men to explore and conquer- lost almost 200 men along the way to hunger, disease and storms"}, {"deck": "Lecture 4.pptx", "slide": 42, "text": "Pánfilo  de  Narváez  (1478-1528) 1528- Lands in Florida and marches inland with 300 men while his ships were supposed to sail up the coast and meet him- Meets Hostile native Travels back to meet his ships but they had been destroyed in a storm Began an overland trek to Mexico in 1528 with 80 survivors- tried to walk back! 4 of the 80, including one African slave, survived when they finally made it back to a Spanish settlement in 1535. Cabeza  de  Vaca  published a narrative of this journey in which he mentions hearing stories from the natives about El Dorado"}, {"deck": "Lecture 4.pptx", "slide": 43, "text": "Narváez Expedition (1528-1535)"}, {"deck": "Lecture 4.pptx", "slide": 44, "text": "Hernando de Soto (1500-1542)"}, {"deck": "Lecture 4.pptx", "slide": 45, "text": "The Early Life of Hernando De Soto (1500-1542) 1514: De Soto left home on a voyage to the Indies. Just 14 years old.  1519: De Soto joins another exploration of discovery to Panama in South America where he makes his mark as a Captain of the Horse 1524: De Soto went on an expedition to Nicaragua, South America, with Francisco de Cordoba 1525: De Soto profits off the slave trade in Nicaragua 1531 January: De Soto sailed with Francisco Pizarro from the port of Panama with 3 ships and over 200 men on an expedition to Peru 1532 November 15: Pizarro reaches Cajamarca and captures  Atahuallpa , the emperor of the Incas. Thousands of Incas were killed. The fabulous treasure of the Incas was stolen."}, {"deck": "Lecture 4.pptx", "slide": 46, "text": "The Early Life of Hernando de Soto 1536: De Soto returned to Spain, reporting to the King on the explorations of Pizarro. De Soto brought back his share of the Incas gold - he was a fabulously rich man and set up a household in Seville 1537: De Soto married Ines de Bobadilla 1537: De Soto was named  Adelantado  of Florida and Governor of Cuba by Charles V and granted the rights to conquer Florida"}, {"deck": "Lecture 4.pptx", "slide": 47, "text": "The Final Expedition of Hernando de Soto (1500-1542) 1537/38: Hernando De Soto gathered together 950 armed soldiers, priests and 10 ships 1538 April 6: The Hernando De Soto expedition left  Sanlucar , Spain for the Americas 1538: The expedition landed at Santiago de Cuba 1538/39 De Soto had been given the title Governor of Cuba. He spent some months in Cuba preparing for the voyage to Florida"}, {"deck": "Lecture 4.pptx", "slide": 48, "text": "1539: May 30 Hernando De Soto arrived on the west coast of Florida with 1000 men (at least 700 of them were experienced soldiers) 1538/42: Hernando De Soto explored the area and searched for gold and silver.  1542: Hernando De Soto died of a fever on May 21, 1542. He was buried on the banks of the Mississippi River"}, {"deck": "Lecture 4.pptx", "slide": 49, "text": "Two Questions “Who is the biggest and wealthiest prince in your land and where is he?” “Where can I find this? [pointing to silver and gold]” Captured chiefs wherever they went as ransom Started killing entire villages"}, {"deck": "Lecture 4.pptx", "slide": 50, "text": "De Soto’s expedition recorded 75 villages The next time that an explorer traveled through the same region in 1682 they recorded 5 villages!"}, {"deck": "Lecture 4.pptx", "slide": 51, "text": "Francisco Vázquez de Coronado (1510-1544)"}, {"deck": "Lecture 4.pptx", "slide": 52, "text": "Searched for riches that he never found First to discover the Grand Canyon Was searching for the fabled cities of Cibola and El Dorado"}, {"deck": "Lecture 4.pptx", "slide": 53, "text": "Coronado’s Expedition"}, {"deck": "Lecture 4.pptx", "slide": 54, "text": "Coronado was financially ruined by the expedition, which was a failure Covered more distance by land than any other explorer in the New World"}, {"deck": "Lecture 4.pptx", "slide": 55, "text": "First Settlements Tristán de Luna establishes a settlement in Pensacola in 1559 (fails) The Spanish established a settlement at  Charlesfort  on Paris Island in 1562 (fails) The French established Fort Caroline in 1564 (fails) The Spanish established a settlement in St. Augustine in Florida in 1565- Survives! The Spanish establish a settlement in Santa Elena  in 1566- (fails)"}, {"deck": "Lecture 4.pptx", "slide": 56, "text": "Juan de Oñate (1550-1626) Established a settlement in New Mexico in 1598"}, {"deck": "Lecture 4.pptx", "slide": 57, "text": "Juan de Onate Route"}, {"deck": "Lecture 4.pptx", "slide": 58, "text": "Curbing the Conquistadores In 1556, the Spanish crown, in response to the growing Black Legend, tried to put an end to Conquistadores, insisting that the men call themselves discoverers or colonists"}, {"deck": "Lecture 4.pptx", "slide": 59, "text": "Questions What common themes do you see in the history of the Conquistadors and the first European explorers in the Americas? Why did they keep attempting conquests even after growing rich? What drove these men? How would you summarize their character? Their goals? Their view of the New World? How should we remember the Conquistadors? What lessons do we learn from their encounters with the New World?"}, {"deck": "Lecture 5.pptx", "slide": 1, "text": "The Lost Colonies: Roanoke and the Many Failures of Early Colonization and Exploration Projects"}, {"deck": "Lecture 5.pptx", "slide": 5, "text": "What is Nature? What do we mean when we use words such as “nature” or “wilderness”?"}, {"deck": "Lecture 5.pptx", "slide": 6, "text": "How do early modern Europeans conceptualize Nature?"}, {"deck": "Lecture 5.pptx", "slide": 7, "text": "Little Ice Age 16 th  to 19 th  centuries May have begun as early as 1250 1315- Great Famine 1550- Worldwide Glacial expansion 1650- peak of the Little Ice Age"}, {"deck": "Lecture 5.pptx", "slide": 9, "text": "European Settlement and the Little Ice Age Settlement in North America may have been more difficult during this period The famines in Jamestown (the first permanent English settlement) were connected to severe frosts"}, {"deck": "Lecture 5.pptx", "slide": 10, "text": "Severe Winters \"The cold began on January 6, 1709, and lasted in all its rigor until the twenty-fourth. The crops that had been sewn were all completely destroyed.... Most of the hens had died of cold, as had the beasts in the stables. When any poultry did survive the cold, their combs were seen to freeze and fall off. Many birds, ducks,  partidges , woodcock, and blackbirds died and were found on the roads and on the thick ice and frequent snow. Oaks, ashes, and other valley trees split with cold. Two thirds of the vines died.... No grape harvest was gathered at all in Anjou.... I myself did not get enough wine from my vineyard to fill a nutshell.\""}, {"deck": "Lecture 5.pptx", "slide": 11, "text": "The Rise of American Agriculture and American Trade Coffee, tea, chocolate, sugar and tobacco began to be consumed in Europe in the late 1500s and early 1600s.  The French ambassador at Lisbon, Jean  Nicot  (1530-1600) introduced tobacco to France. It was originally in the form of snuff Coffee Houses began to appear throughout Europe in the 1610s and 1620s, devoted to selling the new good Sultan  Murad  IV of the Ottoman Empire banned coffee and tobacco in the 1630s"}, {"deck": "Lecture 5.pptx", "slide": 13, "text": "Map of New France, 1600"}, {"deck": "Lecture 5.pptx", "slide": 14, "text": "Hypothesized Route through Northwest Passage, 1670"}, {"deck": "Lecture 5.pptx", "slide": 15, "text": "Map of 1670 showing the Strait of  Anian"}, {"deck": "Lecture 5.pptx", "slide": 16, "text": "Attempted New World Colonies 1559: Spanish  establishes a settlement in Pensacola-  fails 1562: Spanish establish a settlement at  Charlesfort  on Paris Island in La Florida-  fails 1564; French establish settlement in Fort Caroline-  fails 1565- Spanish establish St. Augustine in Florida- a Success! 1566- Spanish settle Santa Elena in Florida 1566-  fails 1578: English  Meta  Icognita   in Frobisher Bay-  fails"}, {"deck": "Lecture 5.pptx", "slide": 17, "text": "Attempted New World Colonies 1579: Englishman Sir Francis Drake settles Nova Albion in California [?]-  fails 1583- Englishman Sir Humphrey Gilbert claims Newfoundland-  fails 1585: English attempt first Roanoke colony in North Carolina-  fails 1587: English attempt second Roanoke colony in North Carolina-  fails 1595: Englishman Sir Walter Raleigh tries to find El Dorado in Surinam-  fails 1598: French settle a fort on Sable Island near Nova Scotia-  fails 1600: French colony in Tadoussac in Quebec-  fails"}, {"deck": "Lecture 5.pptx", "slide": 18, "text": "Attempted New World Colonies 1604: French Île-Saint-Croix in the Bay of Fundy near Nova Scotia-  fails 1605: French Port Royal in Nova Scotia-  fails  1607: English Jamestown in Virginia- Success! 1607: English Sagadahoc in Maine-  fails 1610: English Cupids Colony in Newfoundland- Success! 1608: French found Quebec City under Samuel de Champlain- A success!"}, {"deck": "Lecture 5.pptx", "slide": 19, "text": "Attempted New World Colonies 1617: Raleigh tries AGAIN to find El Dorado in Surinam-  fails 1624: Dutch settle New Netherland- success 1638- Swedish settle New
