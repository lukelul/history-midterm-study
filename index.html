function recall(){let list=pool();index=Math.min(index,Math.max(0,list.length-1));if(!list.length)return `<h2>No weak cards in this selection</h2><p>Try all cards later with notes closed to check retention.</p><button id="all-cards">Show all cards</button>`;let c=list[index];return `<div class="row between"><div class="row"><select id="topic" aria-label="Topic">${['All topics',...DATA.topics].map(t=>`<option ${t===topic?'selected':''}>${esc(t)}</option>`).join('')}</select><select id="filter" aria-label="Practice filter">${['All cards','Weak / unseen'].map(t=>`<option ${t===filter?'selected':''}>${t}</option>`).join('')}</select></div><span class="small">${index+1} of ${list.length} · ${state.ratings[c.id]?.attempts||0} attempts</span></div><div class="bar"><span style="width:${(index+1)/list.length*100}%"></span></div><div class="split"><section class="panel"><span class="badge">${esc(c.topic)}</span><h2>${esc(c.q)}</h2><label for="response">Your answer, before looking</label><textarea id="response" placeholder="Explain it. Include a specific example and why it matters.">${esc(state.drafts['card'+c.id]||'')}</textarea>${!reveal?'<button class="primary" id="reveal" style="margin-top:15px">Compare with explanation</button>':`<div class="answer"><h3>What a strong answer should cover</h3><p>${esc(c.a)}</p><p class="small">Generated study explanation, not an official answer key. Compare with the original passages below.</p></div><div class="row"><button data-rate="0">Missed / need to relearn</button><button data-rate="1">Partial / needed a cue</button><button class="primary" data-rate="2">Strong / recalled independently</button></div>`}<div class="row between" style="margin-top:24px"><button id="prev" ${index===0?'disabled':''}>Previous</button><button id="next">Skip / next</button></div></section><aside><h3>How to grade yourself</h3><p><b>Strong:</b> correct central point, historical context, a specific example, and significance—all before revealing.</p><p><b>Partial:</b> recognizable topic but missing evidence or explanation.</p><p><b>Missed:</b> wrong, blank, or you only recognized it after seeing the answer.</p><h3>Original slide text</h3>${c.refs.map(source).join('')}<p class="small">Maps, images, and screenshots are not transcribed here. Open the original deck in the Lecture Slides folder to inspect visual evidence.</p></aside></div>`}
function quiz(){let m=mc[quizIndex],ans=state.quiz[quizIndex],done=Object.keys(state.quiz).length,correct=Object.entries(state.quiz).filter(([i,a])=>mc[+i]&&a===mc[+i][2]).length;return `<div class="row between"><span class="badge">Generated practice · not actual exam questions</span><span>${correct} correct / ${done} answered</span></div><section class="panel" style="margin-top:20px"><div class="small">Question ${quizIndex+1} of ${mc.length}</div><h2>${esc(m[0])}</h2>${m[1].map((v,i)=>`<button class="choice ${ans===i?'selected':''}" data-choice="${i}" ${ans!==undefined?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(v)}</button>`).join('')}${ans!==undefined?`<div class="notice">${ans===m[2]?'Correct.':'Review this one.'} ${esc(m[1][m[2]])}<br><span class="small">Source: ${esc(m[3])}. Explain why the other options fail.</span></div>`:''}<div class="row between"><button id="qprev" ${quizIndex===0?'disabled':''}>Previous</button><button id="qnext">${quizIndex===mc.length-1?'Back to first':'Next question'}</button></div></section><p class="small">Recognition is easier than recall. A high quiz score does not replace written IDs, essays, readings, or primary-source work.</p><button id="reset-quiz">Restart quiz</button>`}
function writing(){let e=exams[essayIndex];return `<div class="row between"><select id="essay" aria-label="Writing prompt">${exams.map((x,i)=>`<option value="${i}" ${i===essayIndex?'selected':''}>${esc(x[0])}</option>`).join('')}</select><div class="row"><span id="timer" class="timer">${fmt(seconds)}</span><button id="timer-start">${clock?'Pause':'Start 25-minute practice'}</button><button id="timer-reset">Reset timer</button></div></div><div class="split" style="margin-top:20px"><section><div class="small">${esc(e[2])}</div><h2>${esc(e[1])}</h2><p class="quiet">${esc(e[3])}</p><label>Your outline or essay</label><textarea id="essay-draft" style="min-height:350px" placeholder="Write your own thesis, evidence, and reasoning. For the most realistic rehearsal, write by hand in a blue book.">${esc(state.drafts['essay'+essayIndex]||'')}</textarea><div class="small" id="words"></div><p class="small">25 minutes is a suggested practice interval, not an instructor-issued allocation. The full class period is 90 minutes; section weights and exact timing have not been supplied.</p></section><aside class="panel"><h3>Self-review after writing</h3>${['I answered every part of the prompt.','I made a clear, defensible claim.','I used at least three specific examples from course material.','I explained how the evidence supports the claim.','I established context and sequence; I explained change where relevant.','I distinguished uncertainty from established evidence.','I included relevant assigned-reading or primary-source evidence.','I checked names, dates, and claims against the originals.'].map((s,i)=>`<label class="check"><input type="checkbox" data-check="essay${essayIndex}-${i}" ${state.checks['essay'+essayIndex+'-'+i]?'checked':''}><span>${s}</span></label>`).join('')}<p class="small">Suggested self-review, not the instructor’s grading rubric. There is no automated essay grade.</p><h3>ID rehearsal</h3><p>Choose one: Salem Witch Hunts, Roanoke Colony, Puritan Diaspora, Little Ice Age, William Byrd, or Jamestown Colony.</p><p>Write 3–5 sentences: identify it, place it in historical context, explain its significance. Then check the relevant notes.</p><p class="small">Professor’s ID list: Lecture 13, slide 4. Length is a practice suggestion.</p></aside></div>`}
function fmt(n){return Math.floor(n/60).toString().padStart(2,'0')+':'+(n%60).toString().padStart(2,'0')}
function sources(){return `<h2>What you still need to cover</h2><p>The downloaded notes and slides do not replace assigned readings. This tool contains no full-book answer key and no Tuesday, October 13 lecture material that has not yet been posted.</p>${['A Land So Strange, pp. 1–226: supply your own detailed expedition examples.','The Salem Witch Hunt: full assigned book, documents, and your own source analysis.','Manifest Destiny, pp. 1–121: assigned through Week 8; confirm the reading cutoff.','Requerimiento; Servants and Slaves in Virginia, 1705; Axtell; Breen; Usner; Puritan Childhood; additional handouts.','Tuesday, Oct. 13 lecture: French North America, Louisiana, the Mississippi Company, and Acadian diaspora.','Verify any conflict between sample TA notes, slides, and readings with the instructor or TA.'].map((x,i)=>`<label class="check"><input type="checkbox" data-check="gap${i}" ${state.checks['gap'+i]?'checked':''}><span>${esc(x)}</span></label>`).join('')}<div class="notice">The notes contain rough transcriptions. For example, the Week 6 notes say “abolish slavery” in 1808, while Lecture 11, slide 39 discusses abolition of the slave trade. Use original source wording and ask about discrepancies. Search below covers editable slide text; it does not read embedded figures or screenshots.</div><h3>Search the original slide text</h3><input id="source-search" style="width:100%" placeholder="Try Anthony Johnson, Roanoke, spectral, exam…" value="${esc(sourceQuery)}"><div id="source-results"></div>`}
function searchSources(){let q=sourceQuery.toLowerCase().trim();let results=DATA.slides.filter(s=>!q||s.text.toLowerCase().includes(q)||s.deck.toLowerCase().includes(q));document.getElementById('source-results').innerHTML=`<p class="small">${results.length} matching slides · ${q?'first 60 displayed':'showing professor exam-prep slides; enter a search for more'}</p>`+(q?results.slice(0,60):DATA.professor).map(source).join('')}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(b.id==='weak-home')filter='Weak / unseen';go(b.dataset.go)});document.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{state.checks[c.dataset.check]=c.checked;persist()});let el=(id,fn)=>{let e=document.getElementById(id);if(e)fn(e)};
el('topic',e=>e.onchange=()=>{topic=e.value;index=0;reveal=false;render()});el('filter',e=>e.onchange=()=>{filter=e.value;index=0;reveal=false;render()});el('all-cards',e=>e.onclick=()=>{filter='All cards';render()});el('response',e=>e.oninput=()=>{state.drafts['card'+pool()[index].id]=e.value;persist()});el('reveal',e=>e.onclick=()=>{reveal=true;render()});el('prev',e=>e.onclick=()=>{index--;reveal=false;render()});el('next',e=>e.onclick=()=>{index=(index+1)%pool().length;reveal=false;render()});document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{let c=pool()[index],old=state.ratings[c.id]||{},r=+b.dataset.rate;state.ratings[c.id]={attempts:(old.attempts||0)+1,streak:r===2?(old.streak||0)+1:0,last:r,at:new Date().toISOString()};persist();if(filter==='All cards')index=(index+1)%pool().length;reveal=false;render()});
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.quiz[quizIndex]=+b.dataset.choice;persist();render()});el('qprev',e=>e.onclick=()=>{quizIndex--;render()});el('qnext',e=>e.onclick=()=>{quizIndex=(quizIndex+1)%mc.length;render()});el('reset-quiz',e=>e.onclick=()=>{state.quiz={};quizIndex=0;persist();render()});
el('essay',e=>e.onchange=()=>{essayIndex=+e.value;render()});el('essay-draft',e=>{const update=()=>{state.drafts['essay'+essayIndex]=e.value;persist();document.getElementById('words').textContent=e.value.trim()?e.value.trim().split(/\s+/).length+' words · saved in this browser':'Draft saved in this browser'};e.oninput=update;document.getElementById('words').textContent=e.value.trim()?e.value.trim().split(/\s+/).length+' words':''});el('timer-start',e=>e.onclick=()=>{if(clock){clearInterval(clock);clock=null}else{if(seconds===0)seconds=1500;clock=setInterval(()=>{seconds=Math.max(0,seconds-1);let t=document.getElementById('timer');if(t)t.textContent=fmt(seconds);if(seconds===0){clearInterval(clock);clock=null;render()}},1000)}render()});el('timer-reset',e=>e.onclick=()=>{clearInterval(clock);clock=null;seconds=0;render()});el('source-search',e=>e.oninput=()=>{sourceQuery=e.value;searchSources()});if(view==='sources')searchSources();
el('export',e=>e.onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='his315k-study-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});el('restore',e=>e.onchange=async()=>{try{let p=JSON.parse(await e.files[0].text());if(!p.ratings||!p.drafts||!p.quiz||!p.checks)throw Error();state=p;persist();render()}catch{alert('Choose a progress file exported by this tool.')}})}
let unitIndex=0,learnMode='Read',hideLesson=false;
const methods=[
['Organize and connect','University-hosted guidance describes summaries and concept organizers that condense material and show relationships. This guide uses connected topic explanations, sequences, and comparisons. Creating your own summary remains part of the learning.','UC Santa Cruz · Making and Using Study Guides','https://oakes.ucsc.edu/advising/howtoguides/03studyguides.pdf'],
['Retrieve, then correct','Washington University’s teaching center recommends bringing learned material to mind and using feedback to correct errors. Each unit therefore leads into written recall and shows the underlying source passages.','Washington University · Retrieval practice','https://ctl.wustl.edu/resources/using-retrieval-practice-to-increase-student-learning/'],
['Return later','The Learning Scientists describe spaced practice and retrieval among evidence-supported learning strategies. The guide keeps a record of practice and asks you to return on another day; a second immediate attempt is not proof of durable learning.','The Learning Scientists · Six strategies','https://www.learningscientists.org/blog/2016/8/18-1'],
['Argue from evidence','Iowa’s History Writing Center explains that an essay exam calls for an organized argument supported by concrete, relevant evidence. The essay workspace asks you to connect a claim, examples, and reasoning.','University of Iowa · Taking history exams','https://history.uiowa.edu/undergraduate/history-writing-center/exams']
];
function learn(){const u=DATA.units[unitIndex];return `<div class="learning-shell"><aside class="unit-rail"><div class="small">Your course, in eight sections</div>${DATA.units.map((x,i)=>`<button class="unit-link ${i===unitIndex?'active':''}" data-unit="${i}"><span class="unit-num">${i+1}</span><span>${esc(x.title)}${state.checks['read'+i]?'<small>Read once</small>':''}</span></button>`).join('')}<div class="rail-end"><p class="small">Through Oct. 8 lectures. Add Tuesday’s material and your reading evidence.</p><button data-go="sources">Check coverage gaps</button></div></aside><section class="lesson"><div class="row between"><div class="small">Section ${unitIndex+1} / 8</div><span class="small">${esc(u.topic)}</span></div><h2 class="lesson-title">${esc(u.title)}</h2><p class="lesson-question">${esc(u.question)}</p><div class="row modes">${['Read','Sequence','Compare','ID examples','Why this structure'].map(m=>`<button data-mode="${m}" aria-current="${learnMode===m}">${m}</button>`).join('')}</div>${learnMode==='Read'?readLesson(u):learnMode==='Sequence'?sequence(u):learnMode==='Compare'?compare():learnMode==='ID examples'?ids():methodology()}<div class="lesson-footer row between"><button id="unit-prev" ${unitIndex===0?'disabled':''}>Previous section</button><button id="unit-next">${unitIndex===7?'Back to section 1':'Next section'}</button></div></section></div>`}
function readLesson(u){return `<div class="read-layout"><article><div class="row between"><h3>The explanation</h3><button id="hide-lesson">${hideLesson?'Show explanation':'Hide and explain it yourself'}</button></div>${hideLesson?`<p>Without looking, explain what happened, why it happened, and why it matters. Then show the explanation and correct your account.</p>`:u.story.map(p=>`<p class="lesson-prose">${esc(p)}</p>`).join('')}<div class="cause-chain"><h3>Causes</h3><p>${esc(u.causes)}</p><h3>Consequences and significance</h3><p>${esc(u.result)}</p></div><h3>A mistake to avoid</h3><p>${esc(u.pitfall)}</p><h3>Your evidence from the readings</h3><p class="small">Add a specific episode, document, or passage from the assigned reading. This guide has not analyzed the full books.</p><textarea id="unit-notes" placeholder="Example or document → what it shows → how it supports an argument">${esc(state.drafts['unit'+unitIndex]||'')}</textarea><div class="row" style="margin-top:18px"><button class="primary" id="unit-practice">Practice recall for this topic</button><label class="check"><input type="checkbox" data-check="read${unitIndex}" ${state.checks['read'+unitIndex]?'checked':''}>I have read this section</label></div><p class="small">“Read” records a first pass, not mastery. Reconstruct the explanation from memory, check errors, and return later.</p></article><aside class="key-column"><h3>People and concepts</h3>${u.terms.map(([t,d])=>`<div class="term"><b>${esc(t)}</b><p>${esc(d)}</p></div>`).join('')}<h3>Check the original evidence</h3><p class="small">Teaching summary based on course slides and sample notes. These source passages let you inspect what was actually supplied. Visual-only slides still need the original deck.</p>${u.sourceSlides.map(source).join('')}</aside></div>`}
function sequence(u){return `<h3>Put the events in relation</h3><p>Read the sequence, then hide the dates and explain how each event leads into the next. Knowing order is useful; this is not the separate November chronology quiz.</p><ol class="timeline">${u.sequence.map(([date,what])=>`<li><b>${esc(date)}</b><span>${esc(what)}</span></li>`).join('')}</ol><h3>The connecting question</h3><p>${esc(u.question)}</p><textarea id="sequence-notes" placeholder="Write the sequence and explain at least two causal connections.">${esc(state.drafts['sequence'+unitIndex]||'')}</textarea>`}
const comparisons=[
['Colonial survival',['Dimension','Meta Incognita / Frobisher','Roanoke','Jamestown'],[
['Main goals','Northwest Passage; supposed valuable ore; Arctic settlement','English settlement, wealth, and strategic position','Virginia Company investment and profit; later tobacco'],
['Major constraints','Arctic environment, difficult logistics, worthless ore','Supplies, local relations, delayed relief','Food shortages, mortality, conflict, dependence on resupply'],
['Outcome','Voyages and settlement project failed','Settlement attempts failed; later fate disputed','Nearly failed; sustained settlement and tobacco expansion'],
['Analytical use','Wrong expectations and finance compound environmental difficulty','War and supply links connect a small colony to Atlantic events','Survival depended on contingent changes, not inevitable English superiority']]],
['Religious migration',['Dimension','Pilgrims','Winthrop’s Puritans'],[
['Relation to Church of England','Separatists seeking to leave it','Reformers seeking to purify it'],['Community aim','Covenanted community with religious discipline','Model godly society with religious discipline'],['Do not assume','Separation automatically meant modern religious tolerance','Reform automatically meant democracy or pluralism']]],
['Unfree labor',['Dimension','Indentured servitude','Hereditary slavery'],[
['Duration','A term of service; subject to contractual and legal constraints','Usually lifelong'],['Children’s status','Not the same institution of inherited slave status','Virginia’s 1662 rule follows the mother'],['Law and remedies','Some rights and routes to redress existed','Rights and testimony severely restricted'],['Analytical use','Coercion existed beyond slavery','Permanent and inherited status intensified domination']]],
['Resistance',['Case','Imperial setting','Pressures and political relationships','Outcome to distinguish'],[
['Powhatan resistance','English Virginia','Land and tobacco expansion, coercion, food demands','Major attacks and English reprisals; company charter revoked'],['Pequot War','English New England','English–Narragansett–Mohegan coalition against Pequots','Mystic massacre and enslavement of survivors'],['King Philip’s War','English New England','Expansion and control; Metacomet’s resistance','Broad destructive war; coalition did not expel English rule'],['Pueblo Revolt','Spanish New Mexico','Religion, tribute, forced labor, land, drought','Expulsion in 1680; partial reconquest in 1692']]]
];
function compare(){return `<h3>Compare using the same questions</h3><p>Read across a row. Practice explaining a difference and what caused it; a comparison essay needs more than a list of similarities.</p>${comparisons.map(([title,heads,rows])=>`<h3>${esc(title)}</h3><div class="table-scroll"><table><thead><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`).join('')}<p class="small">Generated synthesis from Lectures 5–8, 10, and 11; these are study comparisons, not an official marking scheme.</p>`}
const idExamples=[
['Roanoke Colony','Roanoke refers to late-sixteenth-century English settlement attempts on the North Carolina coast sponsored by Walter Raleigh. The attempts struggled with supplies and local conditions, and John White’s return for help was delayed by war with Spain. The English found the settlement abandoned in 1590; its later fate remains disputed. Roanoke demonstrates the fragility of early colonization and how local survival depended on wider Atlantic connections.','Identification: English settlements. Context: late sixteenth century, North Carolina, Raleigh, supplies and war. Significance: fragile colonies and Atlantic dependence.'],
['Little Ice Age','The Little Ice Age was a prolonged period of cooler conditions that overlapped European expansion into North America. The course connects difficult growing conditions and severe winters to hunger and colonial vulnerability. It helps explain why supplies, agriculture, and relations with Indigenous communities mattered to survival. Climate contributed to outcomes alongside human decisions rather than determining every colony’s fate.','Identification: climate period. Context: overlapping early colonial expansion. Significance: connects environmental conditions to survival and choices.'],
['Puritan Diaspora','The Puritan diaspora was the dispersal of English religious reformers into multiple Atlantic settings in the seventeenth century. New England was one destination, while the course also discusses Caribbean ventures. Comparing those settings shows that a shared religious commitment could interact with different economic opportunities and imperial threats. The diaspora therefore challenges a story in which Puritan migration led inevitably to one New England outcome.','Identification: migration and dispersal. Context: seventeenth-century Atlantic and religious reform. Significance: comparable beliefs, different settings and outcomes.'],
['Salem Witch Hunts','The Salem witch hunts were a wave of accusations and prosecutions in Massachusetts in 1692–1693. Belief in demonic activity interacted with wartime fear, local divisions, and procedures that accepted claims such as spectral evidence. Nineteen accused people were hanged, and Giles Corey was pressed while authorities attempted to force a plea. The crisis reveals how evidence, institutional authority, and social vulnerability could turn suspicion into deadly prosecution.','Identification: accusations and trials. Context: Massachusetts and multiple local conditions. Significance: evidence, authority, and vulnerability.'],
['William Byrd II','William Byrd II was a Virginia planter, diarist, and colonial officeholder whose life linked the colony to English elite culture. His education, ambitions, plantation wealth, and household relationships illuminate how gentility and hierarchy worked in the early eighteenth-century Atlantic world. Comparing his private records with his public standing reveals tensions between refined ideals and unequal power. His significance lies in what his life shows about colonial elite authority.','Identification: planter and diarist. Context: Virginia and English elite networks. Significance: gentility, hierarchy, and source comparison.'],
['Jamestown Colony','Jamestown was an English settlement established in Virginia in 1607 under the Virginia Company. Hunger, mortality, conflict, and dependence on supplies made its survival precarious. Tobacco later helped sustain investment while increasing demands for land and labor. Jamestown illustrates how a colony’s survival could depend on changing economic and political relationships rather than inevitable European success.','Identification: settlement and date. Context: company investment and survival crisis. Significance: contingent survival and expansion.']];
function ids(){return `<h3>Turn a name into a historical explanation</h3><p>Your professor asks you to identify, contextualize, and explain significance. Try one yourself, then expand its example. These are generated examples, not official answers or guaranteed full-credit responses.</p>${idExamples.map(([title,answer,why])=>`<details class="id-example"><summary>${esc(title)}</summary><p class="lesson-prose">${esc(answer)}</p><p class="small">${esc(why)}</p></details>`).join('')}<p>Now write a new version with notes closed. Keep the historical meaning; do not memorize my sentences.</p><button data-go="writing">Open writing practice</button>`}
function methodology(){return `<h3>Why the guide is organized this way</h3><p>There is no single scientifically established best page layout. This structure is my application of the following guidance to your history exam. The education sources guide the learning method; your course materials supply the history.</p>${methods.map(([title,body,label,url])=>`<section class="method"><h3>${esc(title)}</h3><p>${esc(body)}</p><a href="${url}" target="_blank" rel="noopener">${esc(label)}</a></section>`).join('')}<h3>One section, one study cycle</h3><ol><li>Read the explanation and its source evidence.</li><li>Hide it and explain it in your own words.</li><li>Check for missing or incorrect details.</li><li>Add an example from an assigned reading.</li><li>Return later and answer without help.</li></ol><p class="small">This sequence is a design recommendation, not a validated grade prediction. The course’s AI policy still applies.</p>`}
