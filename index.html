Sweden- success"}, {"deck": "Lecture 5.pptx", "slide": 20, "text": "Total Shipping Tonnage in the Spanish  Atlantic to 1650"}, {"deck": "Lecture 5.pptx", "slide": 21, "text": "Surviving Settlements by 1650"}, {"deck": "Lecture 5.pptx", "slide": 22, "text": "New Netherland (1609) and  New Sweden (1638)"}, {"deck": "Lecture 5.pptx", "slide": 24, "text": "Tenuous French Footholds New France was almost wiped out by hostile Iroquois in the 1650s There were virtually no roadways in the region. The French travelled almost exclusively along the waterways. Natives dominated the interior Less than 3,000 total inhabitants by 1665 Fears that the only inhabitants were not culturally French anymore"}, {"deck": "Lecture 5.pptx", "slide": 25, "text": "England’s First New World: England and the Conquest of Ireland"}, {"deck": "Lecture 5.pptx", "slide": 27, "text": "Ireland: The First New World Before 1640, more than 100,000 Englishmen and Scots moved to Ireland to settle the plantations.  Before 1640, more English and Scots moved to Ireland than moved to the Americas"}, {"deck": "Lecture 5.pptx", "slide": 28, "text": "Sir Humphrey Gilbert (1539-1583) Participated in the suppression of Ireland  Writes A Discourse of a  Discoverie  for a New Passage to  Cataia  in 1566- Insists that the Northwest passage exists  1578: Was given a charter by Queen Elizabeth to explore and colonize any territory “unclaimed by Christian Kingdoms” Sails to find Northwest Passage in 1578- colossal failure 1583: Tries again and claims St. John’s Newfoundland as a colony under his control in 1583 St. John’s harbor was already filled with English fishermen! Died at sea returning to England"}, {"deck": "Lecture 5.pptx", "slide": 29, "text": "Gilbert in Ireland  \"The  heddes  of all those (of who sort soever  thei  were) which were killed in the  daie , should be  cutte  off from their bodies and brought to the place where he  incamped  at night, and should there bee  laied  on the ground by  eche  side of the  waie   ledying  into his  owne   tente  so that none could come into his  tente  for any cause but commonly he  muste  passe through a lane of  heddes  which he used  ad terrorem ...[It brought]  greate   terrour  to the people when  thei   sawe  the  heddes  of their  dedde  fathers, brothers, children,  kindsfolke , and  freinds ...” Advocated killing of non-combatant Irish women because it would help to “kill the men of war by famine”"}, {"deck": "Lecture 5.pptx", "slide": 30, "text": "Martin Frobisher (1535-1594)"}, {"deck": "Lecture 5.pptx", "slide": 31, "text": "Martin Frobisher (1535-1594) Sailed throughout the West Indies Served in the Suppression of Ireland Gained the Queen’s favour in court Makes three attempts at the Northwest Passage (starting in 1576) but the unclear goals of the voyage (find the passage, build a settlement, bring back precious metals) made the efforts a failure Battled against the Spanish between 1580 and 1588- served as vice-admiral under Sir Francis Drake"}, {"deck": "Lecture 5.pptx", "slide": 32, "text": "Martin Frobisher’s Northwest Passage Voyages, 1576 1576- Convinced the Muscovy Company to fund the voyage with Queen Elizabeth’s blessing Reached Baffin Island and met with the Inuit one boat was taken captive by the Inuit  Brought small amounts of fool’s gold back"}, {"deck": "Lecture 5.pptx", "slide": 33, "text": "Baffin Island"}, {"deck": "Lecture 5.pptx", "slide": 34, "text": "Martin Frobisher’s Northwest Passage Voyages, 1577 1577- a second and much larger voyage, financed by the Queen set out Frobisher was directed “to defer the future discovery of the passage until another time” and collect gold Brought back over 200 tons of worthless rock"}, {"deck": "Lecture 5.pptx", "slide": 35, "text": "Martin Frobisher’s Northwest Passage Voyage, 1578 Set out with support of the Queen to establish a colony of 100 men in what the Queen called  Meta Incognita Huge expedition- 15 vessels in all Landed first in Greenland Sailed further on into Hudson’s Bay but met with Icy conditions- Tried to establish a small settlement but it failed Frobisher remained convinced that Hudson’s Bay was part of the Northwest Passage but the mission had been such a colossal financial failure that he was never financed again"}, {"deck": "Lecture 5.pptx", "slide": 36, "text": "Martin Frobisher after his failed Arctic voyages Participated in brutal attacks on the Irish to suppress rebellion in 1580 Battled against the Spanish between 1580 and 1588- served as vice-admiral under Sir Francis Drake in the Defeat of the Spanish Armada"}, {"deck": "Lecture 5.pptx", "slide": 37, "text": "John Davis and Henry Hudson Continue Three Voyages into the Arctic by John Davis in the 1580s were miserable failures  Henry Hudson sailed deep into Hudson Bay looking for  trhe  Northwest Passage in 1610- His crew mutinied and he was set adrift- never to be found again"}, {"deck": "Lecture 5.pptx", "slide": 39, "text": "Sir Francis Drake (c1540-1596) A commoner. Little is known about his early life. May have even spent time as a highway robber. Becomes one of the most significant figures in early modern English History"}, {"deck": "Lecture 5.pptx", "slide": 40, "text": "Drake and the Slave Trade Drake, as a young man, made the third ever English slave trading voyage in 1563 with John Hawkins. They gathered slaves along the coast of Africa to sell to the Spanish in the Americas"}, {"deck": "Lecture 5.pptx", "slide": 41, "text": "Sir Francis Drake Launched attacks on the Spanish main in 1570 and 1571, including combined attacks with French buccaneers and runaway slaves ( Cimarrons ) and captured 20 tons of silver and gold from a mule train on the isthmus of Panama. Climbs a high tree while he is in Panama and sees the Pacific Ocean "}, {"deck": "Lecture 5.pptx", "slide": 44, "text": "Sir Francis Drake Fought in the Desmond rebellions in Ireland, participated in the slaughter of 600 surrendered Irish men, women and children in Rathlin Island in 1575"}, {"deck": "Lecture 5.pptx", "slide": 45, "text": "Drake’s Circumnavigation Circumnavigated the world in 1577 to 1580 after being granted permission by Queen Elizabeth to launch an expedition against the Spanish in the Pacific His men mutiny when they get to Argentina Captured Spanish treasure ships off the coast of Lima Flees north Stayed two months onshore and Established Nova Albion in 1579. California? Oregon? BC?"}, {"deck": "Lecture 5.pptx", "slide": 47, "text": "20 missing men?"}, {"deck": "Lecture 5.pptx", "slide": 49, "text": "Drake’s Route"}, {"deck": "Lecture 5.pptx", "slide": 50, "text": "Sir Francis Drake Was knighted after circumnavigating the globe Became a member of parliament Purchased a quiet country manor in England with his newfound wealth Returned to the Americas to attack Cartagena and Santo Domingo in 1585 and rescues the first Roanoke colonists "}, {"deck": "Lecture 5.pptx", "slide": 51, "text": "Sir Francis Drake Vice Admiral of the English Fleet during the defeat of the Spanish Armada in 1588 Captured Spanish ships during the battle and organized the fire ships that were one of the keys to defeating the Spanish Armada’s attack on England Lost the battle of San Juan in 1595 and died shortly after of dysentery Drake’s Descendants: Two wives in his life but no known children"}, {"deck": "Lecture 5.pptx", "slide": 52, "text": "Raids on the Spanish Main English, French and Dutch Pirates settled the Caribbean and the North American mainland with the express purpose of raiding the major Spanish settlements and the treasure fleets"}, {"deck": "Lecture 5.pptx", "slide": 53, "text": "Sir Walter Raleigh (1552-1618) Took part in the suppression of the Irish rebellion and becomes English landlord in Ireland over lands seized from the Irish Butchered the Irish soldiers and civilians at the Siege of  Smerwick  in 1580 Half brother of Gilbert! Helps to fund and organize the settlement of the Roanoke colony in North Carolina Searches for El Dorado in the Guianas in 1594 and again in 1617 Executed by the English in 1618 for having plundered a Spanish fort during the second expedition"}, {"deck": "Lecture 5.pptx", "slide": 55, "text": "The Roanoke Colony"}, {"deck": "Lecture 5.pptx", "slide": 56, "text": "Roanoke The Lost Colony Sir Walter Raleigh sails in 1584 to scout the land in North Carolina Brings back two indigenous people: Wanchese and  Mateno Granted the right to settle “Virginia”"}, {"deck": "Lecture 5.pptx", "slide": 57, "text": "Roanoke: First Attempt First colony attempted in 1585 with 600 men 100 men were left with Ralph Lane to form a colony Were at war with the Indigenous within a few months Sir Francis Drake tried to deliver slaves he had captured from the Spanish and supplies to the colony Colony was abandoned within a year. The settlers left aboard Drake’s ship A supply ship arrived just days after they left followed by another ship with a large supply of food 15 soldiers from the supply ship were left behind again to secure the coast for the English"}, {"deck": "Lecture 5.pptx", "slide": 58, "text": "The colonists were looking for gold and silver  They spread smallpox and other diseases"}, {"deck": "Lecture 5.pptx", "slide": 59, "text": "The Second Attempt Second colony attempted in 1587  115 settlers came this time but no soldiers They found the remains of the first fort and the bones of one of the fifteen men left behind Settled in the midst of  Croatoan  territory Climate researchers have shown that 1587 was likely worst drought and worst agricultural growing season of any period between 1185 and 1984 in the Carolinas The colonists starts starving again and they started hostilities with the Indigenous"}, {"deck": "Lecture 5.pptx", "slide": 60, "text": "Low on supplies, Governor John White went for help- leaves his daughter and new granddaughter behind The colonists decided to move 50 miles up the coast and they told him Virginia Dare- First English child born in the Americas"}, {"deck": "Lecture 5.pptx", "slide": 61, "text": "Defeat of the Spanish Armada, 1588"}, {"deck": "Lecture 5.pptx", "slide": 62, "text": "Roanoke Colony An English fleet returns to find the Roanoke colony abandoned in 1590 “ Croatoan ” carved into a post and “Cro” into a tree "}, {"deck": "Lecture 5.pptx", "slide": 63, "text": "Rescue Missions Sir Walter Raleigh sailed in 1595 and claimed that he went to look for the Roanoke colonists but his main goal was to find El Dorado Sailed again in 1602 and claimed to be looking for them but did not In 1603, another expedition led by Bartholomew Gilbert went to look for Roanoke colonists but weather forced the ships to land in the wrong spot and the Indigenous killed most of the landing party"}, {"deck": "Lecture 5.pptx", "slide": 64, "text": "Where did they go? The missing colonists…..vanished without a trace…. Murdered by the Spanish? Murdered by the local Indigenous? Murdered by neighboring Indigenous? Died of disease? Died of starvation? Incorporated into Indigenous society? Sailed for England and drowned? A mix of the above?"}, {"deck": "Lecture 5.pptx", "slide": 65, "text": "John Smith’s Map (Zúñiga Map} The Powhatan natives told John Smith about places nearby where men wore European dress and had two  storey  walled houses "}, {"deck": "Lecture 5.pptx", "slide": 66, "text": "Massacred by Powhatan? 1609- The English Royal Council was told by someone that the Powhatans had killed the remaining colonists from Roanoke 1610- A colonist in Jamestown reported that the Powhatans had killed the Roanoke colonists shortly before the Jamestown settlers arrived because the leader had been told by his priests that a nation would rise in Chesapeake Bay to threaten his power"}, {"deck": "Lecture 5.pptx", "slide": 67, "text": "John Lawson,  A Further Voyage to Carolina , 1709 The Roanoke colonists lived among the Hatteras people of the Outer Banks? “A farther Confirmation of this we have from the Hatteras Indians, who either then lived on  Ronoak -Island, or much frequented it. These tell us, that several of their Ancestors were white People, and could talk in a Book, as we do; the Truth of which is  confirm'd  by gray Eyes being found frequently amongst these Indians, and no others. They value themselves extremely for their Affinity to the English and are ready to do them all friendly Offices. It is probable, that this Settlement  miscarry'd  for want of timely Supplies from England; or thro' the Treachery of the Natives, for we may reasonably suppose that the English were forced to cohabit with them, for Relief and Conversation; and that in process of Time, they  conform'd  themselves to the Manners of their Indian Relations”"}, {"deck": "Lecture 5.pptx", "slide": 68, "text": "Cora Tree The tree on Hatteras Island is estimated to be about 500 years old Some have suggested that this might be a reference to the Coree people who lived on the mainland nearby"}, {"deck": "Lecture 5.pptx", "slide": 69, "text": "Dare Stones"}, {"deck": "Lecture 5.pptx", "slide": 70, "text": "Ananias Dare & Virginia went hence unto Heaven, 1591 Any Englishman show [this rock to] John White, Governor of Virginia"}, {"deck": "Lecture 5.pptx", "slide": 71, "text": "Father, soon after you go for England, we came here. Only misery and war [for] two years. Above half dead these two years, more from sickness, being twenty-four. [A] Savage with [a] message of [a] ship came to us. [Within a] small space of time, they [became] frightened of revenge [and] ran all away. We believe it [was] not you. Soon after, the savages said spirits [were] angry. Suddenly [they] murdered all save seven. My child [and] Ananias, too, [were] slain with much misery. Buried all near four miles east [of] this river, upon [a] small hill. Names [were] written all there on [a] rock. Put this there also. [If a] Savage shows this to you, we promised you [would] give [them] great plenty presents. EWD.  "}, {"deck": "Lecture 5.pptx", "slide": 75, "text": "Why do people care so much about the Roanoke Colony mystery? Why and how does it keep consuming people’s attention?"}, {"deck": "Lecture 6.pptx", "slide": 1, "text": "Jamestown: What really Happened to John Smith and Pocahontas?"}, {"deck": "Lecture 6.pptx", "slide": 2, "text": "First Essay Essay Questions will be made available in lecture and on Canvas on September 17. First Essay due on October 9- Submit on Canvas. The Essay will be on the  The Salem Witch Hunt There will be a pop quiz very soon…"}, {"deck": "Lecture 6.pptx", "slide": 3, "text": "Bonus Marks: 1776 Lectures You have the opportunity to gain a total of 2% in bonus marks on your final score for attending lectures about the American Revolution.  The next lecture will be Friday, September 11 at 2pm in the Tom Lea Room (3.206) of the Harry Ransom Center. You must find a TA when you are there to record your attendance and you must stay for the whole lecture and question period to receive your bonus marks. "}, {"deck": "Lecture 6.pptx", "slide": 4, "text": "September 11 1776 Lecture Series - \"Revolution in the Newspapers: How News across British North America and French Saint-Domingue Inspirited Atlantic Rebellion,\" Dr. Ronald Angelo Johnson, Ralph and Bessie Mae Lynn, Chair of History & Associate Professor, Baylor University"}, {"deck": "Lecture 6.pptx", "slide": 13, "text": "Captain John Smith"}, {"deck": "Lecture 6.pptx", "slide": 14, "text": "John Smith  (1580 -1631) Left home at 16 to work at sea  and fought as a privateer Fought as a mercenary against the Spanish in the Dutch revolt Fought as a mercenary for Austria against the Ottoman empire Fought for Transylvania against the Ottomans and was knighted"}, {"deck": "Lecture 6.pptx", "slide": 15, "text": "John Smith Caught during a battle in 1602 and was sold as an Ottoman slave Traveled to Russia and then Poland and then North Africa before returning to England Helped settle the Jamestown colony in 1607 Returned to England in 1610  Returned to explore the coast of New England in 1614"}, {"deck": "Lecture 6.pptx", "slide": 16, "text": "Seventeenth-Century London"}, {"deck": "Lecture 6.pptx", "slide": 19, "text": "Zuniga Map, 1607"}, {"deck": "Lecture 6.pptx", "slide": 22, "text": "Jamestown Island"}, {"deck": "Lecture 6.pptx", "slide": 23, "text": "Virginia Company chartered lands after the second  charterin  1609 stretched from South Carolina to Maine."}, {"deck": "Lecture 6.pptx", "slide": 25, "text": "Jamestown, 1609 By Pedro De Zuniga (Spanish Ambassador)"}, {"deck": "Lecture 6.pptx", "slide": 26, "text": "Opechancanough"}, {"deck": "Lecture 6.pptx", "slide": 28, "text": "The  Ajacán  Mission Spanish missionaries established a settlement in Chesapeake Bay in 1570 to spread Christianity  Nearly all the missionaries were massacred in 1571"}, {"deck": "Lecture 6.pptx", "slide": 29, "text": "Don  Luiś  de Velasco In 1561, the Spanish captured a young boy from the coast of Chesapeake Bay who was said to be a prince The child was renamed Don Luis. He was taken to Spain and had an audience with Philip II (King of Spain) in 1562 and trained as a Jesuit He returned to build the  Ajacán  mission in 1570 or 1571 There was a massacre in 1571, and Don Luis disappeared from the record. Alonso de Olmos, a young servant was spared.  In 1644, Opechancanough was said to be 90 or 100 years old. Was Opechancanough actually Don Luis? Opechancanough means “He who has a white soul.”"}, {"deck": "Lecture 6.pptx", "slide": 33, "text": "Starving Time, 1609-1610 John Smith had declared that he who would not work would not eat Smith leaves in 1609 and the “starving time” begins Caused in part by a 7 year drought but also by a lack of leadership and preparation and the start of the First Anglo-Powhatan War Colonists ate their pets, horses, rats and leather from their boots and belts The evidence confirms that they ate each other. There were accounts of a husband murdering and eating his wife."}, {"deck": "Lecture 6.pptx", "slide": 34, "text": "Rats!"}, {"deck": "Lecture 6.pptx", "slide": 35, "text": "Over the course of one winter, the Jamestown population went from 500 to 60…."}, {"deck": "Lecture 6.pptx", "slide": 36, "text": "Abandonment The Jamestown colonists abandoned the colony on June 7, 1610 and sailed down the James River… They made it 10 miles and were intercepted by a supply ship with colonists, food, a doctor and a new governor"}, {"deck": "Lecture 6.pptx", "slide": 37, "text": "If the colony in Virginia was destroyed or abandoned, what would have happened? How would that have shaped the story of American history?"}, {"deck": "Lecture 6.pptx", "slide": 40, "text": "Disney’s Pocahontas and John Smith"}, {"deck": "Lecture 6.pptx", "slide": 41, "text": "Disney’s Pocahontas and John Smith"}, {"deck": "Lecture 6.pptx", "slide": 42, "text": "Pocahontas"}, {"deck": "Lecture 6.pptx", "slide": 43, "text": "Pocahontas was not a princess  She acted as an intermediary She was captured by the English in 1613 She was married to John Rolfe in 1614"}, {"deck": "Lecture 6.pptx", "slide": 44, "text": "Pocahontas in London"}, {"deck": "Lecture 6.pptx", "slide": 45, "text": "Powhatan Rebellion There was an organized and mass effort by the Powhatan to eradicate the English colony in 1622"}, {"deck": "Lecture 6.pptx", "slide": 47, "text": "The Virginia Colony survived only by the imposition of martial law and through the labor of first indentured servants and then slaves"}, {"deck": "Lecture 6.pptx", "slide": 48, "text": "The Early Virginia Colony Death rates remained very high until the mid-17 th  century The colony nearly failed repeatedly"}, {"deck": "Lecture 6.pptx", "slide": 49, "text": "John Rolfe and Tobacco In 1617, John Rolfe brought tobacco to Virginia from the Caribbean He died in 1622"}, {"deck": "Lecture 6.pptx", "slide": 50, "text": "Labor Supply and Planting The first twenty enslaved Africans arrived in 1619 on a Dutch privateering ship White Indentured servitude was the most common form of labor in Virginia until the 1660s. "}, {"deck": "Lecture 6.pptx", "slide": 51, "text": "The Early English Americas The English in the early Atlantic (1640s) were spread out across the Americas in multiple settlements. The sugar revolution had yet to transform their settlements. Most of the English Atlantic was ethnically English. Few Irish or Scottish came until after the English Civil War and few Africans until the sugar revolution of the 1650s. It was more common in the early Atlantic to see an indigenous person among English settlers than it was to see a slave."}, {"deck": "Lecture 6.pptx", "slide": 52, "text": "The Early English Americas In the 1640s, the Puritan Diaspora had begun and Virginia was firmly settled The Dutch and English were battling for control of the Atlantic but it wasn’t just an imperial rivalry. Much of this was private initiative The Spanish chased English settlers off the Spanish Mainland and out of Puerto Rico in the 1640s."}, {"deck": "Lecture 6.pptx", "slide": 53, "text": "Colonial America, 1650"}, {"deck": "Lecture 7.pptx", "slide": 1, "text": "A City upon a Hill: John Winthrop and the Puritan Diaspora"}, {"deck": "Lecture 7.pptx", "slide": 2, "text": "Religious Origins, Beliefs and Settlement of the Pilgrims Gustavo Fuchs                               HIS315K"}, {"deck": "Lecture 7.pptx", "slide": 3, "text": "Protestant Reformation Ninety-five Theses, 1517. Invention of the print facilitated spread of Protestant ideas throughout Europe, mainly Switzerland, Sweden, Denmark, Norway, Netherlands, Scotland and England Peace of Augsburg, 1555."}, {"deck": "Lecture 7.pptx", "slide": 4, "text": "Eighty Years’ War (1568-1648) Habsburg Dynasty governing from Spain through King Phillip II imposes brutal anti-heresy laws and starts Inquisition (1550s); he targeted Dutch Protestants. As a response, Dutch protestants take up arms and fight back, destroying images and other iconography in Catholic churches; Spain retaliates killing thousands. Phillip II targeted The Low Countries composed of 17 self-governing provinces, imposing heavy taxation. Between 1568 and 1569, Dutch provinces rebel against Spain, leading to Eighty Years’ War. England and France ally with the Dutch, defeat Spain."}, {"deck": "Lecture 7.pptx", "slide": 5, "text": "Europe After Eighty Years’ War"}, {"deck": "Lecture 7.pptx", "slide": 6, "text": "The Origin of Pilgrim’s Religious Beliefs Key concepts Puritanism:  Religious reform movement that aimed to “purify” the church itself, often emphasizing a disciplined approach to life, simplicity in worship and prioritizing education. Calvinism:  Protestant doctrine positing the belief in predestination,  sola scriptura , and that men are inherently sinful. Today is mainly represented by Presbyterian, Baptist, Anglican and Reformed traditions. Brownism :  Developed mainly by Robert Browne, posited that churches should be voluntary democratic congregations not bound by civil authorities. The Nottinghamshire Separatists (1605) Under the Act of Uniformity (1559) a system of penalties was imposed, making attendance to the Church of England mandatory. In Scrooby, a group of  Brownist  congregants decided to quit the Church of England, starting a separatist movement. In 1592 the  Brownists  are outlawed. "}, {"deck": "Lecture 7.pptx", "slide": 7, "text": "William Brewster and John Robinson"}, {"deck": "Lecture 7.pptx", "slide": 8, "text": "Persecution and Migration Puritans  within  the Church of England hoped reforms would allow for reconciliation. But when Richard Bancroft became the Archbishop of Canterbury (1604), he launched a campaign to purge Puritans from the church. Puritans and  Brownists  became the target of hefty fines and imprisonment; eventually groups of Puritans left the Church of England and became part of the Separatist Movement.  Between 1607 and 1608, they move to Amsterdam and then to Leiden, the Netherlands. Dutch and English sailors help smuggle them out of England. Divisions among Puritans in Leiden    Pilgrims Pilgrims worked long hours in low-paying jobs; the Dutch had held a truce with the Spanish (Twelve-Year Truce 1609-1621), but it was nearing its end."}, {"deck": "Lecture 7.pptx", "slide": 9, "text": "Return to England and Voyage to America (1620) Pilgrims depart from the port of Plymouth, Devon, joined by a group of non-religious passengers (“the strangers”).  The Mayflower was supposed to land in Virginia, but instead landed in Cape Cod, MA. “The Strangers” rebel against the pilgrims’ attempt of establishing authority. Both factions sign the “Mayflower Compact” that creates a civil governing body."}, {"deck": "Lecture 7.pptx", "slide": 10, "text": "Religion and Life in New Plymouth Small initial community, permanent surveillance (covenant communities). In matters of trade and property, English Common Law became the norm, but in social matters, laws inspired in religious radicalism were enforced to protect the colony from the anger of God. Governors were directly accountable to church elders and pastors, with government officials codifying into law punishments for moral failings. Public whippings, humiliation and fines for crimes such as profanity, drunkenness, flirting, smoking, gambling and witchcraft. Questioning theology could strip a citizen from the right to vote and ban them from holding public office. Church attendance was mandatory. Death penalty for blasphemy, willful murder, witchcraft, arson, sodomy/rape and treason."}, {"deck": "Lecture 7.pptx", "slide": 11, "text": "Religious Beliefs of the Plymouth Pilgrims “And yet all this could not suppress the breaking out of sundry notorious sins (as this year, besides other, gives us too many sad precedents and instances), especially drunkenness and uncleanness. Not only  incontinency  between persons unmarried, for which many both men and women have been punished sharply enough, but some married persons also. But that which is worse, even sodomy and buggery (things fearful to name)…”  “But (besides this) one reason  may be that the Devil may carry a greater spite against the churches of Christ and the gospel here , by how much the more they  endeavour  to preserve holiness and purity amongst them and strictly  punisheth  the contrary when it  ariseth  either in church or commonwealth; that he might cast a blemish and stain upon them in the eyes of [the] world, who use to be rash in judgment.  I would rather think thus, than that Satan hath more power in these heathen lands, as some have thought, than in more Christian nations, especially over God’s servants in them .”  – Gov. William Bradford,  Of Plymouth Plantation  (circa 1630s),  p. 316."}, {"deck": "Lecture 7.pptx", "slide": 12, "text": "Puritans Arrive at Massachusetts Bay (1630) The Great Migration: Second wave of Puritans choose to leave as a new wave of repression in England was beginning to escalate. Well-connected – obtain backing from Puritan investors, Royal charter omitting location clause.  They still belong to the Church of England (non-Separatists). Winthrop aimed to make Mass. Colony into a model society based on Puritan ideals."}, {"deck": "Lecture 7.pptx", "slide": 13, "text": "Religious Beliefs of New England Puritans Biblical authority, Biblical literalism (based on sola scriptura). Persecution and suffering as a test of faith. Natives as humans that can be saved (become Christian) but currently living under Satan’s influence. Specially during periods of Warfare, natives are interpreted within a demonological framework. Rebellion   Satanic influence. End of the World is imminent. Religious intolerance   When Quakers arrive to Plymouth (1650s) they are expelled from the colony, in Mass. Bay they are executed (1659)."}, {"deck": "Lecture 7.pptx", "slide": 14, "text": "New England Colonies in 1645"}, {"deck": "Lecture 7.pptx", "slide": 15, "text": "Native Tribes in New England"}, {"deck": "Lecture 7.pptx", "slide": 16, "text": "What made them successful? (New England) Between 1616 and 1619 multiple epidemics had wiped out entire Wampanoag communities throughout the coast of New England. Trade with natives and initial peaceful relations. Puritans formed cohesive communities. They came from diverse professional backgrounds, highly educated (lawyers, farmers, families, etc.). Both colonies had a sense of mission: establishing a Christian society according to God’s purposes. Near-universal marriage, children seen as labor (6-8 children per family). High fertility and relatively low mortality. "}, {"deck": "Lecture 7.pptx", "slide": 17, "text": "Different Goals from The Virginia Company Puritans believed that God had put them in Plymouth as chosen people; Bradford believed that anyone hostile to the colony risked God’s anger. Economic resources in New England organized in function of townships, while Virginia had a hierarchical structure to maximize profit for investors. Puritans wanted autonomy from England, The Viriginia Company was embedded within the colonial government system. Production of commodities / Reproduction of society."}, {"deck": "Lecture 7.pptx", "slide": 18, "text": "Expansion and Fertility (1620-1640) Once sons and daughters got married, it became common practice to settle in new lands; organized system that was regulated by the Mass. Colony. Expansion was framed as God’s will, with plagues and disease killing natives interpreted as ‘divine favor’ clearing land for claiming. Missionaries would establish contact with neighboring native Wampanoag communities and sought to convert them; shared believe in the spiritual realm, witchcraft, ghosts, spiritual healing and other religious elements allowed for cultural exchanges and voluntary conversion of natives. For example, English settlers consulted Native American shamans; natives and settlers both shared information on healing techniques. "}, {"deck": "Lecture 7.pptx", "slide": 19, "text": "New England Colonies in 1677"}, {"deck": "Lecture 7.pptx", "slide": 20, "text": "Thanksgiving (1621)"}, {"deck": "Lecture 7.pptx", "slide": 21, "text": "Myths About Thanksgiving Not the first Thanksgiving; historians date first celebration in 1623. No evidence of a long table, turkey, pumpkin pie, or celebration. Wampanoag sought protection from the rival Narragansett tribe. Religious and political imposition, private property rights, and disputes over jurisdiction created escalating tensions (1640s-1660s). King Philip’s War (1675-1676). Squanto (1911 illustration) Treaty with Ousamequin and the Wampanoags (1876 illustration)"}, {"deck": "Lecture 7.pptx", "slide": 22, "text": "Puritan Origins Myth in U.S. Culture Figures like Roger Williams or Anne Hutchinson, both banished from the Mass. Colony, held beliefs on religious freedom much closer to contemporary culture. They were not dull or extremely rigid; they valued and advanced education, and enjoyed moderate drinking and music. They did not create a secular, democratic system of governance; voting and governing was associated with church membership and ultimately hierarchical. They did not assign a higher value to individual freedom, it was always subjected to God and authority."}, {"deck": "Lecture 7.pptx", "slide": 23, "text": "Further Reading Bremer, Francis J. (2020).  One Small Candle: The Story of the Plymouth Puritans and the Beginning of English New England . New York: Oxford University Press. Silverman, David J. (2019).  This Land is Their Land: The Wampanoag Indians, Plymouth Colony and the Troubled History of Thanksgiving . New York: Bloomsbury. Tuininga, Matthew (2025).  The Wars of the Lord: The Puritan Conquest of America’s First People .  New York: Oxford University Press. Turner, John G. (2020).  They Knew They Were Pilgrims: Plymouth Colony and the Conquest for American Liberty . New Haven: Yale University Press."}, {"deck": "Lecture 7.pptx", "slide": 25, "text": "Step 1 Some historians have argued that there was no concept of childhood in Puritan New England. The colonists saw their children as ”little adults.” Do you agree? What obligations did parents have towards their children and what obligations did children have towards their parents? Did New England parents love their children? How was that expressed? How did parents expect their children to behave? What was childhood like for children in Puritan New England and how different was it from your own? What do these sources reveal about family life and ideas about family life in Puritan New England? What surprises you in these sources?"}, {"deck": "Lecture 7.pptx", "slide": 26, "text": "Step 2 Using these sources, construct a clear historical argument with your partner(s). Try to focus on what really struck you or surprised you.  Focus on specific examples or quotations that really help prove your argument. Situate whatever you are arguing within historical context. Think about what you have learned about the larger arguments about early America and the Puritan mindset. Your TA’s will circulate through the room and help you think about constructing an argument and about how to use evidence. "}, {"deck": "Lecture 8.pptx", "slide": 1, "text": "The Godly Commonwealth Puritan Families, Wars in the Woods, and the Salem Witchcraft Trials"}, {"deck": "Lecture 8.pptx", "slide": 2, "text": "Salem Witch Hunt Essay Questions (Pick one!) 1. What can we learn from these documents about the ways in which colonists in New England made sense of extraordinary occurrences and crises in their lives, especially in terms of the relationship between the natural and supernatural worlds?  Why? What kinds of emotion (such as fear, hatred, suspicion, and doubt) are voiced or referred to in the documents What role did physical violence play in the witch hunt?  Why? To what extent were the afflicted girls and young women performing for their neighbors and court officials? If they were, does that mean that their testimony was necessarily false? Are there alternatives to accepting their claims at face value or dismissing them as falsehoods?  Why? Or...write an essay based on your own unique insight. Choose your own adventure. "}, {"deck": "Lecture 8.pptx", "slide": 3, "text": "John Winthrop (1587-1649)"}, {"deck": "Lecture 8.pptx", "slide": 4, "text": "The Life and Times of John Winthrop Son of a wealthy country gentleman who had bought his estate from Henry VIII Studied law and served as Justice of the Peace Married three times. His first two wives died. Had 16 children Led 700 Puritan migrants to New England in 1630 Became Governor of the Massachusetts Bay Colony."}, {"deck": "Lecture 8.pptx", "slide": 5, "text": "Arbella"}, {"deck": "Lecture 8.pptx", "slide": 6, "text": "Winthrop’s Arbella Sermon, Part 1 “Now the only way to avoid this shipwreck, and to provide for our posterity, is to follow the counsel of Micah, to do justly, to love mercy, to walk humbly with our God. For this end, we must be knit together, in this work, as one man. We must entertain each other in brotherly affection. We must be willing to abridge ourselves of our superfluities, for the supply of others’ necessities. We must uphold a familiar commerce together in all meekness, gentleness, patience and liberality. We must delight in each other; make others’ conditions our own; rejoice together, mourn together,  labor  and suffer together, always having before our eyes our commission and community in the work, as members of the same body. So shall we keep the unity of the spirit in the bond of peace.”"}, {"deck": "Lecture 8.pptx", "slide": 7, "text": "Winthrop’s Arbella Sermon, Part 2 “The Lord will be our God, and delight to dwell among us, as His own people, and will command a blessing upon us in all our ways, so that we shall see much more of His wisdom, power, goodness and truth, than formerly we have been acquainted with. We shall find that the God of Israel is among us, when ten of us shall be able to resist a thousand of our enemies; when He shall make us a praise and glory that men shall say of succeeding plantations, \"may the Lord make it like that of New England.\""}, {"deck": "Lecture 8.pptx", "slide": 8, "text": "Winthrop’s Arbella Sermon, Part 3 “For we must consider that we shall be as a city upon a hill . The eyes of all people are upon us. So that if we shall deal falsely with our God in this work we have undertaken and so cause Him to withdraw His present help from us, we shall be made a story and a by-word through the world. We shall open the mouths of enemies to speak evil of the ways of God, and all professors for God's sake. We shall shame the faces of many of God's worthy servants, and cause their prayers to be turned into curses upon us till we be consumed out of the good land whither we are  going…”"}, {"deck": "Lecture 8.pptx", "slide": 9, "text": "Winthrop on Democracy “If we should change from a mixed aristocracy to mere democracy, first we should have no warrant in scripture for it: for there was no such government in Israel ... A democracy is, amongst civil nations, accounted the meanest and worst of all forms of government. [To allow it would be] a manifest breach of the 5th Commandment.”"}, {"deck": "Lecture 8.pptx", "slide": 10, "text": "The Great Puritan Migration, 1630-1640 Puritans criticized the Anglican Church, believing it had too many Roman Catholic tendencies The great migration was spurred by Charles I persecution of religious dissenters Marked by family migrations Massive influx of migrants to New England 20,000 Puritans moved to New England between 1630 and 1640 50,000 Puritans moved to the New World"}, {"deck": "Lecture 8.pptx", "slide": 12, "text": "Puritan Pirates in the Caribbean Providence Island was founded in 1629 by Puritans during the Great Diaspora An island off the coast of Nicaragua (the Providence Island Company was looking at 3 islands, including Association Island- modern day Tortuga) Was supposed to be modeled on a great Puritan Society Forbade gambling, prostitution, drunkenness and profanity Encouraged settlers to survive by attacking settlements on the Spanish Mainland First slave society in the Americas Destroyed by the Spanish in 1641"}, {"deck": "Lecture 8.pptx", "slide": 13, "text": "Providence Island"}, {"deck": "Lecture 8.pptx", "slide": 14, "text": "Providence Island"}, {"deck": "Lecture 8.pptx", "slide": 15, "text": "What can we learn about New England settlement by comparing Puritan settlement in Providence Island and in New England?"}, {"deck": "Lecture 8.pptx", "slide": 16, "text": "The Wilderness"}, {"deck": "Lecture 8.pptx", "slide": 17, "text": "Infants"}, {"deck": "Lecture 8.pptx", "slide": 18, "text": "Animals"}, {"deck": "Lecture 8.pptx", "slide": 19, "text": "Animals"}, {"deck": "Lecture 8.pptx", "slide": 20, "text": "Puritan Mother and Child, New England, 1670"}, {"deck": "Lecture 8.pptx", "slide": 21, "text": "Childhood and The Infant Body"}, {"deck": "Lecture 8.pptx", "slide": 22, "text": "Newborn in Swaddling Clothes"}, {"deck": "Lecture 8.pptx", "slide": 23, "text": "The Devil in Early America"}, {"deck": "Lecture 8.pptx", "slide": 25, "text": "The Pequots"}, {"deck": "Lecture 8.pptx", "slide": 26, "text": "The Mystic Massacre and the Pequot War (1636-1638) English Puritans searching for land relied on the Narragansetts and Mohegans to destroy the Pequots  On May 26, 1637- a New England force accompanied by Narragansett and Mohegan allies burned down a Pequot village that they had surrounded. They killed between 400 and 700 men, women and children Survivors were sold into slavery"}, {"deck": "Lecture 8.pptx", "slide": 27, "text": "King Phillip’s War or  Metacomet’s  Rebellion (1675-1676)"}, {"deck": "Lecture 8.pptx", "slide": 28, "text": "A battle in southern New England that eventually stretched into Maine 1.5% of all English colonists killed Over half of New England towns were assaulted The war began when John  Sassamon , a Harvard graduate who lived in a “Praying Town” reported that  Metacomet  was organizing an attack on New England towns Sassamon  was found dead under a frozen pond  Three of his  Wompanoag  tribe members were arrested and hung  Wompanoag  tribe members attacked a New England town and wiped it out War was underway On March 12, 1676, the Indigenous launched an assault on Plymouth Colony in an effort to wipe out Plymouth Colony- It Failed King Phillip’s War"}, {"deck": "Lecture 8.pptx", "slide": 29, "text": "In 1689, the new ruler of England, William of Orange, brought the country into war against the French, joining with Austria, Spain and Brandenburg Known as the Nine-Year war (1689-1697) in Europe and King William’s War in America At this point, the French had built the largest navy in Europe and had the largest army James II of Scotland joined the French and led an invasion of Ireland. The first  Jacobite  rebellion. He was defeated on the ground by William’s forces James led a combined force with Louis XIV against England again in 1692, trying for an invasion but failed The French were defeated in a decisive naval battle by the English in 1692 and they stopped making improvements in ship technology or focusing on ship building. The French switched to relying on privateers, cheaper but less effective for controlling the seas King Williams’ War (1689-1697)"}, {"deck": "Lecture 8.pptx", "slide": 30, "text": "During the war, the French invaded Jamaica, marching inland and destroying sugar cane fields and capturing more than 2,000 slaves. Prompted the English to start keeping larger garrisons in the West Indies There was intense fighting in North America between the French and the English in New England and New York. Massachusetts captured French Port Royal in Nova Scotia with 700 men raised in the colony but left quickly when a French warship arrived The French moved an invasion force into Quebec, but it was too late in the winter for an invasion During the war, the Iroquois allied with the British and attacked French settlements near Montreal, massacring over 300 settlers.  Led to constant raids among the French, English and Indigenous along the frontier between New England and New France At the end of the war, all colonial possessions in the Americas were returned and the French agreed to recognize William and Mary as the legitimate rulers of England. Spain agreed to recognize the French claim to one-third of Hispaniola, which became St.  Domingue King Williams’ War in the Americas"}, {"deck": "Lecture 8.pptx", "slide": 31, "text": "Magistrate Samuel Seawall, 1652-1730 Served as a magistrate in the Salem Witch Trials"}, {"deck": "Lecture 8.pptx", "slide": 32, "text": "“For Satan was here [in the Americas] as in his House strongly Fortified and well Mooted in. He was abundantly stored with Arms and Ammunition. Here [in the Americas] he had his headquarters, his Palaces; his Throne, kept his Court; exercised an Universal, Unlimited, Unquestioned Jurisdiction.” “Being in love with bondage...[the Indians] take up Arms against their Deliverer; and strive with all their might to continue the Tyrant in quiet Possession...He will not  faile  therefore to use all his Policy and Power, all his Methods and  Strategems  of War against those recruits, coming over to reinforce the Invasion of his Dominions” Seawall on Natives in America"}, {"deck": "Lecture 8.pptx", "slide": 33, "text": "“Witches are servant only, and slaves to the Devil; but the Necromancers are his masters and commanders” ~James I of England (James VI of Scotland) King’s and Witches"}, {"deck": "Lecture 8.pptx", "slide": 34, "text": "Historians estimate that approximately 40,000 women were executed as witches in Europe from 1450 to 1700. Essentially, if we consider all causes of death, a woman had a 1 in 12,500 chance of being executed as a witch"}, {"deck": "Lecture 8.pptx", "slide": 35, "text": "First Person executed as a witch in North America came in 1647 during the English Civil War. There was also a surge in witch hunts during the English Civil War in England The surge in witch hunt trials also comes during the Global Crisis that came with the Little Ice Age"}, {"deck": "Lecture 8.pptx", "slide": 36, "text": "Witchcraft and the Salem Witchcraft Trials, February 1692 to May 1693"}, {"deck": "Lecture 8.pptx", "slide": 37, "text": "Over  150 people   arrested and imprisoned 26  went to trial 19  of the accused were hanged (14 women and 5 men) and one man was crushed to death as they tried to force him to enter a plea Salem Trials"}, {"deck": "Lecture 8.pptx", "slide": 38, "text": "The Parris House"}, {"deck": "Lecture 8.pptx", "slide": 39, "text": "Began at the house of the Reverend Parris, a former sailor and merchant who was knew to the area Betty Parris, age 9, and her cousin Abigail Williams, age 11, the daughter and niece (respectively) of the Reverend Samuel Parris, began to have fits described as \"beyond the power of Epileptic Fits or natural disease to effect.“ Sarah Goode, Sarah Osborne and Tituba were accused of bewitchment. February, 1692"}, {"deck": "Lecture 8.pptx", "slide": 40, "text": "Magic and Fortune Telling The Venus Egg People would tell their fortunes (future social status, who they would marry, etc.) by dropping a raw egg into a clear glass of warm water A form of fortune telling known as  oomancy The girls in New England saw a coffin in the glass and became  terrifed"}, {"deck": "Lecture 8.pptx", "slide": 41, "text": "Once thought to be an Afro-Caribbean slave Now believed to have been an Indigenous Arawak born in South America She was captured and sold as a slave in Barbados where she first met the Reverend Parris Parris was given Tituba (most likely to settle a debt) by one of his business associates, and she was brought to New England to work in his house as a domestic slave Tituba confessed and claimed that Sarah Goode and Sarah Osbourne had done witchcraft with her Tituba"}, {"deck": "Lecture 8.pptx", "slide": 42, "text": "Daughter of a prosperous innkeeper who committed suicide when Sarah was 17. Sarah was supposed to inherit some of the money when she came of age, but she never did Married a former indentured servant named Daniel Poole Poole died in deep debt 1682. Sarah was expected to pay the debt She married William Good and his lands were seized and sold to pay the debt to creditors By the time of the trials, Sarah and her husband were homeless, destitute and she was reduced to begging for work, food, and shelter from her neighbours Sarah Good[e] (1645-1692)"}, {"deck": "Lecture 8.pptx", "slide": 43, "text": "Sarah Osbourne (1643-1692)  Married a prominent man known as Robert Prince in 1662 but he died in 1674 She hired an Irish indentured servant to help her and then married him  The farm was supposed to be bequeathed to Prince’s sons, but Osbourne upset social norms by taking over the farm and running it with her new husband The case went to court Osbourne stopped attending church and had not attended for three years"}, {"deck": "Lecture 8.pptx", "slide": 44, "text": "The accused are jailed for months The women in the jail cells start remembering and identifying other culprits"}, {"deck": "Lecture 8.pptx", "slide": 45, "text": "Dorothy Good[e] Daughter of Sarah Good[e] Kept in a dungeon for 8 months! She became homeless as an adult “straying and rambling” Had two children out of wedlock- born “bastards”"}, {"deck": "Lecture 8.pptx", "slide": 46, "text": "17 th  Century New England Jails Prisoners were forced to pay for the cost of their imprisonment Sometimes the cells were standing room only The cells reeked of feces and tobacco There was no air conditioning or heating There were no window panes Prisoners were bound in iron and chains"}, {"deck": "Lecture 8.pptx", "slide": 47, "text": "Sir William Phips and the New Charter"}, {"deck": "Lecture 8.pptx", "slide": 48, "text": "\"a forlorn, friendless, and forsaken creature, broken down by wretchedness of condition and ill-repute.\" Description of Sarah Good at Trial"}, {"deck": "Lecture 8.pptx", "slide": 49, "text": "The proceedings against Good were described as \"cruel, and shameful to the highest degree.\"  During the trial, one of the afflicted girls cried out that she was being stabbed with a knife by the apparition of Good. Upon examination, a broken knife was found on the girl. However, as soon as it was shown to the court, a young man came forward with the other part of the knife, stated that he had broken it yesterday and had discarded it in the presence of the afflicted girls. Although the girl was reprimanded and warned not to lie again, the known falsehood had no effect on Good's trial. She was presumed guilty from the start. "}, {"deck": "Lecture 8.pptx", "slide": 50, "text": "Sarah Good’s Execution Good was executed on July 19"}, {"deck": "Lecture 8.pptx", "slide": 51, "text": "Over  150 people   arrested and imprisoned 26  went to trial 19  of the accused were hanged (14 women and 5 men) and one man was crushed to death as they tried to force him to enter a plea An unknown number died in prison The accusations spread across New England Salem Trials"}, {"deck": "Lecture 8.pptx", "slide": 52, "text": "After someone concluded that a loss, illness or death had been caused by witchcraft, the accuser would enter a complaint against the alleged witch with the local magistrates. If the accusation was deemed credible, the person would be arrested and brought in for public accusation. If the accused did not confess, they were “pressed” to do so. If the magistrates at this local level were satisfied that the complaint was well-founded, the prisoner was handed over to be dealt with by a superior court. The accused would be examined before a grand jury A person could be indicted on charges of afflicting with witchcraft, or for making an unlawful covenant with the Devil.   Once indicted, the defendant went to trial, sometimes on the same day. Judgment was quick and executions could occur in as little as a week. General Procedure"}, {"deck": "Lecture 8.pptx", "slide": 53, "text": "Examination of a Witch"}, {"deck": "Lecture 8.pptx", "slide": 55, "text": "a  witch cake , using traditional English white magic was sometimes used to discover the identity of the witch. The cake, made from rye meal and urine from the afflicted, was fed to a dog. According to English folk tales, when the dog ate the cake, the witch herself would be hurt because invisible particles she had sent to afflict the victim remained in the victims' urine. Th cries of pain from the witch when the dog ate the cake would identify her as the witch. This superstition was based on the Cartesian \"Doctrine of Effluvia\", which posited that witches afflicted by the use of \"venomous and malignant particles, that were ejected from the eye.\" The Witch’s Cake"}, {"deck": "Lecture 8.pptx", "slide": 56, "text": "“...the Witch by the cast of her eye sends forth a  Malefick   Venome  into the Bewitched to cast him into a fit, and therefore the touch of the hand doth by sympathy cause that  venome  to return into the Body of the Witch again...” \t~Contemporary account of the touch test The Touch Test"}, {"deck": "Lecture 8.pptx", "slide": 57, "text": "Confession or Denial? If you confess, you might not be put to death, especially if you identified other accusers  If you confess, your reputation would be destroyed, and you might be put back in jail If you confess, you will lose all your property"}, {"deck": "Lecture 8.pptx", "slide": 58, "text": "Cotton Mather A prominent intellectual who was asked to advise on the trials. Author of  Memorable Providences Relating to Witchcrafts and Possessions  (1689). Told the judges to be careful not to rely purely on “spectral evidence,” but also urged them to carry on with prosecuting suspected witches Writes  Wonders of the Invisible World  (1693) after the trials"}, {"deck": "Lecture 8.pptx", "slide": 59, "text": "Cotton Mather’s Account of the Salem Trials (1693)- Part 1 “Wherefore The devil is now making one Attempt more upon us; an Attempt more Difficult, more  Surprizing , more  snarl’d  with unintelligible Circumstances than any that we have hitherto Encountered; an Attempt so Critical, that if we get well through, we shall soon Enjoy Halcyon Days, with all the Vultures of Hell Trodden under our Feet. He has wanted his Incarnate Legions to Persecute us, as the People of God have in the other Hemisphere been Persecuted: he has therefore drawn forth his more spiritual ones to make an  attacque  upon us.”"}, {"deck": "Lecture 8.pptx", "slide": 60, "text": "Cotton Mather’s Account of the Salem Trials (1693)- Part 2 “We have been advised by some Credible Christians yet alive, that a Malefactor, accused of Witchcraft as well as Murder, and Executed in this place more than Forty Years ago, did then give Notice of, An Horrible PLOT & against the Country by WITCHCRAFT, and a Foundation of WITCHCRAFT then laid, which if it were not seasonably discovered, would probably Blow up, and pull down all the Churches in the Country.  And we have now with Horror seen the Discovery of such a WITCHCRAFT!”"}, {"deck": "Lecture 8.pptx", "slide": 61, "text": "Reverend George Burroughs (1652-1692) Gave an impassioned speech and finished with the Lord’s Prayer People believed that people in league with the devil would struggle to say the lord’s prayer Cotton Mather intervenes and explains to a near riotous crowd that these people were witches and it was just. Burroughs is hung with 4 others The bodies are barely covered"}, {"deck": "Lecture 8.pptx", "slide": 62, "text": "The Pressing of Giles Corey (September 1692) He was 81 years old"}, {"deck": "Lecture 8.pptx", "slide": 63, "text": "Someone accuses Phips’ wife of being a witch! Phips intervenes and dismantles the courts. Everyone in jail is released."}, {"deck": "Lecture 8.pptx", "slide": 64, "text": "In 1711, the General Court reversed its decision on most of the charges In 1736 witchcraft was  decriminalized altogether  in Britain Apologies"}, {"deck": "Lecture 8.pptx", "slide": 65, "text": "Some doctors, retrospectively trying to explain the witchcraft hysteria have blamed convulsive ergot poisoning caused by eating rye bread made from grain infected by the fungus Claviceps purpurea (which is the natural substance from which LSD is derived) Can lead to painful muscle spasms and  siezures  and hallucinations Medical Explanations"}, {"deck": "Lecture 8.pptx", "slide": 66, "text": "War and Trauma"}, {"deck": "Lecture 8.pptx", "slide": 67, "text": "Two Towns Salem Village was poor, isolated and split by land disputes and rivalries. This is where the accusations started Salem Town was much wealthier and more peaceful"}, {"deck": "Lecture 8.pptx", "slide": 68, "text": "Non-Conformists Many of the accused were independent women, people who were not strict Puritans and people who were social and religious outcasts "}, {"deck": "Lecture 8.pptx", "slide": 70, "text": "How do we explain the Salem Witch Hunt? What happened to people there? Are conspiracy scares and panics common in history? Can you think of others?"}, {"deck": "Lecture 8.pptx", "slide": 71, "text": "Why is Salem significant? What do we learn from this event? "}, {"deck": "Lecture 9.pptx", "slide": 1, "text": "How to write a history paper  (and how not to write one)."}, {"deck": "Lecture 9.pptx", "slide": 2, "text": "Historical Questions are the key! Stop trying to write topic papers and address a question or a problem."}, {"deck": "Lecture 9.pptx", "slide": 3, "text": "4 rules So you want an A?"}, {"deck": "Lecture 9.pptx", "slide": 4, "text": "1. Schedule time and don’t wait for inspiration."}, {"deck": "Lecture 9.pptx", "slide": 5, "text": "2. Go to class"}, {"deck": "Lecture 9.pptx", "slide": 6, "text": "3. Practice, practice, practice."}, {"deck": "Lecture 9.pptx", "slide": 7, "text": "4. Ditch your phone to study and write."}, {"deck": "Lecture 9.pptx", "slide": 9, "text": "Essential Rules for Knowledge Work in an Age of Distractions Use anti-distraction Apps like Self-Control or Freedom if you must Write alone with a door that closes."}, {"deck": "Lecture 9.pptx", "slide": 10, "text": "Multitasking, Dopamine and Boredom There are no significant  benefits  to multitasking while writing.  Boredom is Important for Creativity Multitasking is a myth according to what business professor Sophie Leroy has termed “attention residue” Multiple studies have shown that multitasking is less productive in the long run"}, {"deck": "Lecture 9.pptx", "slide": 11, "text": "Writing and Study Tip of the Day Put your phones and computers and tablets on do not disturb when you write and put them out of sight. This is VERY important for deep critical thinking. Go to a quiet place and focus on what you are doing. Your work will be done faster, and your grades will most likely be better.  An hour of deep and focused work is generally what you need to start to yield significant critical insights into a subject.  There are  no  significant  benefits  to multitasking while writing. "}, {"deck": "Lecture 9.pptx", "slide": 12, "text": "“Two Core Abilities for Thriving in the New Economy 1. The ability to quickly master hard things. 2. The ability to produce at an elite level, in terms of both quality and speed.”  ~Cal Newport, Professor of Computer Science at Georgetown"}, {"deck": "Lecture 9.pptx", "slide": 13, "text": "“To simply wait and be bored has become a novel experience in modern life, but from the perspective of concentration training, it’s incredibly valuable.”  ~ Cal Newport"}, {"deck": "Lecture 9.pptx", "slide": 14, "text": "Why? Learn to be a four-year old child again."}, {"deck": "Lecture 9.pptx", "slide": 15, "text": "Major Pronoun Problems It’s and its It’s is for it is.  So when you’re writing the sentence, read it out with ‘it is’ in place of the it’s.  If that doesn’t make sense, you don’t need the apostrophe. For example:   It’s a beautiful day in the neighbourhood. The  plan was flawed.  Its main problem was that it didn’t allow for differences in weight."}, {"deck": "Lecture 9.pptx", "slide": 16, "text": "Basically... \t it’s  is a contraction,  \t\t\tfor a pronoun and a verb. \t\t\t\t          its  is a possessive pronoun."}, {"deck": "Lecture 9.pptx", "slide": 17, "text": "Simple Rule in Academic Writing Don’t ever use it’s No contractions in academic writing"}, {"deck": "Lecture 9.pptx", "slide": 18, "text": "Your and You’re You’re is another  contraction , for you are.  Same rule applies:  if your sentence doesn’t make sense with ‘you are’ in it, then use ‘your’. You’re going to have to leave the dorm by Dec. 8. Your final exam is Friday."}, {"deck": "Lecture 9.pptx", "slide": 19, "text": "Their, there, and they’re ‘Your’ is a  possessive  pronoun.  It shows ownership.  So does ‘their.’ ‘They’re’ is another  contraction .  It means ‘they are’. ‘There’ is a word that shows relative space or location.  It can be an adverb, pronoun or noun. Your  dog is going to spend the weekend at  their  house.  He can’t wait to go over  there .   They’re  also excited that the dog is coming to spend the weekend.  You’re  going to pick him up Monday, right?"}, {"deck": "Lecture 9.pptx", "slide": 20, "text": "Other tips... When writing and proofreading your essays, don’t rely on grammar/spell check.  It’s wrong as often as it’s right, and it doesn’t pick up on a correctly-spelled word in the wrong place. Pay attention to spelling and grammar.  There’s no such thing as a small typo.  All mistakes affect your presentation and reflect on your writing skill and style. Learn now to avoid errors. It will become important for your professional career Paragraphs are important!  No paragraph should ever be less than five sentences."}, {"deck": "Lecture 9.pptx", "slide": 21, "text": "More Tips Go online for tips regarding citations.  There are very specific right and wrong ways to do footnotes and bibliographies. In History, we use Chicago Manual of Style format.  Avoid the passive voice. Avoid personal pronouns like ‘I’, ‘me’ or ‘you’ unless they are declarative and objective statements Avoid ‘we’ or ‘us’"}, {"deck": "Lecture 9.pptx", "slide": 22, "text": "The Rise of the Exclamation Mark  No exclamation points!   No need to shout in a paper."}, {"deck": "Lecture 9.pptx", "slide": 23, "text": "…and for the eccentrics Read your paper aloud Walk to think Read your paper to someone or something! Write 15 minutes per day"}, {"deck": "Lecture 9.pptx", "slide": 26, "text": "Punctuation:  The Most Basic Tools of Communication . Review the rules of punctuation. Poor punctuation ruins too many papers.  Comma splice are far too common. Learn to identify dependent and independent clauses. Learn the difference between colons and semicolons.  Stay away from exclamation marks."}, {"deck": "Lecture 9.pptx", "slide": 27, "text": "‘I’ Matters I will argue… I have examined… I feel… I believe…. I really believe…"}, {"deck": "Lecture 9.pptx", "slide": 28, "text": "Don’t overuse adjectives and adverbs. English is a rich language. Use it. Vary your word choice. English is an enormously large and rich language. Do not overuse the word “very.” "}, {"deck": "Lecture 9.pptx", "slide": 29, "text": "Limiting Claims are Usually Not Necessary I think that although the notion of germs did not emerge until the nineteenth century, the eighteenth-century development of genteel cleanliness mores paved the way for germ theory."}, {"deck": "Lecture 9.pptx", "slide": 30, "text": "I just wanted to say that…"}, {"deck": "Lecture 9.pptx", "slide": 31, "text": "Constructing an Essay Take time and care with your work. It is your work and no one but you is responsible for it. Put effort and care into your work and think about your sources and you’ll get an A. Rush through an essay and you won’t get an A. For history papers, make your question clear, include context and write in the past tense. Significance claims are important"}, {"deck": "Lecture 9.pptx", "slide": 32, "text": "Topic Sentences!!! Each paragraph must begin with a sentence on what the paragraph is about. The essential theme or topic of the paragraph should be clear with the first sentence."}, {"deck": "Lecture 9.pptx", "slide": 33, "text": "Transition Sentences Connect your paragraphs. Make sure each paragraph builds on the last. "}, {"deck": "Lecture 9.pptx", "slide": 34, "text": "Passive Constructions  (no actor in the sentence) The ball was chased. My wallet was stolen. The office is cleaned every day, A new factory was built. It will be proven that… It was believed that… It is argued that…"}, {"deck": "Lecture 9.pptx", "slide": 35, "text": "It was argued that the body was an equilibrium, and it was believed that doctors could bleed the body to bring it back to equilibrium."}, {"deck": "Lecture 9.pptx", "slide": 36, "text": "Omit the Needless There should be no needless words in a sentence, no needless sentences in a paragraph and no needless paragraphs in a paper You should generally aim to cut 10% from your essays."}, {"deck": "Lecture 9.pptx", "slide": 37, "text": "Emotive and assertive arguments vs. analytical, empirical and proven arguments History is not a set of moral evaluations  Moralizing claims will significantly hamper your writing"}, {"deck": "Lecture 9.pptx", "slide": 38, "text": "“What the Spanish did to the Natives they encountered was not as bad as the English because the Spanish kept native societies intact and just took them over whereas the English just destroyed the Natives from the outset.”"}, {"deck": "Lecture 9.pptx", "slide": 39, "text": "Quoting Don’t make a cut and paste paper Quote to illustrate your points and give a sense of the language, demonstrating the language at work Do not quote to fill your paper Avoid block quotes unless you intend to analyze the language in detail Block quotes are almost never necessary in a short paper Almost never necessary to quote from secondary sources"}, {"deck": "Lecture 9.pptx", "slide": 40, "text": "Essentializing Words and concepts to be careful with interesting natural fascinating inevitable"}, {"deck": "Lecture 9.pptx", "slide": 41, "text": "Beware the Whiggish Narrative!"}, {"deck": "Lecture 9.pptx", "slide": 42, "text": "Paper Styles Chronological Thematic Narrative"}, {"deck": "Lecture 9.pptx", "slide": 43, "text": "Paper Organization  If you are discussing three people or three books or three events, it is usually best to not order your paragraphs by topic. Instead, explore multiple topics in a single paragraph by comparing or connecting them or by drawing themes through them."}, {"deck": "Lecture 9.pptx", "slide": 44, "text": "Operate under the assumption that people think differently than you. Learn the different intellectual terrain Don’t be afraid to rely on etymology and the OED"}, {"deck": "Lecture 9.pptx", "slide": 45, "text": "Identifying the assumptions inherent in someone’s thinking. What needs no evidence for them? What are their initial assumptions? Think of an example of something someone has said to you recently that was naturalized. Did they use the word “nature”? Did they  say“That’s  just who I am”? How about “That’s just how it is” Beware of the ways in which naturalizing statements are used Natural"}, {"deck": "Lecture 9.pptx", "slide": 46, "text": "Remember that your best writing should be concise and precise. Aim to make your ideas complex, original and sophisticated while making your ideas simple, direct and clear Don’t try to sound like an academic but avoid colloquial language"}, {"deck": "Lecture 9.pptx", "slide": 47, "text": "Audience Imagine that your audience is an intelligent and educated person but also someone who doesn’t know the topic"}, {"deck": "Lecture 9.pptx", "slide": 48, "text": "Just Don’t… ‘Since the beginning of time…’ ‘Throughout human history…’ ‘Back in the day…’"}], "professor": [{"deck": "Lecture 13.pptx", "slide": 2, "text": "Exam Structure (Covering everything until the end of Tuesday) You will have four types of questions. You will select questions from more than one option on both the ID”s and the Essays. Short Answer…. Essay…There will be two options. One will be a standard analytical essay and the other will be an imaginative history essay. Multiple Choice…. ID’s…. You will answer one of three options"}, {"deck": "Lecture 13.pptx", "slide": 3, "text": "Recap Essay Questions Was the expedition of Pánfilo de Narváez a success or a failure? Why? What were the factors that contributed to that success or failure? What does the expedition of Pánfilo de Narváez reveal about the Spanish colonization of the Americas? Why did the Roanoke colony fail? What do you think happened to the settlers and why? Contrast and compare the settlements of Roanoke (North Carolina), Jamestown (Virginia) and Meta Incognita (Arctic). Why did two fail while one succeeded? What was the experience of childhood like in Puritan New England in the seventeenth century?"}, {"deck": "Lecture 13.pptx", "slide": 4, "text": "ID’s  Identify, contextualize, and state the significance of the following people, places, processes or events. Salem Witch Hunts Roanoke Colony Puritan Diaspora Little Ice Age William Byrd Jamestown Colony"}], "topics": ["Before 1492", "Columbus and conquest", "Early English colonies", "Puritans and Salem", "Indigenous resistance", "Bondage and slavery", "Gentility and empire"]};

function home(){let strong=DATA.cards.filter(c=>(state.ratings[c.id]?.streak||0)>=2).length,attempted=Object.keys(state.ratings).length;return `<div class="split"><section><span class="badge">${DATA.cards.length} recall prompts · ${mc.length} quiz questions · ${exams.length} writing prompts</span><h2>Your first job: find the gaps</h2><p>Start with a 15-minute recall session. Write an answer before revealing the explanation. Be strict about whether you could produce the evidence on paper.</p><button class="primary" data-go="recall">Start recall practice</button><h3>The confirmed exam format</h3><p>Lecture 13 says coverage runs through the end of Tuesday. Four question types: short answer, multiple choice, IDs, and an essay. You answer one of three ID options. The essay offers a standard analytical option and an imaginative history option.</p>${source(DATA.professor.find(s=>s.slide===2))}<h3>Three days of work</h3><div class="day"><b>Monday, Oct. 12 · Diagnose and repair</b><br>Three 40-minute blocks: recall early material; repair missed topics with original notes/slides; outline one professor practice essay. Add reading examples yourself.</div><div class="day"><b>Tuesday, Oct. 13 · Finish coverage</b><br>Attend lecture and add its material. Ask the TA about unclear facts and exam timing. Three 40-minute blocks: later topics; IDs and primary sources; another essay attempt.</div><div class="day"><b>Wednesday, Oct. 14 · Practice without help</b><br>Revisit weak cards. Rehearse mixed questions and a handwritten essay under a timer. Check against sources, then revisit missed material later. Protect your sleep.</div><div class="day"><b>Thursday, Oct. 15 · Brief review</b><br>Review your remaining gaps for 20–30 minutes. Bring your blue book and pens. Exam: 2–3:30 p.m.</div></section><aside><div class="panel"><h3>Your recall record</h3><h2>${strong} / ${DATA.cards.length}</h2><div class="quiet">cards self-rated strong twice in a row</div><div class="bar"><span style="width:${strong/DATA.cards.length*100}%"></span></div><p class="small">${attempted} cards attempted. This is a practice record, not a grade prediction. Two immediate repeats do not prove lasting recall; repeat later with notes closed.</p><button data-go="recall" id="weak-home">Review weak cards</button></div><h3>What “ready” should mean</h3><ul><li>You can explain each topic without looking.</li><li>Your IDs give context and significance.</li><li>You can support an argument with specific course evidence.</li><li>You can explain change over time and weigh competing explanations.</li><li>You have covered assigned readings and Tuesday’s final material.</li></ul><div class="notice">Course policy: the syllabus prohibits generative AI for academic work. Ask the instructor whether this preparation tool is permitted before using its generated material.</div><p class="small">No tool can guarantee an A. This one makes gaps visible and gives you repeated practice.</p><button id="export">Export progress</button> <label>Restore progress <input id="restore" type="file" accept="application/json"></label></aside></div>`}
