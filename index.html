</style></head><body><header><div class="eyebrow">HIS 315K · Fall 2026 · Luke’s study workspace</div><h1>The history, explained and connected</h1><div class="small">Thursday, October 15 · 2–3:30 p.m. · WCH 1.120 · Bring a blue book</div><nav id="nav"></nav></header><main id="app"></main>
<script>
const DATA={"units": [{"topic": "Before 1492", "title": "The Americas before European conquest", "question": "What changes when we start with Indigenous societies instead of Columbus?", "story": ["The Americas were already inhabited by diverse societies with cities, farms, trade, political hierarchies, and competing interests. Cahokia in the Mississippi valley and Tenochtitlan in central Mexico challenge the image of an empty wilderness. The point is not that all Indigenous societies were alike: their environments, economies, and political structures differed.", "Food production helps explain settlement and power. Agricultural surpluses can support larger populations and people whose work is not food production. That creates possibilities for specialization and hierarchy. The course also treats climate as part of history: favorable or difficult growing conditions affect resources, movement, and survival.", "Europeans entered these existing worlds with commercial and religious ambitions. Portuguese navigators pursued sea routes around Africa toward Asian trade; Columbus proposed a westward route. Norse contact preceded Columbus, but the durable connections after 1492 transformed relations between the continents on a different scale.", "The historian’s problem is evidence. A saga, archaeological site, map, and explorer’s journal do not establish the same things. When a European writer says Indigenous people communicated something “by signs,” the reported message is filtered through his expectations and limited understanding of their language."], "sequence": [["Before 1492", "Indigenous societies develop varied settlements and political systems."], ["c. 1000", "Norse contact with North America precedes Columbus."], ["1492", "Columbus’s voyage begins sustained connections central to the course."]], "terms": [["Cahokia", "A major Mississippian urban center; evidence against an empty-land narrative."], ["Tenochtitlan", "The large Aztec capital encountered by the Spaniards."], ["Source corroboration", "Checking a claim against independent evidence rather than accepting a narrative because it is written."]], "causes": "Agriculture, environment, existing political organization, and European competition shape the encounters that follow.", "result": "European arrival was an encounter with existing societies. Their decisions, alliances, and resistance must remain part of the explanation.", "pitfall": "Do not treat “Indigenous people” as one unified political actor or use “discovery” without explaining whose perspective it represents.", "refs": [[2, 4], [2, 19], [2, 38], [2, 69], [2, 70], [2, 73]], "sourceSlides": [{"deck": "Lecture 2.pptx", "slide": 4, "text": "Indigenous American Population Sizes in 1492 Estimates of the Population of the Americas in 1492 have ranged from 8 million to 112 million. 45 to 55 million is the standard estimate. Population of Western Europe in 1500 was roughly 55 million. Sub-Saharan Africa had a population of roughly 38 million. At least a thousand different indigenous languages in the Americas. 59 language families Roughly 40% in the Aztec Empire, 25% in the Inca Empire and 10% in the Mayan Empire Less than 10% of the indigenous population of the Americas resided in North America "}, {"deck": "Lecture 2.pptx", "slide": 19, "text": "Cahokia and the Mississippians  Cahokia was at its height between 1000 and 1400 CE with a population of 20,000 to 40,000 There were other major Indigenous city centers in Georgia, Alabama and Indiana between 1150 and 1400 CE Intensive corn agriculture- mixed with squash and beans Complex hierarchies Environmental stress led to the collapse of these centers"}, {"deck": "Lecture 2.pptx", "slide": 38, "text": "L'Anse-aux-Meadows, Newfoundland"}, {"deck": "Lecture 2.pptx", "slide": 69, "text": "1488 Bartolomew  Dias sails around the Cape of Good Hope"}, {"deck": "Lecture 2.pptx", "slide": 70, "text": "1498 Vasco de Gama is the first Portuguese sailor to sail from Portugal to India Proving that the Indian Ocean was not land locked"}, {"deck": "Lecture 2.pptx", "slide": 73, "text": "“by signs they made it known” Setting the Stage: Communicating in the New World"}]}, {"topic": "Columbus and conquest", "title": "From exploration to conquest", "question": "How could small European expeditions overthrow large polities—and why did other expeditions fail?", "story": ["Columbus’s westward voyages were shaped by a search for access to Asia, religious expectations, and the pursuit of wealth. The Columbian Exchange describes the movement of crops, animals, people, and diseases following contact. Its significance extends beyond one explorer: it altered environments, diets, labor systems, and populations.", "Spanish conquest built on earlier Iberian warfare and expansion. Cortés’s attack on the Aztecs depended on Indigenous allies who opposed Aztec power. Pizarro’s attack on the Incas occurred amid a civil war and epidemic disruption. Weapons mattered, but alliances, disease, political division, and timing help explain outcomes that technology alone cannot.", "Conquest also involved claims to legitimacy. The Requerimiento linked demands for submission to Spanish religious and political authority. For a source question, examine the document’s claimed authority, intended audience, demands, and justification for violence. You still need the assigned document itself for its wording.", "Many ventures did not reproduce Cortés’s success. Narváez’s Florida expedition encountered catastrophic supply and survival problems. A handful of survivors, including Cabeza de Vaca and Esteban, reached Spanish settlements after years of ordeal. De Soto and Coronado likewise pursued wealth and powerful kingdoms without obtaining the results they expected. For the professor’s Narváez essay, the book supplies essential specific episodes that this lecture summary cannot replace."], "sequence": [["1492 onward", "Sustained Atlantic contact and exchange."], ["1521", "Fall of Tenochtitlan."], ["1528 onward", "Narváez expedition and survivors’ ordeal."], ["1532", "Pizarro captures Atahualpa at Cajamarca."]], "terms": [["Columbian Exchange", "Intercontinental movement of organisms and people, with far-reaching demographic and ecological consequences."], ["Malintze / Doña Marina", "Interpreter associated with Cortés; language and mediation belong in the conquest story."], ["Narváez expedition", "A case for evaluating conquest goals, logistical failure, survival, and later knowledge separately."]], "causes": "Imperial ambition meets local political divisions, disease, logistical constraints, and Indigenous choices.", "result": "Conquest could reshape large polities, but control was uneven and success was never automatic.", "pitfall": "Do not say that a small group of Spaniards defeated an entire empire alone. Do not equate a survivor’s return with achievement of the expedition’s original goals.", "refs": [[3, 1], [4, 21], [4, 24], [4, 34], [4, 36], [4, 39], [4, 41], [4, 42]], "sourceSlides": [{"deck": "Lecture 3.pptx", "slide": 1, "text": "Maps, Mythologies and Monsters: Columbus, the Columbian Exchange and First Encounters between Natives and Europeans"}, {"deck": "Lecture 4.pptx", "slide": 21, "text": "Doña Marina or Malintze"}, {"deck": "Lecture 4.pptx", "slide": 24, "text": "Conquered the Aztecs and their emperor Moctezuma with the help of thousands of native enemies of the Aztecs in 1521 Renamed Tenochtitlan Mexico City and governed Mexico from 1521 to 1524 “I and my companions suffer from a disease of the heart which can be cured only with gold.” ~ Hernán Cortés"}, {"deck": "Lecture 4.pptx", "slide": 34, "text": "Francisco Pizzaro and Atahualpa (1471-1541) 1532- attacked the Incan army and captured their leader, Atahualpa.  Atahualpa offers a room full of gold Atahualpa is tried for treason and executed"}, {"deck": "Lecture 4.pptx", "slide": 36, "text": "Incan Civil War: Key to Victory? The Incas had been embroiled in a Civil War.  The first major smallpox epidemic in the Incan empire claimed the life of the powerful Inca Emperor, Huayna Capac, and his heir apparent before Pizarro arrived Two of the emperor's sons laid claim to the throne:  Huáscar  was selected by the court elite to rule from Cuzco, the traditional Inca capital, and Atahualpa had control of his father's professional army and the newly conquered regions of Ecuador and Columbia"}, {"deck": "Lecture 4.pptx", "slide": 39, "text": " REQUERIMIENTO What strikes you about this document?  Why was it being used?  How do the Spanish justify their right to conquer the land? What do you imagine was the response of the Indigenous people who heard this? "}, {"deck": "Lecture 4.pptx", "slide": 41, "text": "Pánfilo  de  Narváez  (1478-1528) Helped to conquer Jamaica in 1509 and Cuba in 1512 Sent by the governor of Hispaniola to Mexico in 1520 with 1,100 men to defeat the rebellious  Hernán  Cortés and failed.  1527- Named Governor of Florida and sailed there in 1527 with 600 men to explore and conquer- lost almost 200 men along the way to hunger, disease and storms"}, {"deck": "Lecture 4.pptx", "slide": 42, "text": "Pánfilo  de  Narváez  (1478-1528) 1528- Lands in Florida and marches inland with 300 men while his ships were supposed to sail up the coast and meet him- Meets Hostile native Travels back to meet his ships but they had been destroyed in a storm Began an overland trek to Mexico in 1528 with 80 survivors- tried to walk back! 4 of the 80, including one African slave, survived when they finally made it back to a Spanish settlement in 1535. Cabeza  de  Vaca  published a narrative of this journey in which he mentions hearing stories from the natives about El Dorado"}]}, {"topic": "Early English colonies", "title": "Why colonies failed—and Jamestown survived", "question": "What made an overseas settlement durable?", "story": ["Early English ventures sought routes to Asia, wealth, and strategic opportunities against Spain. These expeditions carried experience from England’s campaigns in Ireland. Land claims and settlement were connected to violence, investment, and imperial rivalry, not simply individual adventure.", "Frobisher’s Arctic voyages shifted from searching for a Northwest Passage toward supposed valuable ore. The failure of the ore and settlement projects illustrates how mistaken expectations, climate, logistics, and finance could reinforce one another. This is the Meta Incognita case in the professor’s comparison prompt.", "Roanoke involved separate settlement attempts with different settler populations. Both depended on external supplies and local relations. John White’s return for help became entangled with England’s conflict with Spain. When the English returned in 1590 the settlement was abandoned. The Croatoan inscription supports investigation of relocation, but competing explanations remain uncertain.", "Jamestown began in 1607 under the Virginia Company. Its early years included hunger, mortality, conflict, and reliance on supplies and Indigenous food. Survival was precarious. Tobacco later provided an export crop that supported continued investment and expansion while increasing pressure on land and labor.", "John Smith’s accounts also require source criticism. Compare versions and their dates, ask about his self-presentation, and avoid treating the popular Pocahontas rescue story as a transparent record. Pocahontas’s capture, conversion, marriage to Rolfe, and journey to England connect personal experience to diplomacy and colonial power."], "sequence": [["1570s", "Frobisher’s Arctic voyages."], ["1585", "First Roanoke settlement attempt."], ["1587", "Second Roanoke settlement attempt."], ["1590", "English return finds Roanoke abandoned."], ["1607", "Jamestown founded."], ["1609–1610", "Jamestown’s severe survival crisis."]], "terms": [["Martin Frobisher", "Explorer whose Arctic projects connect passage-seeking, mineral expectations, and failure."], ["Roanoke", "Failed English settlement attempts and a disputed disappearance."], ["Virginia Company", "Joint-stock investment structure supporting Jamestown."], ["John Rolfe", "Associated with tobacco development and marriage to Pocahontas."]], "causes": "Goals, environment, supplies, investment, labor, and Indigenous relations interact. Use the same dimensions when comparing colonies.", "result": "Jamestown’s eventual survival helped expand tobacco cultivation and land seizure. Its outcome does not erase how close it came to failure.", "pitfall": "Do not write three disconnected colony biographies. Compare their resources and problems directly; do not present Roanoke’s fate as settled.", "refs": [[5, 32], [5, 34], [5, 35], [5, 57], [5, 59], [5, 60], [5, 62], [5, 67], [6, 22], [6, 23]], "sourceSlides": [{"deck": "Lecture 5.pptx", "slide": 32, "text": "Martin Frobisher’s Northwest Passage Voyages, 1576 1576- Convinced the Muscovy Company to fund the voyage with Queen Elizabeth’s blessing Reached Baffin Island and met with the Inuit one boat was taken captive by the Inuit  Brought small amounts of fool’s gold back"}, {"deck": "Lecture 5.pptx", "slide": 34, "text": "Martin Frobisher’s Northwest Passage Voyages, 1577 1577- a second and much larger voyage, financed by the Queen set out Frobisher was directed “to defer the future discovery of the passage until another time” and collect gold Brought back over 200 tons of worthless rock"}, {"deck": "Lecture 5.pptx", "slide": 35, "text": "Martin Frobisher’s Northwest Passage Voyage, 1578 Set out with support of the Queen to establish a colony of 100 men in what the Queen called  Meta Incognita Huge expedition- 15 vessels in all Landed first in Greenland Sailed further on into Hudson’s Bay but met with Icy conditions- Tried to establish a small settlement but it failed Frobisher remained convinced that Hudson’s Bay was part of the Northwest Passage but the mission had been such a colossal financial failure that he was never financed again"}, {"deck": "Lecture 5.pptx", "slide": 57, "text": "Roanoke: First Attempt First colony attempted in 1585 with 600 men 100 men were left with Ralph Lane to form a colony Were at war with the Indigenous within a few months Sir Francis Drake tried to deliver slaves he had captured from the Spanish and supplies to the colony Colony was abandoned within a year. The settlers left aboard Drake’s ship A supply ship arrived just days after they left followed by another ship with a large supply of food 15 soldiers from the supply ship were left behind again to secure the coast for the English"}, {"deck": "Lecture 5.pptx", "slide": 59, "text": "The Second Attempt Second colony attempted in 1587  115 settlers came this time but no soldiers They found the remains of the first fort and the bones of one of the fifteen men left behind Settled in the midst of  Croatoan  territory Climate researchers have shown that 1587 was likely worst drought and worst agricultural growing season of any period between 1185 and 1984 in the Carolinas The colonists starts starving again and they started hostilities with the Indigenous"}, {"deck": "Lecture 5.pptx", "slide": 60, "text": "Low on supplies, Governor John White went for help- leaves his daughter and new granddaughter behind The colonists decided to move 50 miles up the coast and they told him Virginia Dare- First English child born in the Americas"}, {"deck": "Lecture 5.pptx", "slide": 62, "text": "Roanoke Colony An English fleet returns to find the Roanoke colony abandoned in 1590 “ Croatoan ” carved into a post and “Cro” into a tree "}, {"deck": "Lecture 5.pptx", "slide": 67, "text": "John Lawson,  A Further Voyage to Carolina , 1709 The Roanoke colonists lived among the Hatteras people of the Outer Banks? “A farther Confirmation of this we have from the Hatteras Indians, who either then lived on  Ronoak -Island, or much frequented it. These tell us, that several of their Ancestors were white People, and could talk in a Book, as we do; the Truth of which is  confirm'd  by gray Eyes being found frequently amongst these Indians, and no others. They value themselves extremely for their Affinity to the English and are ready to do them all friendly Offices. It is probable, that this Settlement  miscarry'd  for want of timely Supplies from England; or thro' the Treachery of the Natives, for we may reasonably suppose that the English were forced to cohabit with them, for Relief and Conversation; and that in process of Time, they  conform'd  themselves to the Manners of their Indian Relations”"}, {"deck": "Lecture 6.pptx", "slide": 22, "text": "Jamestown Island"}, {"deck": "Lecture 6.pptx", "slide": 23, "text": "Virginia Company chartered lands after the second  charterin  1609 stretched from South Carolina to Maine."}]}, {"topic": "Puritans and Salem", "title": "Godly communities and the Salem crisis", "question": "How did beliefs, social organization, and legal procedure interact?", "story": ["Pilgrims and Puritans shared Protestant commitments but differed in their relationship to the Church of England. The Pilgrims were Separatists. Winthrop’s Puritans sought reform and a model godly community. Their migration should not be confused with a commitment to religious pluralism or modern democracy.", "Family migration and population growth helped New England settlements reproduce and expand. Religion shaped household authority, discipline, ideas about childhood, and interpretations of danger. The professor’s childhood prompt requires concrete practices and their religious context; use the Puritan Childhood reading alongside the lectures.", "At Salem in 1692, accusations emerged in a community where the devil was understood as a real danger. War and trauma, local disputes, poverty, nonconformity, and legal procedures supplied additional conditions. Sarah Good’s poverty and Sarah Osborne’s conflicts around property and social expectations give distinct examples of vulnerability.", "Spectral evidence involved claims about an accused person’s apparition afflicting others. Confession and naming others could create incentives that spread accusations. Cotton Mather cautioned against exclusive reliance on spectral evidence while supporting prosecutions; he should not be simplified into either an uncomplicated skeptic or an uncomplicated opponent of the courts.", "The crisis cannot be explained responsibly by one dramatic cause. Medical explanations are retrospective proposals; religious assumptions, legal practices, and local conditions provide different kinds of evidence. Describe how the factors worked together, and use the Godbeer documents to support your explanation."], "sequence": [["1620", "Plymouth settlement."], ["1630", "Winthrop’s migration to Massachusetts Bay."], ["1675–1676", "King Philip’s War."], ["1692–1693", "Salem witchcraft crisis and trials."]], "terms": [["John Winthrop", "Puritan leader associated with Massachusetts Bay and a model godly community."], ["Spectral evidence", "Alleged supernatural manifestations used as evidence against the accused."], ["Tituba", "Enslaved woman accused early in the Salem crisis."], ["Giles Corey", "Pressed while authorities attempted to force a plea."]], "causes": "Religious assumptions make accusations plausible; local tensions and coercive procedures shape whom accusations target and how they multiply.", "result": "Salem exposes how institutions and beliefs could turn suspicion into prosecution. It is a case about evidence, authority, and vulnerability.", "pitfall": "Do not attribute all accusations to one cause. Do not describe Corey’s pressing as an ordinary hanging or assume all accused people confessed.", "refs": [[7, 1], [8, 36], [8, 37], [8, 41], [8, 42], [8, 43], [8, 52], [8, 57], [8, 58], [8, 62], [8, 65], [8, 67]], "sourceSlides": [{"deck": "Lecture 7.pptx", "slide": 1, "text": "A City upon a Hill: John Winthrop and the Puritan Diaspora"}, {"deck": "Lecture 8.pptx", "slide": 36, "text": "Witchcraft and the Salem Witchcraft Trials, February 1692 to May 1693"}, {"deck": "Lecture 8.pptx", "slide": 37, "text": "Over  150 people   arrested and imprisoned 26  went to trial 19  of the accused were hanged (14 women and 5 men) and one man was crushed to death as they tried to force him to enter a plea Salem Trials"}, {"deck": "Lecture 8.pptx", "slide": 41, "text": "Once thought to be an Afro-Caribbean slave Now believed to have been an Indigenous Arawak born in South America She was captured and sold as a slave in Barbados where she first met the Reverend Parris Parris was given Tituba (most likely to settle a debt) by one of his business associates, and she was brought to New England to work in his house as a domestic slave Tituba confessed and claimed that Sarah Goode and Sarah Osbourne had done witchcraft with her Tituba"}, {"deck": "Lecture 8.pptx", "slide": 42, "text": "Daughter of a prosperous innkeeper who committed suicide when Sarah was 17. Sarah was supposed to inherit some of the money when she came of age, but she never did Married a former indentured servant named Daniel Poole Poole died in deep debt 1682. Sarah was expected to pay the debt She married William Good and his lands were seized and sold to pay the debt to creditors By the time of the trials, Sarah and her husband were homeless, destitute and she was reduced to begging for work, food, and shelter from her neighbours Sarah Good[e] (1645-1692)"}, {"deck": "Lecture 8.pptx", "slide": 43, "text": "Sarah Osbourne (1643-1692)  Married a prominent man known as Robert Prince in 1662 but he died in 1674 She hired an Irish indentured servant to help her and then married him  The farm was supposed to be bequeathed to Prince’s sons, but Osbourne upset social norms by taking over the farm and running it with her new husband The case went to court Osbourne stopped attending church and had not attended for three years"}, {"deck": "Lecture 8.pptx", "slide": 52, "text": "After someone concluded that a loss, illness or death had been caused by witchcraft, the accuser would enter a complaint against the alleged witch with the local magistrates. If the accusation was deemed credible, the person would be arrested and brought in for public accusation. If the accused did not confess, they were “pressed” to do so. If the magistrates at this local level were satisfied that the complaint was well-founded, the prisoner was handed over to be dealt with by a superior court. The accused would be examined before a grand jury A person could be indicted on charges of afflicting with witchcraft, or for making an unlawful covenant with the Devil.   Once indicted, the defendant went to trial, sometimes on the same day. Judgment was quick and executions could occur in as little as a week. General Procedure"}, {"deck": "Lecture 8.pptx", "slide": 57, "text": "Confession or Denial? If you confess, you might not be put to death, especially if you identified other accusers  If you confess, your reputation would be destroyed, and you might be put back in jail If you confess, you will lose all your property"}, {"deck": "Lecture 8.pptx", "slide": 58, "text": "Cotton Mather A prominent intellectual who was asked to advise on the trials. Author of  Memorable Providences Relating to Witchcrafts and Possessions  (1689). Told the judges to be careful not to rely purely on “spectral evidence,” but also urged them to carry on with prosecuting suspected witches Writes  Wonders of the Invisible World  (1693) after the trials"}, {"deck": "Lecture 8.pptx", "slide": 62, "text": "The Pressing of Giles Corey (September 1692) He was 81 years old"}, {"deck": "Lecture 8.pptx", "slide": 65, "text": "Some doctors, retrospectively trying to explain the witchcraft hysteria have blamed convulsive ergot poisoning caused by eating rye bread made from grain infected by the fungus Claviceps purpurea (which is the natural substance from which LSD is derived) Can lead to painful muscle spasms and  siezures  and hallucinations Medical Explanations"}, {"deck": "Lecture 8.pptx", "slide": 67, "text": "Two Towns Salem Village was poor, isolated and split by land disputes and rivalries. This is where the accusations started Salem Town was much wealthier and more peaceful"}]}, {"topic": "Indigenous resistance", "title": "Resistance to colonial expansion", "question": "What did Indigenous communities try to defend, and why did outcomes differ?", "story": ["Colonial settlements depended on Indigenous food, trade, and knowledge while taking land and trying to control communities. In Virginia, tobacco expansion, coercive Christianization, and violence intensified conflict. Opechancanough organized major attacks, including the 1622 uprising. Indigenous resistance was strategic action within changing circumstances.", "English retaliation increasingly erased distinctions between friendly and hostile groups. The Virginia Company also fought through pamphlets; narratives of violence could justify further coercion. The Crown revoked the company’s charter in 1624. Keep representation, violence, and institutional change connected.", "The Pequot War shows why a single Native-versus-European divide is misleading. English forces allied with Narragansett and Mohegan groups. At Mystic in 1637, the coalition killed hundreds, and survivors were enslaved. Indigenous political differences shaped both alliance and destruction.", "King Philip’s War in 1675–1676 involved Metacomet’s resistance amid land pressure, attempts at disarmament, and colonial control. The Pueblo Revolt in 1680 arose in a different imperial setting: Spanish religious suppression, tribute and forced labor, land seizure, drought, and punishment of religious leaders. Popé coordinated communities in resistance.", "The Pueblo revolt drove Spaniards out for a period, while reconquest of parts of the region followed in 1692. Compare immediate results with long-term outcomes. Different geography, populations, alliances, and imperial pressures help explain why resistance did not produce one uniform result."], "sequence": [["1622", "Opechancanough’s Virginia uprising."], ["1624", "Virginia Company charter revoked."], ["1637", "Mystic massacre during the Pequot War."], ["1644", "Another major Powhatan attack."], ["1675–1676", "King Philip’s War."], ["1680", "Pueblo Revolt."], ["1692", "Spanish reconquest of parts of the Pueblo region."]], "terms": [["Opechancanough", "Powhatan leader associated with organized resistance in Virginia."], ["Metacomet / King Philip", "Wampanoag leader associated with the 1675–1676 war."], ["Popé", "Leader associated with coordination of the Pueblo Revolt."]], "causes": "Land pressure, coercive labor and tribute, religious interference, and local political relationships shape resistance.", "result": "Resistance could destroy settlements, alter colonial institutions, or temporarily expel imperial rule. Its outcomes changed over time.", "pitfall": "Do not treat all wars as interchangeable or ignore Indigenous allies of Europeans. The notes and slides contain a disputed precise day for the 1622 attack; this guide uses the year rather than drilling that inconsistency.", "refs": [[10, 4], [10, 13], [10, 17], [10, 25], [10, 31], [10, 37], [10, 38], [10, 40], [10, 41], [10, 45]], "sourceSlides": [{"deck": "Lecture 10.pptx", "slide": 4, "text": "Powhatan Revolt, 1622 1618- Powhatan dies and Opechancanough takes command Encroachment on native land with new tobacco growth (arrives in 1617)"}, {"deck": "Lecture 10.pptx", "slide": 13, "text": "The English stopped differentiating between Native groups and between friendly and hostile Natives They went town-to-town killing as many Natives as they could find"}, {"deck": "Lecture 10.pptx", "slide": 17, "text": "1624- The King stepped in and revoked the Virginia Company Charter and took control of Virginia"}, {"deck": "Lecture 10.pptx", "slide": 25, "text": "The Mystic Massacre and the Pequot War (1636-1638) On May 26, 1637- a New England force accompanied by Narragansett and Mohegan allies burned down a Pequot village that they had surrounded. They killed between 400 and 700 men, women and children Survivors were sold into slavery"}, {"deck": "Lecture 10.pptx", "slide": 31, "text": "King Philip’s War The war began when John Sassamon, a Harvard graduate who lived in a “Praying Town” reported that Metacomet or “King Phillip” was organizing an attack on New England towns Sassamon was found dead under a frozen pond  Three of his  Wompanoag  tribe members were arrested and hung  Wompanoag  tribe members attacked a New England town and wiped it out War was underway On March 12, 1676, the Indigenous launched an assault on Plymouth Colony in an effort to wipe out Plymouth Colony- It Failed"}, {"deck": "Lecture 10.pptx", "slide": 37, "text": "Background to the Pueblo Revolt of 1680 There were approximately 40,000 to 60,000 Pueblo natives when the Spanish invaded the region in 1598 and created the first permanent settlement with 129 soldiers and 10 Franciscan monks and a large number of settlers and livestock These Spanish conquistadors were brutal in their punishments of rebellion, enslaving people and cutting off parts of hands and feet. Spanish demanded tribute (taxes) and forced labor Spanish suppressed Pueblo religion."}, {"deck": "Lecture 10.pptx", "slide": 38, "text": "Popé's Rebellion of 1680 The most fertile lands were taken by Spanish colonists, and the Pueblo people were still forced to provide tribute Franciscan monks moved into Pueblo villages, demanding that they convert In the 1670s a drought swept through the region"}, {"deck": "Lecture 10.pptx", "slide": 40, "text": "Popé's Rebellion of 1680 Popé gathered support for a revolt among 46 surrounding towns. The Apache and Navajo joined the revolt, bringing nearly 2,500 natives against 170 Spanish soldiers, concentrated mostly in Santa Fe Popé promised that the ancient gods would return and bring wealth, health and prosperity when the Spanish were slaughtered"}, {"deck": "Lecture 10.pptx", "slide": 41, "text": "Popé's Rebellion of 1680 Popé traveled from town to town and destroyed all Christian artifacts. Planting of wheat and barley was forbidden. Christian marriages were cast aside, and the couples were forced to remarry.  400 colonists were killed The Spanish were surrounded and the water supply was cut off but they were allowed to flee unharmed 2,000 Spanish remaining colonists fled"}, {"deck": "Lecture 10.pptx", "slide": 45, "text": "Popé's Rebellion of  1680 The Spanish, afraid of French encroachments reconquered some of the area in 1692 after 12 years of Pueblo independence. He emphasized negotiation and he offered protection from other Native groups. Some of the people were never reconquered by the Spanish, including the Hopi In 1693, the Pueblo revolted again and there were harsh reprisals  In 169, the Pueblo revolted again and there were harsh reprisals "}]}, {"topic": "Bondage and slavery", "title": "How racial slavery became entrenched", "question": "How do individual lives and legal changes reveal change over time?", "story": ["Slavery existed in the Americas and in Spanish-controlled regions before the arrival of captive Africans in Virginia in 1619. The meaning of a “beginning” depends on geography and on which labor system is being discussed. Do not use one Virginia date as the origin of every form of American bondage.", "Anthony Johnson’s life complicates a static picture. Brought to Virginia in 1621, he later acquired land, used courts, and held enslaved people. After his death, a court ruling described him as an alien on racial grounds in a dispute over land. His life helps show both possibilities for agency and developing exclusion; it does not mean early colonial society was egalitarian.", "Colonial laws increasingly specified and reinforced unequal status. Virginia’s 1662 rule made a child’s condition follow the mother. Barbados’s 1661 code provided a model for codes elsewhere in the British Atlantic. Virginia’s comprehensive 1705 code belongs in this longer process rather than serving as the first existence of slavery.", "Compare institutions precisely. Indentured servitude typically involved a term of service and rights different from hereditary enslavement. Both limited freedom, but they were not legally identical. The Massachusetts Body of Liberties included protections and exceptions permitting captivity and slavery; its title alone is misleading.", "Read legal protection alongside enforcement. A person unable to testify against a white person did not have equal access to remedies. Likewise, abolition of the slave trade is distinct from abolition of slavery. The Week 6 notes blur that distinction around 1808; the slide names the trade. For exact national dates and wording, consult the assigned materials and TA."], "sequence": [["1619", "Captive Africans arrive in Virginia."], ["1621", "Anthony Johnson brought to Virginia."], ["1641", "Massachusetts Body of Liberties."], ["1661", "Barbados slave code."], ["1662", "Virginia maternal-status rule."], ["1705", "Comprehensive Virginia slave code."]], "terms": [["Anthony Johnson", "Case connecting economic agency, legal access, slaveholding, and racial exclusion."], ["Partus sequitur ventrem", "Status follows the mother; central to hereditary bondage."], ["Indenture", "A labor contract with a term of service, distinct from permanent hereditary enslavement."]], "causes": "Demand for labor, plantation production, racial classification, and legal codification reinforce one another across the Atlantic.", "result": "Slavery became a durable system reproduced through birth, law, coercion, and restricted rights. Its development must be explained as a process.", "pitfall": "Do not confuse slave-trade abolition with emancipation, formal protections with effective protection, or servitude with hereditary slavery.", "refs": [[11, 6], [11, 11], [11, 16], [11, 18], [11, 20], [11, 23], [11, 25], [11, 28], [11, 33], [11, 39], [11, 50]], "sourceSlides": [{"deck": "Lecture 11.pptx", "slide": 6, "text": "Puerto Rico  The first African slaves arrived in Puerto Rico in 1513"}, {"deck": "Lecture 11.pptx", "slide": 11, "text": "1619 The first slaves arrived in Virginia in 1619. They were described as “twenty and odd negroes sold out of a  dutch  ship” to settlers in Virginia. "}, {"deck": "Lecture 11.pptx", "slide": 16, "text": "The Life of Anthony Johnson, Part 1 Imported into Virginia in 1621 and  sold  to an Englishman named Bennett as “Antonio a Negro” Grew tobacco on the Bennett family plantation and was one of the few in the colony who survived Opechancanough’s 1622 raid. Was respected for his “Hard labour and known service”"}, {"deck": "Lecture 11.pptx", "slide": 18, "text": "The Life of Anthony Johnson, Part 3 In 1651, Johnson had saved enough to sponsor the entry of five servants into the colony- earning a 250 acre  headright Johnson’s son John earned a patent for 550 acres of land His son Richard owned a 100 acre estate Johnson’s plantation burned to the ground in 1653 and he petitioned a court for relief He was granted an abatement of his land taxes."}, {"deck": "Lecture 11.pptx", "slide": 20, "text": "Anthony Johnson and the Courts in 1670 “By virtue of a  writt  granted to me from [names listed here, which are illegible] John Stringer  Escheator  for the  countys  of  Northhampton  and Accomack to enquire what lands  Anthonio  Johnson late of Accomack County either in his life  tyme . . . a jury of free. . . in the said Accomack County to enquire. . . doth declare that the said Anthony Johnson lately deceased in his life  tyme  was seized of fifty acres of land now in the possession of Rich. Johnson in the County of Accomack aforesaid and further that the said Anthony  Johnson was a negro and by consequence an alien  and for that cause the said land doth escheat to this . . . .” They ruled that his lands belonged to the English Crown"}, {"deck": "Lecture 11.pptx", "slide": 23, "text": "The Emergence of Slave Codes in the British Americas The Barbados slave code of 1661 marked the beginning of the legal codification of slavery in the British Atlantic. The Barbados Assembly re-enacted the slave code, with minor modifications, in 1676, 1682, and 1688.  The Barbados slave code also served as the basis for the slave codes adopted in several other British colonies, including Jamaica (1664), South Carolina (1696), and Antigua (1702) and Virginia (1705)."}, {"deck": "Lecture 11.pptx", "slide": 25, "text": "Partus  Sequitur  Ventrem -  “The Offspring follows the womb” 1662 -Possibility of life servitude for Blacks and hereditary slavery: “Whereas some doubts have arisen whether children got by any Englishmen upon a Negro shall be slave or Free, Be it therefore enacted and declared by this present Grand assembly, that all children born in this country shall be held bond or free only according to the condition of the mother.\""}, {"deck": "Lecture 11.pptx", "slide": 28, "text": "The Comprehensive Virginian Slave Code of 1705 1705 – “All  negroe , mulatto, and Indian slaves shall be held, taken, and adjudged to be real estate.” 1705 -- Dismemberment of unruly or rebellious slaves was made legal."}, {"deck": "Lecture 11.pptx", "slide": 33, "text": "MASSACHUSETTS BODY OF LIBERTIES, 1641 There shall never be any bond slavery, villeinage or captivity amongst us unless it be lawful Captives taken in just wars, and such strangers as willingly sell themselves or are sold to us . And these shall have all the liberties and Christian usages which the law of god established in Israel concerning such persons does morally require. This exempts none from servitude who shall be Judged thereto by Authority. "}, {"deck": "Lecture 11.pptx", "slide": 39, "text": "1525: first slave voyage direct from Africa to the Americas 1780s: Abolitionist protest against the slave trade begins 1788: 1792: 103,000 slaves delivered to the Americas (a new high)  1808: British and US abolition of slave-trade takes effect 1829: 105,000 slaves delivered to the Americas (a new high) 1867: last transatlantic slave voyage sails The Transatlantic Slave Trade 1525 to 1867"}, {"deck": "Lecture 11.pptx", "slide": 50, "text": "Legal Protections Laws were put in place to protect slaves throughout the Americas but slave testimony against a white man was inadmissible in court and no judge, jury or magistrate would convict a slave"}]}, {"topic": "Gentility and empire", "title": "Colonial elites inside the British world", "question": "What did manners, households, and wealth have to do with power?", "story": ["Before independence, prominent mainland colonists could understand themselves as English subjects within an empire. They sought status through education, consumption, manners, and public conduct. Gentility was a claim to social rank and belonging, not simply friendliness.", "William Byrd II provides a case study. His English education, Virginia plantation, ambitions for office, and household relationships connect the mainland to a wider Atlantic elite. Compare public images with private records: his diary and disputes with Lucy reveal authority and hierarchy that an elegant portrait may obscure.", "George Washington’s rules of civility and Benjamin Franklin’s virtues show how conduct could be treated as evidence of character. Washington’s earlier British service also matters. Reading his whole life backward from the presidency would hide the imperial setting and changing loyalties of his youth.", "The household was political in a broad sense: ideals of male authority shaped relationships with wives, children, servants, and enslaved people. Claims of family membership or personal affection did not remove coercion and unequal power. Ask who could make decisions, own property, leave, or appeal to law.", "Mainland colonies were only one part of British priorities. Caribbean sugar generated immense value; the lecture compares it with mainland tobacco exports. That economic context helps explain why imperial wars and peace settlements cannot be understood solely through what mainland colonists wanted."], "sequence": [["Late 1600s–1700s", "Mainland plantation wealth and elite ambitions develop within Atlantic networks."], ["Early–mid 1700s", "Byrd’s life connects English status claims and Virginia hierarchy."], ["1750s", "Washington serves in conflict on the British imperial frontier."]], "terms": [["William Byrd II", "Virginia planter and diarist whose life reveals elite aspirations and hierarchy."], ["Gentility", "Practices and claims of refined conduct tied to rank and authority."], ["Patriarchy", "An organizing ideal of male authority in household and society."]], "causes": "Wealth enables claims to status; cultural practices express and reproduce authority; imperial connections shape opportunity.", "result": "Colonial political culture grew within a hierarchical imperial world. Later national ideals should not be projected backward as universal early beliefs.", "pitfall": "Do not turn every biographical detail into trivia. Explain what the evidence reveals about a wider social pattern.", "refs": [[12, 1], [12, 4], [12, 8], [12, 10], [12, 11], [12, 12], [13, 37]], "sourceSlides": [{"deck": "Lecture 12.pptx", "slide": 1, "text": "Planters, Patriarchs and Politicians Gentility, Civility, Refinement and the Worlds of William Byrd, George Washington, and Benjamin Franklin."}, {"deck": "Lecture 12.pptx", "slide": 4, "text": "Tobacco exports from the mainland colonies were ¼ the value of sugar  exports from the British sugar islands in 1774."}, {"deck": "Lecture 12.pptx", "slide": 8, "text": "William Byrd II (1674-1744) Owned hundreds of enslaved people at the end of his life"}, {"deck": "Lecture 12.pptx", "slide": 10, "text": "The Life of William Byrd II, Part I Born in Virginia in 1674 Sent to London for safekeeping during Bacon’s Rebellion in 1678 Son of an Indian Trader and a Virginia planter on the frontier of Virginia Sent to London to be educated in 1681 Rejected for a position on the Board of Trade in 1696 Returned to Virginia on the death of his father  in 1705 to oversee the plantation"}, {"deck": "Lecture 12.pptx", "slide": 11, "text": "The Life of William Byrd, Part II Took his father’s place on the Virginia Council of State in 1709 Sought the governorship of Virginia and Maryland but could not attain them Wrote and published anonymously  A Discourse Concerning the Plague  in 1719 Was commissioned to survey the dividing line between North Carolina and Virginia in  the 1720s and wrote The  Secret History of the Dividing Line , often considered a classic of Early American literature In 1729, planned to import German-Swiss settlers for \"Land of Eden\" (settlers die when ship founders in  Lynnhaven  Bay)"}, {"deck": "Lecture 12.pptx", "slide": 12, "text": "William and Lucy Lucy and Byrd fought constantly about control over the servants, cards, the library, purchases.  When Lucy died of smallpox in 1716, Byrd suffered greatly. He blamed himself for her death, telling friends and family that he felt God was punishing him for his pride in his wife’s beauty and likeability."}, {"deck": "Lecture 13.pptx", "slide": 37, "text": "Young George Washington and the French and Indian War"}]}, {"topic": "Gentility and empire", "title": "War, trade, and Britain’s growing empire", "question": "Why did victory create new problems for Britain and its colonies?", "story": ["The Anglo-French wars connected North America to Europe, the Caribbean, Africa, and Asia. Commerce, naval power, land claims, religion, and alliances all mattered. Britain increasingly described itself as Protestant, commercial, maritime, and free even as its economy depended on enslaved labor.", "Colonial and imperial goals could diverge. New England soldiers helped capture Louisbourg, but a peace settlement returned it to France. That decision made sense within broader diplomacy while angering those whose local sacrifice and security interests were disregarded.", "Washington’s early career belongs to frontier imperial conflict. Jumonville Glen and Fort Necessity in 1754 and Braddock’s defeat in 1755 precede the later British reversal of fortunes. William Pitt committed major resources to defeating France. Wars were costly, and colonial participation became important.", "The Acadian expulsion illustrates the human consequences of imperial security policy: people were displaced over questions of allegiance and control. Quebec’s fall and the Treaty of Paris shifted imperial possession. France’s preference for retaining Caribbean sugar islands over Canada is evidence of contemporary economic priorities.", "Britain’s victory enlarged the territory it had to administer and defend. The 1763 Proclamation Line belongs to the problem of governing expansion. Later imperial crisis follows after the midterm in the schedule, so understand the connection without letting later events crowd out the material currently being examined. Tuesday’s lecture adds French North America and Louisiana; those unposted notes remain a coverage gap."], "sequence": [["1689–1697", "Nine Years’ War; King William’s War in North America."], ["1701–1713", "War of Spanish Succession; Queen Anne’s War in North America."], ["1745 / 1748", "Louisbourg captured, then returned in a peace settlement."], ["1754–1755", "Washington’s early frontier conflicts and Braddock’s defeat."], ["1755", "Acadian expulsion begins."], ["1759", "Quebec falls."], ["1763", "Treaty of Paris and Proclamation Line."]], "terms": [["Louisbourg", "Fortress whose capture and return reveal diverging colonial and imperial interests."], ["Acadian expulsion", "Forced displacement of French-speaking residents under British rule."], ["Treaty of Paris, 1763", "Settlement reshaping imperial control and exposing priorities."]], "causes": "Competition over land and commerce leads to war; military commitments produce both territorial gains and costs of control.", "result": "A stronger British imperial position created administrative and fiscal pressures. Victory did not resolve every conflict over land, identity, and authority.", "pitfall": "The North American fighting starts in 1754; the wider Seven Years’ War is commonly dated 1756–1763. The lecture uses 1754–1763 for this connected sequence. Keep the scale of the date range clear.", "refs": [[13, 16], [13, 17], [13, 22], [13, 25], [13, 33], [13, 41], [13, 42], [13, 45], [13, 55], [13, 60], [13, 64], [13, 68]], "sourceSlides": [{"deck": "Lecture 13.pptx", "slide": 16, "text": "Throughout the 18 th  century, the British and French were at nearly constant war with each other. They fought six major wars and most of these wars played out on both sides of the Atlantic By the end of the 18 th  century, in large part as a result of these wars, the Atlantic Ocean and the Americas were dominated by the Royal Navy, British commerce and London finance If the 20 th  century was the American century, the 18 th  century was the British century Anglo-French Rivalries and the British Rise to Prominence"}, {"deck": "Lecture 13.pptx", "slide": 17, "text": "By 1750, the British Empire began to be self-defining as Protestant, Commercial, Maritime and Free The Rights of Free-Born Englishmen were continually stressed, and it was said that the air of England was too free for a slave to breathe The rise of the Brits"}, {"deck": "Lecture 13.pptx", "slide": 22, "text": "“King Williams’ War” in North America There was extensive fighting in North America between the French and the English in New England and New York. The French moved an invasion force for  attacking New England into Quebec, but it was too late in the winter for an invasion During the war, the Iroquois allied with the British and attacked French settlements near Montreal, massacring over 300 settlers.  Led to constant raids among the French, English and Natives along the frontier between New England and New France Massachusetts captured Port Royal in Acadia (Nova Scotia) with 700 men raised in the colony but left quickly when a French warship arrived The Salem Witch Hunts take place in 1692!"}, {"deck": "Lecture 13.pptx", "slide": 25, "text": "“Queen Anne’s War” in North America In America, the War of Spanish Succession was sometimes known as Queen Anne’s War. It was an Anglo-American war against French and Spanish colonial possessions on the mainland.  British South Carolina sent forces against Spanish Florida. More raids erupted along the border between New France and New England New Englanders attempted another invasion of New France, but failed when a ship with 700 soldiers ran aground in the St. Lawrence"}, {"deck": "Lecture 13.pptx", "slide": 33, "text": "Most of the the war was fought by privateers in the West Indies who burned each other’s plantations and fields and captured slaves British captured  Louisbourg  in Nova Scotia 1745. New England soldiers played a key role. Louisbourg  was returned to the French in 1748 after the war in exchange for French conquests in the Netherlands New Englanders were outraged! The War of Jenkins’ Ear in North Americas ( 1739-1748)"}, {"deck": "Lecture 13.pptx", "slide": 41, "text": "Battle of Jumonville Glen May 28 th , 1754"}, {"deck": "Lecture 13.pptx", "slide": 42, "text": "Battle of Fort Necessity July 3 rd , 1754"}, {"deck": "Lecture 13.pptx", "slide": 45, "text": "Largest war of the eighteenth-century Happened on a global scale Between 900,000 and 1.4 million were killed Prussia, Britain and Portugal fought against France, Austria, Sweden, Spain, Saxony and Russia (Russia switched sides temporarily in the later years of the war Battles occurred throughout Europe and on the coast of India and in eastern North America, the Northeastern shore of South America, the west coast of Africa and the Caribbean The French were very successful in the early years of the war, winning most of the battles but the tide turned in 1758 The Seven Years’ War (1754-1763)"}, {"deck": "Lecture 13.pptx", "slide": 55, "text": "After terrible losses in the early years of the war Secretary of State William Pitt became determined to spend everything it took to route the French in the Americas and expand the British empire.  The British spent enormous sums of money from 1757 to 1760 and regained much of the Ohio Valley as well as Acadia and Quebec"}, {"deck": "Lecture 13.pptx", "slide": 60, "text": "Britain gained control of French Canada and Acadia, colonies containing approximately 80,000 French-speaking Roman Catholic residents.  The Acadians refused to swear an oath of allegiance. They insisted on remaining neutral and the British grew nervous.  The British forced 7,000 Acadians to leave. Others fled of their own accord.  Thousands of Acadians died in the process from starvation, shipwreck and disease.  The majority of the Acadians went to French Louisiana. Louisiana’s “Cajun” population has its roots in this forced migration.  The Seven Years’ War and Acadian Expulsions"}, {"deck": "Lecture 13.pptx", "slide": 64, "text": "The British offered France a choice of either Canada or the Caribbean islands of Guadeloupe and Martinique, which had been occupied by the British.  France chose to give u[ Canada. Spain traded Florida to Britain to regain Cuba and Manilla Treaty of Paris Negotiations"}, {"deck": "Lecture 13.pptx", "slide": 68, "text": "1763 Proclamation Line"}]}], "cards": [{"id": 0, "topic": "Before 1492", "q": "Why does Cahokia challenge an “empty wilderness” picture of precontact North America?", "a": "It was a large Indigenous urban center, connected to agriculture and organized societies. Explain how urban populations and cultivated landscapes contradict the idea of empty land awaiting Europeans.", "refs": [{"deck": "Lecture 2.pptx", "slide": 16, "text": "Cahokia and the Mississippians"}, {"deck": "Lecture 2.pptx", "slide": 19, "text": "Cahokia and the Mississippians  Cahokia was at its height between 1000 and 1400 CE with a population of 20,000 to 40,000 There were other major Indigenous city centers in Georgia, Alabama and Indiana between 1150 and 1400 CE Intensive corn agriculture- mixed with squash and beans Complex hierarchies Environmental stress led to the collapse of these centers"}, {"deck": "Lecture 2.pptx", "slide": 22, "text": "The population of London in 1100 CE was 15,000 to 18,000"}]}, {"id": 1, "topic": "Before 1492", "q": "How can a surplus of food change a society?", "a": "A surplus supports people doing work other than food production, larger settlements, and social hierarchies. Connect the material conditions to political and social organization.", "refs": [{"deck": "Lecture 2.pptx", "slide": 6, "text": "Global Agriculture and Husbandry 5 leading cereal crops: wheat, corn, rice, barley, sorghum Most widespread domesticated livestock species: cows, sheep, goats, pigs and horses Grain allows for a surplus of calories, and it tends to lead to social stratification"}, {"deck": "Lecture 2.pptx", "slide": 7, "text": "American Husbandry and Cereal Crops Mesoamerica: Turkey and Dog and Corn Central Andes: Llama, Alpaca and Guinea Pig and Corn"}]}, {"id": 2, "topic": "Before 1492", "q": "What is the difference between evidence of Norse contact and a saga about that contact?", "a": "Archaeological evidence and oral narratives are different kinds of sources. Ask when a narrative was recorded, how it was transmitted, and what independent evidence corroborates it; do not treat every saga detail as verified.", "refs": [{"deck": "Lecture 2.pptx", "slide": 38, "text": "L'Anse-aux-Meadows, Newfoundland"}, {"deck": "Lecture 2.pptx", "slide": 45, "text": "Maine Penny"}, {"deck": "Lecture 2.pptx", "slide": 46, "text": "Karlsefni  and his people sailed to the mouth of the river, and called the land Hop. There they found fields of wild wheat wherever there were low grounds; and the vine in all places were there was rough rising ground. Every rivulet there was full of fish. They made holes where the land and water joined and where the tide went highest; and when it ebbed they found halibut in the holes. There was great plenty of wild animals of every form in the wood. They were there half a month, amusing themselves, and not becoming aware of anything. Their cattle they had with them. And early one morning, as they looked around, they beheld nine canoes made of hides, and snout-like staves were being brandished from the boats, and they made a noise like flails, and twisted round in the direction of the sun's motion. Vikings and  Skraelings : The Saga of Erik the Red"}, {"deck": "Lecture 2.pptx", "slide": 47, "text": "Then  Karlsefni  said, \"What will this betoken?\"  Snorri  answered him, \"It may be that it is a token of peace; let us take a white shield and go to meet them.\" And so they did. Then did they in the canoes row forwards, and showed surprise at them, and came to land. They were short men, ill-looking, with their hair in disorderly fashion on their heads; they were large-eyed and had broad cheeks. And they stayed there awhile in astonishment. Afterwards they rowed away to the south, off the headland. The Saga of Erik the Red"}]}, {"id": 3, "topic": "Before 1492", "q": "Why did Europeans want alternative routes to Asia?", "a": "Trade in Asian goods, competition among European powers, and obstacles to existing routes encouraged oceanic exploration. Portugal pursued the route around Africa; Columbus proposed sailing west.", "refs": [{"deck": "Lecture 2.pptx", "slide": 54, "text": "1453: Ottoman Empire captures Constantinople (modern day Istanbul)- barring access to the silk road and overland trade with the far east"}, {"deck": "Lecture 2.pptx", "slide": 69, "text": "1488 Bartolomew  Dias sails around the Cape of Good Hope"}, {"deck": "Lecture 2.pptx", "slide": 70, "text": "1498 Vasco de Gama is the first Portuguese sailor to sail from Portugal to India Proving that the Indian Ocean was not land locked"}]}, {"id": 4, "topic": "Before 1492", "q": "Why is “by signs they made it known” a source-analysis problem?", "a": "An explorer’s account presents his interpretation of gestures rather than a transparent record of Indigenous intentions. Language barriers, expectations, and the writer’s interests could shape the reported meaning.", "refs": [{"deck": "Lecture 2.pptx", "slide": 73, "text": "“by signs they made it known” Setting the Stage: Communicating in the New World"}, {"deck": "Lecture 2.pptx", "slide": 74, "text": "From signs, “we understood that they asked us if we had come from heaven.” “they said, according to the signs which they made,...the people of the place gather gold on the shore at night with candles, and afterwards...with a mallet they make bars of” Columbus “Talks” to the “Indians”"}, {"deck": "Lecture 2.pptx", "slide": 75, "text": "“Due to the lack of language...we were unable to find out by signs or gestures how much religious faith these people possess” but “We think that they have neither religion nor laws, that they do not know of a First Cause or Author” Verrazano “Talks” to the Natives"}]}, {"id": 5, "topic": "Columbus and conquest", "q": "How could myths influence exploration even when those myths were false?", "a": "Stories such as Prester John and mythical islands shaped what Europeans expected to find and motivated real voyages. Distinguish what an actor believed from what the historian can establish.", "refs": [{"deck": "Lecture 3.pptx", "slide": 7, "text": "India? Central Asia Ethiopia? Earthly Paradise? Fountain of Youth? Prester  John"}, {"deck": "Lecture 3.pptx", "slide": 8, "text": "The Legend Gains Strength Prester  John’s Letter (circa 1165)? Pope Alexander III sent a reply in 1177"}, {"deck": "Lecture 3.pptx", "slide": 13, "text": "The Voyage of Marco Polo (1254-1324) Polo left Venice to travel through the Mongolian empire, including China, in 1271. He returned 24 years later. Many people questioned whether he was telling the truth."}, {"deck": "Lecture 3.pptx", "slide": 17, "text": "Mythical Islands John Mandeville after travelling in 1488 claimed there were 5,000 islands east of Asia Marco Polo claimed 12,700 islands in the Indie Sea and 7,459 in the China Sea Arab geographers claimed 5,000 islands off the coast of Asia"}]}, {"id": 6, "topic": "Columbus and conquest", "q": "What was the Columbian Exchange, and why does it matter beyond one voyage?", "a": "The movement of organisms, crops, people, and diseases between previously separated regions transformed diets, environments, labor, and populations. Include consequences on both sides of the Atlantic.", "refs": [{"deck": "Lecture 3.pptx", "slide": 1, "text": "Maps, Mythologies and Monsters: Columbus, the Columbian Exchange and First Encounters between Natives and Europeans"}]}, {"id": 7, "topic": "Columbus and conquest", "q": "Why is “European weapons alone explain conquest” insufficient?", "a": "Indigenous alliances and political divisions, epidemic disease, and local circumstances mattered alongside weapons. Use Cortés’s allies and the Inca civil war as distinct pieces of evidence.", "refs": [{"deck": "Lecture 4.pptx", "slide": 24, "text": "Conquered the Aztecs and their emperor Moctezuma with the help of thousands of native enemies of the Aztecs in 1521 Renamed Tenochtitlan Mexico City and governed Mexico from 1521 to 1524 “I and my companions suffer from a disease of the heart which can be cured only with gold.” ~ Hernán Cortés"}, {"deck": "Lecture 4.pptx", "slide": 36, "text": "Incan Civil War: Key to Victory? The Incas had been embroiled in a Civil War.  The first major smallpox epidemic in the Incan empire claimed the life of the powerful Inca Emperor, Huayna Capac, and his heir apparent before Pizarro arrived Two of the emperor's sons laid claim to the throne:  Huáscar  was selected by the court elite to rule from Cuzco, the traditional Inca capital, and Atahualpa had control of his father's professional army and the newly conquered regions of Ecuador and Columbia"}, {"deck": "Lecture 4.pptx", "slide": 37, "text": "Incan Civil War Early in 1532, Atahualpa's army defeated Huáscar's army and captured and executed its leader.  The conquistadores arrived at that moment and executed Atahualpa and placed the half-brother of Huáscar back on the throne as a puppet government. Pizzaro took his wife captive."}]}, {"id": 8, "topic": "Columbus and conquest", "q": "How did Cortés benefit from Indigenous politics?", "a": "He enlisted thousands of Indigenous enemies of the Aztecs. Indigenous groups pursued their own interests; conquest cannot be reduced to a unified European side fighting a unified Indigenous side.", "refs": [{"deck": "Lecture 4.pptx", "slide": 21, "text": "Doña Marina or Malintze"}, {"deck": "Lecture 4.pptx", "slide": 24, "text": "Conquered the Aztecs and their emperor Moctezuma with the help of thousands of native enemies of the Aztecs in 1521 Renamed Tenochtitlan Mexico City and governed Mexico from 1521 to 1524 “I and my companions suffer from a disease of the heart which can be cured only with gold.” ~ Hernán Cortés"}]}, {"id": 9, "topic": "Columbus and conquest", "q": "How did the Inca civil war affect Pizarro’s conquest?", "a": "Conflict within the Inca polity and disease weakened and divided resistance. Connect this context to the capture of Atahualpa rather than presenting Spanish victory as inevitable.", "refs": [{"deck": "Lecture 4.pptx", "slide": 34, "text": "Francisco Pizzaro and Atahualpa (1471-1541) 1532- attacked the Incan army and captured their leader, Atahualpa.  Atahualpa offers a room full of gold Atahualpa is tried for treason and executed"}, {"deck": "Lecture 4.pptx", "slide": 36, "text": "Incan Civil War: Key to Victory? The Incas had been embroiled in a Civil War.  The first major smallpox epidemic in the Incan empire claimed the life of the powerful Inca Emperor, Huayna Capac, and his heir apparent before Pizarro arrived Two of the emperor's sons laid claim to the throne:  Huáscar  was selected by the court elite to rule from Cuzco, the traditional Inca capital, and Atahualpa had control of his father's professional army and the newly conquered regions of Ecuador and Columbia"}, {"deck": "Lecture 4.pptx", "slide": 37, "text": "Incan Civil War Early in 1532, Atahualpa's army defeated Huáscar's army and captured and executed its leader.  The conquistadores arrived at that moment and executed Atahualpa and placed the half-brother of Huáscar back on the throne as a puppet government. Pizzaro took his wife captive."}]}, {"id": 10, "topic": "Columbus and conquest", "q": "What should you ask when analyzing the Requerimiento?", "a": "Who claimed authority, who was addressed, what submission was demanded, and how violence was justified. Use the assigned document for its actual wording; a lecture heading does not replace reading it.", "refs": [{"deck": "Lecture 4.pptx", "slide": 39, "text": " REQUERIMIENTO What strikes you about this document?  Why was it being used?  How do the Spanish justify their right to conquer the land? What do you imagine was the response of the Indigenous people who heard this? "}]}, {"id": 11, "topic": "Columbus and conquest", "q": "Evaluate the Narváez expedition against its intended goals.", "a": "Separate conquest and wealth goals from the survival of a few participants and the later production of knowledge. Support your judgment with logistics, disease, storms, food, and Indigenous encounters; return to A Land So Strange for detailed evidence.", "refs": [{"deck": "Lecture 4.pptx", "slide": 41, "text": "Pánfilo  de  Narváez  (1478-1528) Helped to conquer Jamaica in 1509 and Cuba in 1512 Sent by the governor of Hispaniola to Mexico in 1520 with 1,100 men to defeat the rebellious  Hernán  Cortés and failed.  1527- Named Governor of Florida and sailed there in 1527 with 600 men to explore and conquer- lost almost 200 men along the way to hunger, disease and storms"}, {"deck": "Lecture 4.pptx", "slide": 42, "text": "Pánfilo  de  Narváez  (1478-1528) 1528- Lands in Florida and marches inland with 300 men while his ships were supposed to sail up the coast and meet him- Meets Hostile native Travels back to meet his ships but they had been destroyed in a storm Began an overland trek to Mexico in 1528 with 80 survivors- tried to walk back! 4 of the 80, including one African slave, survived when they finally made it back to a Spanish settlement in 1535. Cabeza  de  Vaca  published a narrative of this journey in which he mentions hearing stories from the natives about El Dorado"}, {"deck": "Lecture 4.pptx", "slide": 43, "text": "Narváez Expedition (1528-1535)"}]}, {"id": 12, "topic": "Columbus and conquest", "q": "Why do de Soto and Coronado fit a broader pattern rather than isolated adventures?", "a": "They pursued wealth and imagined wealthy polities, adapting earlier conquest expectations to unfamiliar regions. Their costly failures show the limits of those expectations and of European control.", "refs": [{"deck": "Lecture 4.pptx", "slide": 47, "text": "The Final Expedition of Hernando de Soto (1500-1542) 1537/38: Hernando De Soto gathered together 950 armed soldiers, priests and 10 ships 1538 April 6: The Hernando De Soto expedition left  Sanlucar , Spain for the Americas 1538: The expedition landed at Santiago de Cuba 1538/39 De Soto had been given the title Governor of Cuba. He spent some months in Cuba preparing for the voyage to Florida"}, {"deck": "Lecture 4.pptx", "slide": 48, "text": "1539: May 30 Hernando De Soto arrived on the west coast of Florida with 1000 men (at least 700 of them were experienced soldiers) 1538/42: Hernando De Soto explored the area and searched for gold and silver.  1542: Hernando De Soto died of a fever on May 21, 1542. He was buried on the banks of the Mississippi River"}, {"deck": "Lecture 4.pptx", "slide": 49, "text": "Two Questions “Who is the biggest and wealthiest prince in your land and where is he?” “Where can I find this? [pointing to silver and gold]” Captured chiefs wherever they went as ransom Started killing entire villages"}, {"deck": "Lecture 4.pptx", "slide": 52, "text": "Searched for riches that he never found First to discover the Grand Canyon Was searching for the fabled cities of Cibola and El Dorado"}, {"deck": "Lecture 4.pptx", "slide": 54, "text": "Coronado was financially ruined by the expedition, which was a failure Covered more distance by land than any other explorer in the New World"}]}, {"id": 13, "topic": "Early English colonies", "q": "How did the Little Ice Age affect colonial survival?", "a": "Cold, shorter growing conditions, and food shortages increased vulnerability. Climate interacted with inadequate supplies and local relations; it is a contributing cause rather than a complete explanation.", "refs": [{"deck": "Lecture 5.pptx", "slide": 7, "text": "Little Ice Age 16 th  to 19 th  centuries May have begun as early as 1250 1315- Great Famine 1550- Worldwide Glacial expansion 1650- peak of the Little Ice Age"}, {"deck": "Lecture 5.pptx", "slide": 9, "text": "European Settlement and the Little Ice Age Settlement in North America may have been more difficult during this period The famines in Jamestown (the first permanent English settlement) were connected to severe frosts"}, {"deck": "Lecture 5.pptx", "slide": 10, "text": "Severe Winters \"The cold began on January 6, 1709, and lasted in all its rigor until the twenty-fourth. The crops that had been sewn were all completely destroyed.... Most of the hens had died of cold, as had the beasts in the stables. When any poultry did survive the cold, their combs were seen to freeze and fall off. Many birds, ducks,  partidges , woodcock, and blackbirds died and were found on the roads and on the thick ice and frequent snow. Oaks, ashes, and other valley trees split with cold. Two thirds of the vines died.... No grape harvest was gathered at all in Anjou.... I myself did not get enough wine from my vineyard to fill a nutshell.\""}]}, {"id": 14, "topic": "Early English colonies", "q": "How did English colonization of Ireland connect to colonization in America?", "a": "Personnel, ideas about “civilizing” others, settlement practices, and coercive tactics crossed between projects. Gilbert and other explorers had participated in campaigns in Ireland.", "refs": [{"deck": "Lecture 5.pptx", "slide": 25, "text": "England’s First New World: England and the Conquest of Ireland"}, {"deck": "Lecture 5.pptx", "slide": 27, "text": "Ireland: The First New World Before 1640, more than 100,000 Englishmen and Scots moved to Ireland to settle the plantations.  Before 1640, more English and Scots moved to Ireland than moved to the Americas"}, {"deck": "Lecture 5.pptx", "slide": 28, "text": "Sir Humphrey Gilbert (1539-1583) Participated in the suppression of Ireland  Writes A Discourse of a  Discoverie  for a New Passage to  Cataia  in 1566- Insists that the Northwest passage exists  1578: Was given a charter by Queen Elizabeth to explore and colonize any territory “unclaimed by Christian Kingdoms” Sails to find Northwest Passage in 1578- colossal failure 1583: Tries again and claims St. John’s Newfoundland as a colony under his control in 1583 St. John’s harbor was already filled with English fishermen! Died at sea returning to England"}, {"deck": "Lecture 5.pptx", "slide": 29, "text": "Gilbert in Ireland  \"The  heddes  of all those (of who sort soever  thei  were) which were killed in the  daie , should be  cutte  off from their bodies and brought to the place where he  incamped  at night, and should there bee  laied  on the ground by  eche  side of the  waie   ledying  into his  owne   tente  so that none could come into his  tente  for any cause but commonly he  muste  passe through a lane of  heddes  which he used  ad terrorem ...[It brought]  greate   terrour  to the people when  thei   sawe  the  heddes  of their  dedde  fathers, brothers, children,  kindsfolke , and  freinds ...” Advocated killing of non-combatant Irish women because it would help to “kill the men of war by famine”"}]}, {"id": 15, "topic": "Early English colonies", "q": "Why is Frobisher an important identification rather than just a name?", "a": "An English explorer pursuing a Northwest Passage whose voyages turned toward supposed precious ore and Arctic settlement. His failure illustrates the interaction of trade ambitions, mistaken expectations, finance, and environment.", "refs": [{"deck": "Lecture 5.pptx", "slide": 30, "text": "Martin Frobisher (1535-1594)"}, {"deck": "Lecture 5.pptx", "slide": 32, "text": "Martin Frobisher’s Northwest Passage Voyages, 1576 1576- Convinced the Muscovy Company to fund the voyage with Queen Elizabeth’s blessing Reached Baffin Island and met with the Inuit one boat was taken captive by the Inuit  Brought small amounts of fool’s gold back"}, {"deck": "Lecture 5.pptx", "slide": 34, "text": "Martin Frobisher’s Northwest Passage Voyages, 1577 1577- a second and much larger voyage, financed by the Queen set out Frobisher was directed “to defer the future discovery of the passage until another time” and collect gold Brought back over 200 tons of worthless rock"}, {"deck": "Lecture 5.pptx", "slide": 35, "text": "Martin Frobisher’s Northwest Passage Voyage, 1578 Set out with support of the Queen to establish a colony of 100 men in what the Queen called  Meta Incognita Huge expedition- 15 vessels in all Landed first in Greenland Sailed further on into Hudson’s Bay but met with Icy conditions- Tried to establish a small settlement but it failed Frobisher remained convinced that Hudson’s Bay was part of the Northwest Passage but the mission had been such a colossal financial failure that he was never financed again"}]}, {"id": 16, "topic": "Early English colonies", "q": "What changed between the first and second Roanoke attempts?", "a": "The first emphasized men and soldiers; the second included a different settler population. Both faced supply and survival problems. Distinguish the attempts rather than combining them into one story.", "refs": [{"deck": "Lecture 5.pptx", "slide": 57, "text": "Roanoke: First Attempt First colony attempted in 1585 with 600 men 100 men were left with Ralph Lane to form a colony Were at war with the Indigenous within a few months Sir Francis Drake tried to deliver slaves he had captured from the Spanish and supplies to the colony Colony was abandoned within a year. The settlers left aboard Drake’s ship A supply ship arrived just days after they left followed by another ship with a large supply of food 15 soldiers from the supply ship were left behind again to secure the coast for the English"}, {"deck": "Lecture 5.pptx", "slide": 58, "text": "The colonists were looking for gold and silver  They spread smallpox and other diseases"}, {"deck": "Lecture 5.pptx", "slide": 59, "text": "The Second Attempt Second colony attempted in 1587  115 settlers came this time but no soldiers They found the remains of the first fort and the bones of one of the fifteen men left behind Settled in the midst of  Croatoan  territory Climate researchers have shown that 1587 was likely worst drought and worst agricultural growing season of any period between 1185 and 1984 in the Carolinas The colonists starts starving again and they started hostilities with the Indigenous"}, {"deck": "Lecture 5.pptx", "slide": 60, "text": "Low on supplies, Governor John White went for help- leaves his daughter and new granddaughter behind The colonists decided to move 50 miles up the coast and they told him Virginia Dare- First English child born in the Americas"}]}, {"id": 17, "topic": "Early English colonies", "q": "What can you confidently say about Roanoke’s disappearance?", "a": "The settlement was abandoned when the English returned in 1590, with a Croatoan inscription. Competing explanations exist. Weigh evidence for relocation or incorporation into Indigenous communities without claiming certainty.", "refs": [{"deck": "Lecture 5.pptx", "slide": 62, "text": "Roanoke Colony An English fleet returns to find the Roanoke colony abandoned in 1590 “ Croatoan ” carved into a post and “Cro” into a tree "}, {"deck": "Lecture 5.pptx", "slide": 64, "text": "Where did they go? The missing colonists…..vanished without a trace…. Murdered by the Spanish? Murdered by the local Indigenous? Murdered by neighboring Indigenous? Died of disease? Died of starvation? Incorporated into Indigenous society? Sailed for England and drowned? A mix of the above?"}, {"deck": "Lecture 5.pptx", "slide": 65, "text": "John Smith’s Map (Zúñiga Map} The Powhatan natives told John Smith about places nearby where men wore European dress and had two  storey  walled houses "}, {"deck": "Lecture 5.pptx", "slide": 66, "text": "Massacred by Powhatan? 1609- The English Royal Council was told by someone that the Powhatans had killed the remaining colonists from Roanoke 1610- A colonist in Jamestown reported that the Powhatans had killed the Roanoke colonists shortly before the Jamestown settlers arrived because the leader had been told by his priests that a nation would rise in Chesapeake Bay to threaten his power"}, {"deck": "Lecture 5.pptx", "slide": 67, "text": "John Lawson,  A Further Voyage to Carolina , 1709 The Roanoke colonists lived among the Hatteras people of the Outer Banks? “A farther Confirmation of this we have from the Hatteras Indians, who either then lived on  Ronoak -Island, or much frequented it. These tell us, that several of their Ancestors were white People, and could talk in a Book, as we do; the Truth of which is  confirm'd  by gray Eyes being found frequently amongst these Indians, and no others. They value themselves extremely for their Affinity to the English and are ready to do them all friendly Offices. It is probable, that this Settlement  miscarry'd  for want of timely Supplies from England; or thro' the Treachery of the Natives, for we may reasonably suppose that the English were forced to cohabit with them, for Relief and Conversation; and that in process of Time, they  conform'd  themselves to the Manners of their Indian Relations”"}]}, {"id": 18, "topic": "Early English colonies", "q": "How did the Spanish Armada affect Roanoke?", "a": "War delayed English relief efforts. Connect an Atlantic imperial conflict to a vulnerable colony’s supply problems rather than treating the settlement as isolated.", "refs": [{"deck": "Lecture 5.pptx", "slide": 60, "text": "Low on supplies, Governor John White went for help- leaves his daughter and new granddaughter behind The colonists decided to move 50 miles up the coast and they told him Virginia Dare- First English child born in the Americas"}, {"deck": "Lecture 5.pptx", "slide": 61, "text": "Defeat of the Spanish Armada, 1588"}, {"deck": "Lecture 5.pptx", "slide": 62, "text": "Roanoke Colony An English fleet returns to find the Roanoke colony abandoned in 1590 “ Croatoan ” carved into a post and “Cro” into a tree "}]}, {"id": 19, "topic": "Early English colonies", "q": "Why should you question John Smith’s Pocahontas rescue narrative?", "a": "Compare the timing and content of his accounts, his self-presentation, and corroboration. A dramatic later story does not automatically establish what happened at the encounter.", "refs": [{"deck": "Lecture 6.pptx", "slide": 13, "text": "Captain John Smith"}, {"deck": "Lecture 6.pptx", "slide": 14, "text": "John Smith  (1580 -1631) Left home at 16 to work at sea  and fought as a privateer Fought as a mercenary against the Spanish in the Dutch revolt Fought as a mercenary for Austria against the Ottoman empire Fought for Transylvania against the Ottomans and was knighted"}, {"deck": "Lecture 6.pptx", "slide": 15, "text": "John Smith Caught during a battle in 1602 and was sold as an Ottoman slave Traveled to Russia and then Poland and then North Africa before returning to England Helped settle the Jamestown colony in 1607 Returned to England in 1610  Returned to explore the coast of New England in 1614"}]}, {"id": 20, "topic": "Early English colonies", "q": "Why did Jamestown’s s
